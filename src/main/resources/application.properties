# ==========================================
# OAuth2 - Google Login
# ==========================================
spring.security.oauth2.client.registration.google.client-id=491176070043-ae530sffu4nqsqd86b8pbmjfa2qor6hs.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
# Không set redirect-uri — để Spring Security dùng default:
# {baseUrl}/login/oauth2/code/google
# {baseUrl} = scheme + host + port từ request thực tế
# Với server.port=8084 → http://localhost:8084/login/oauth2/code/google
# Khi chạy sau reverse proxy (Nginx), forward-headers-strategy=framework
# giúp Spring Boot nhận đúng scheme=https + host=dealxanh.com
# → redirect URI = https://dealxanh.com/login/oauth2/code/google

# ==========================================
# Reverse Proxy / Forwarded Headers
# ==========================================
server.forward-headers-strategy=framework

# ==========================================
# Session Cookie
# ==========================================
# Security best practices for cookie config
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax
# Dev: chạy HTTP nên cookie secure=false
# Production HTTPS (dealxanh.com): đổi thành true
server.servlet.session.cookie.secure=false

# ==========================================
# Session - JDBC backed (survives app restarts)
# ==========================================
server.servlet.session.timeout=90m
server.servlet.session.cookie.max-age=90m
server.servlet.session.tracking-modes=cookie
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION

