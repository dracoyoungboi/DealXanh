<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm — DealXanh Seller</title>
    <div th:replace="~{common/admin/css :: css}"></div>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root{--primary:#0d5c2e;--primary-dark:#08421f;--surface:#fff;--bg:#f5f6f8;--text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;--border:#e0e0e0;--border-light:#f0f0f0;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;--info:#3b82f6;--purple:#8b5cf6;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-full:9999px;--font:'Inter',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);padding-bottom:70px}

.page-header{background:var(--primary);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.back-btn{color:#fff;display:flex;align-items:center}
.back-btn svg{width:20px;height:20px}
.header-title{font-size:18px;font-weight:700;flex:1}
.hdr-btn{width:36px;height:36px;border-radius:var(--radius-md);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}

.content{padding:16px}
.alert{padding:10px 14px;border-radius:var(--radius-md);margin-bottom:12px;font-size:13px;font-weight:600}
.alert.success{background:rgba(16,185,129,.1);color:var(--success)}
.alert.error{background:rgba(239,68,68,.1);color:var(--danger)}

/* Products */
.product-list{display:flex;flex-direction:column;gap:10px}
.product-card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:all .2s}
.product-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:var(--primary)}
.product-img{width:64px;height:64px;border-radius:var(--radius-md);object-fit:cover;flex-shrink:0;background:var(--bg)}
.product-info{flex:1;min-width:0}
.product-name{font-size:15px;font-weight:700;margin-bottom:3px}
.product-meta{font-size:12px;color:var(--text-secondary);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.product-price{font-size:16px;font-weight:800;color:var(--primary)}
.stock-in{color:var(--success);font-weight:600}
.stock-out{color:var(--danger);font-weight:600}
.status-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--radius-full)}
.badge-success{background:rgba(16,185,129,.1);color:var(--success)}
.badge-warning{background:rgba(245,158,11,.1);color:var(--warning)}
.badge-danger{background:rgba(239,68,68,.1);color:var(--danger)}
.badge-info{background:rgba(59,130,246,.1);color:var(--info)}

.empty-state{text-align:center;padding:60px 20px}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:0.2}
.empty-state h3{font-size:18px;font-weight:700;margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--text-secondary);margin-bottom:16px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;border:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:var(--surface);color:var(--primary);border:1px solid var(--primary)}
.btn-sm{padding:6px 12px;font-size:11px}

.fab{position:fixed;bottom:80px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(13,92,46,.4);z-index:10;text-decoration:none}
.fab svg{width:24px;height:24px}

/* Modal */
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5);overflow-y:auto}
.modal.active{display:flex;align-items:center;justify-content:center;padding:16px}
.modal-content{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:var(--radius-md);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border-light);display:flex;gap:8px;justify-content:flex-end}

.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text-secondary)}
.detail-value{font-weight:600;text-align:right}
.deal-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--radius-full);font-size:11px;font-weight:600;margin:2px 4px 2px 0}
.deal-tag.platform{background:rgba(139,92,246,.1);color:var(--purple)}
.deal-tag.store{background:rgba(13,92,46,.1);color:var(--primary)}
.price-final{font-size:22px;font-weight:800;color:var(--danger)}
.price-original{font-size:14px;color:var(--text-tertiary);text-decoration:line-through;margin-left:8px}

.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.form-input{width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px}
.form-input:focus{outline:none;border-color:var(--primary)}
.form-select{width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--surface)}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border-light);padding:8px 0;z-index:20}
.bottom-nav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;text-decoration:none}
.bottom-nav .nav-item svg{width:22px;height:22px;color:var(--text-tertiary)}
.bottom-nav .nav-item span{font-size:10px;font-weight:500;color:var(--text-tertiary)}
.bottom-nav .nav-item.active svg,.bottom-nav .nav-item.active span{color:var(--primary)}
    </style>
</head>
<body>

<header class="page-header">
    <a class="back-btn" href="/seller/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </a>
    <span class="header-title">Quản lý Sản phẩm</span>
    <a class="hdr-btn" href="/seller/products/create">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
</header>

<div class="content">
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <!-- KPI -->
    <div class="kpi-row" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">
        <div style="background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:20px;text-align:center;">
            <div style="font-size:32px;font-weight:800;color:var(--primary);" th:text="${totalProducts}">0</div>
            <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">Tổng sản phẩm</div>
        </div>
        <div style="background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:20px;text-align:center;">
            <div style="font-size:32px;font-weight:800;color:var(--success);" th:text="${approvedCount}">0</div>
            <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">Đã duyệt</div>
        </div>
        <div style="background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:20px;text-align:center;">
            <div style="font-size:32px;font-weight:800;color:var(--warning);" th:text="${pendingCount}">0</div>
            <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">Chờ duyệt</div>
        </div>
    </div>

    <!-- Filter bar -->
    <form method="get" th:action="@{/seller/products}" style="display:flex;gap:8px;margin-bottom:14px;">
        <input type="text" name="search" placeholder="Tìm sản phẩm..." th:value="${searchQuery}" style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;background:var(--surface);">
        <select name="status" onchange="this.form.submit()" style="padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;background:var(--surface);min-width:110px;">
            <option value="">Tất cả</option>
            <option value="active" th:selected="${selectedStatus == 'active'}">Đang bán</option>
            <option value="inactive" th:selected="${selectedStatus == 'inactive'}">Ngừng bán</option>
            <option value="outofstock" th:selected="${selectedStatus == 'outofstock'}">Hết hàng</option>
        </select>
        <select name="categoryId" onchange="this.form.submit()" style="padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;background:var(--surface);min-width:120px;">
            <option value="">Tất cả DM</option>
            <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}" th:selected="${selectedCategory != null && selectedCategory.toString() == cat.categoryId.toString()}"></option>
        </select>
        <button type="submit" style="padding:10px 14px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:13px;font-weight:600;cursor:pointer;">Tìm</button>
    </form>

    <!-- Product list -->
    <div class="product-list" th:if="${products != null and !products.isEmpty()}">
        <div class="product-card" th:each="product : ${products}" th:onclick="|viewProductDetail(${product.productId})|">
            <img th:src="${product.imageUrl != null ? product.imageUrl : '/img/default-product.svg'}" alt="" class="product-img" onerror="this.src='/img/default-product.svg'">
            <div class="product-info">
                <div class="product-name" th:text="${product.name}">Name</div>
                <div class="product-meta">
                    <span th:if="${product.category != null}" th:text="${product.category.name}">Category</span>
                    <span th:class="${product.stockQuantity > 0 ? 'stock-in' : 'stock-out'}" th:text="${product.stockQuantity > 0 ? 'Còn ' + product.stockQuantity : 'Hết hàng'}">Stock</span>
                    <span class="status-badge" th:class="${product.approvalStatus == 'APPROVED' ? 'badge-success' : product.approvalStatus == 'PENDING' ? 'badge-warning' : 'badge-danger'}" th:text="${product.approvalStatus == 'APPROVED' ? 'Đã duyệt' : product.approvalStatus == 'PENDING' ? 'Chờ duyệt' : 'Từ chối'}">Status</span>
                    <span th:if="${product.expiryDate != null}" style="font-size:11px;color:var(--text-tertiary)" th:text="'HSD: ' + #temporals.format(product.expiryDate, 'dd/MM/yyyy')">Expiry</span>
                </div>
            </div>
            <div style="text-align:right;flex-shrink:0;">
                <div class="product-price" th:text="${#numbers.formatDecimal(product.originalPrice, 0, 0) + 'đ'}">0đ</div>
                <div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;" th:text="${product.active ? 'Đang bán' : 'Ngừng bán'}">Active</div>
                <form th:if="${product.active}" method="post" th:action="@{/seller/products/{id}/toggle(id=${product.productId})}" style="margin-top:4px;" onclick="event.stopPropagation()">
                    <button type="submit" class="btn btn-sm" style="background:var(--danger);color:#fff;font-size:10px;padding:4px 10px;" onclick="return confirm('Ngừng bán sản phẩm này?')">⏸ Ngừng bán</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages > 1}" style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;padding:12px 0;">
        <a th:href="@{/seller/products(page=${currentPage - 1}, status=${selectedStatus}, search=${searchQuery}, categoryId=${selectedCategory})}"
           th:if="${hasPrevious}" style="padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-weight:600;text-decoration:none;color:var(--text-primary);background:var(--surface);">← Trước</a>
        <span style="padding:8px 14px;font-size:13px;color:var(--text-secondary);" th:text="${currentPage + 1} + ' / ' + ${totalPages}">1/1</span>
        <a th:href="@{/seller/products(page=${currentPage + 1}, status=${selectedStatus}, search=${searchQuery}, categoryId=${selectedCategory})}"
           th:if="${hasNext}" style="padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-weight:600;text-decoration:none;color:var(--text-primary);background:var(--surface);">Sau →</a>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--text-tertiary);padding:8px;" th:if="${totalProducts > 0}" th:text="'Hiển thị ' + (${products.size()}) + ' / ' + ${totalProducts} + ' sản phẩm'">0</div>

    <div class="empty-state" th:unless="${products != null and !products.isEmpty()}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <h3>Chưa có sản phẩm nào</h3>
        <p>Tạo sản phẩm đầu tiên để bắt đầu bán hàng và tạo deal</p>
        <a href="/seller/products/create" class="btn btn-primary">Tạo sản phẩm ngay</a>
    </div>
</div>

<a class="fab" href="/seller/products/create">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</a>

<!-- Product Detail Modal -->
<div class="modal" id="productDetailModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="detailTitle">Chi tiết sản phẩm</div>
            <div class="modal-close" onclick="closeProductDetail()">✕</div>
        </div>
        <div class="modal-body" id="detailBody">Đang tải...</div>
        <div class="modal-footer">
            <button class="btn btn-outline btn-sm" onclick="openEditForm()">✏️ Sửa</button>
            <button class="btn btn-sm" style="background:var(--bg);color:var(--text-primary);" onclick="closeProductDetail()">Đóng</button>
        </div>
    </div>
</div>

<!-- Edit Product Modal -->
<div class="modal" id="editProductModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Sửa sản phẩm</div>
            <div class="modal-close" onclick="closeEditProduct()">✕</div>
        </div>
        <div class="modal-body">
            <form id="editProductForm" method="post" enctype="multipart/form-data">
                <div class="form-group"><label class="form-label">Tên *</label><input type="text" name="name" id="editName" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Mô tả</label><textarea name="description" id="editDesc" class="form-input" rows="2"></textarea></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div class="form-group"><label class="form-label">Giá gốc *</label><input type="number" name="originalPrice" id="editPrice" class="form-input" required min="1000"></div>
                    <div class="form-group"><label class="form-label">Tồn kho</label><input type="number" name="stockQuantity" id="editStock" class="form-input" min="0"></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div class="form-group"><label class="form-label">Danh mục</label><select name="categoryId" id="editCat" class="form-select"><option value="">Chọn...</option><option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}"></option></select></div>
                    <div class="form-group"><label class="form-label">HSD</label><input type="date" name="expiryDateStr" id="editExpiry" class="form-input"></div>
                </div>
                <div class="form-group"><label class="form-label">Ảnh (để trống = giữ ảnh cũ)</label><input type="file" name="imageFile" accept="image/*" class="form-input"></div>
                <input type="hidden" name="existingImageUrl" id="editExistingImg">
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-sm" style="background:var(--bg);" onclick="closeEditProduct()">Hủy</button>
            <button class="btn btn-primary btn-sm" onclick="submitEdit()">Lưu</button>
        </div>
    </div>
</div>

<div th:replace="~{common/seller/bottom-nav :: bottom-nav('products')}"></div>

<script>
let currentProductId = null;
let currentProductData = null;

async function viewProductDetail(productId) {
    currentProductId = productId;
    const modal = document.getElementById('productDetailModal');
    const body = document.getElementById('detailBody');
    modal.classList.add('active');
    body.innerHTML = '<div style="text-align:center;padding:30px;">Đang tải...</div>';

    try {
        const res = await fetch(`/seller/api/products/${productId}/detail`);
        const data = await res.json();
        if (data.error) { body.innerHTML = `<div style="text-align:center;color:var(--danger);">${data.error}</div>`; return; }
        currentProductData = data;

        const platformTags = (data.platformDeals || []).map(d =>
            `<span class="deal-tag platform">🌐 ${d.dealName}: -${d.discountDisplay} (≈${d.discountAmount.toLocaleString()}đ)</span>`
        ).join('') || '<span style="font-size:12px;color:var(--text-tertiary);">Không có deal sàn</span>';

        const storeTags = (data.storeDeals || []).map(d =>
            `<span class="deal-tag store">🏪 ${d.dealName}: ${d.discountDisplay} <span style="font-size:10px;opacity:.7;">(${d.status})</span></span>`
        ).join('') || '<span style="font-size:12px;color:var(--text-tertiary);">Chưa gán deal shop</span>';

        body.innerHTML = `
            <div style="text-align:center;margin-bottom:16px;">
                <img src="${data.imageUrl || '/img/default-product.svg'}" style="width:100%;max-height:200px;object-fit:cover;border-radius:var(--radius-md);margin-bottom:12px;" onerror="this.src='/img/default-product.svg'">
                <h3 style="font-size:18px;font-weight:700;">${data.name}</h3>
                ${data.description ? `<p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">${data.description}</p>` : ''}
            </div>
            <div class="detail-row">
                <span class="detail-label">Giá gốc</span>
                <span class="detail-value">${(data.originalPrice || 0).toLocaleString()}đ</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Giá cuối (sau mọi deal)</span>
                <span class="price-final">${(data.finalPrice || 0).toLocaleString()}đ <span class="price-original">${(data.originalPrice || 0).toLocaleString()}đ</span></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Tổng giảm</span>
                <span class="detail-value" style="color:var(--danger);">-${data.totalDiscountPercent || 0}% (≈${(data.totalPlatformDiscount || 0).toLocaleString()}đ)</span>
            </div>
            <div class="detail-row"><span class="detail-label">Tồn kho</span><span class="detail-value">${data.stockQuantity || 0}</span></div>
            <div class="detail-row"><span class="detail-label">Danh mục</span><span class="detail-value">${data.categoryName || 'Chưa có'}</span></div>
            <div class="detail-row"><span class="detail-label">Trạng thái</span><span class="detail-value">${data.active ? '✅ Đang bán' : '⏸ Ngừng bán'}</span></div>
            <div class="detail-row"><span class="detail-label">Duyệt</span><span class="detail-value">${data.approvalStatus === 'APPROVED' ? '✅ Đã duyệt' : data.approvalStatus === 'PENDING' ? '⏳ Chờ duyệt' : '❌ Từ chối'}</span></div>
            ${data.rejectionReason ? `<div class="detail-row"><span class="detail-label">Lý do từ chối</span><span class="detail-value" style="color:var(--danger);">${data.rejectionReason}</span></div>` : ''}
            ${data.expiryDate ? `<div class="detail-row"><span class="detail-label">HSD</span><span class="detail-value">${new Date(data.expiryDate).toLocaleDateString('vi-VN')}</span></div>` : ''}
            <div style="margin-top:12px;">
                <div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--purple);">🌐 Deal toàn sàn (platform)</div>
                ${platformTags}
            </div>
            <div style="margin-top:12px;">
                <div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--primary);">🏪 Deal của shop (store)</div>
                ${storeTags}
            </div>
        `;
    } catch (e) {
        body.innerHTML = '<div style="text-align:center;color:var(--danger);">Không thể tải chi tiết</div>';
    }
}

function closeProductDetail() { document.getElementById('productDetailModal').classList.remove('active'); }

function openEditForm() {
    if (!currentProductData) return;
    document.getElementById('productDetailModal').classList.remove('active');
    document.getElementById('editName').value = currentProductData.name || '';
    document.getElementById('editDesc').value = currentProductData.description || '';
    document.getElementById('editPrice').value = currentProductData.originalPrice || '';
    document.getElementById('editStock').value = currentProductData.stockQuantity || 0;
    document.getElementById('editExpiry').value = currentProductData.expiryDate ? currentProductData.expiryDate.split('T')[0] : '';
    document.getElementById('editExistingImg').value = currentProductData.imageUrl || '';
    document.getElementById('editProductForm').action = `/seller/products/${currentProductId}/edit`;
    document.getElementById('editProductModal').classList.add('active');
}

function closeEditProduct() { document.getElementById('editProductModal').classList.remove('active'); }
