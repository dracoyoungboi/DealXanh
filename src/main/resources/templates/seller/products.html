<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm — DealXanh Seller</title>
    <div th:replace="~{common/admin/css :: css}"></div>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root{--primary:#0d5c2e;--primary-dark:#08421f;--surface:#fff;--bg:#f5f6f8;--text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;--border:#e0e0e0;--border-light:#f0f0f0;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;--info:#3b82f6;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-full:9999px;--font:'Inter',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);padding-bottom:70px}
.page-header{background:var(--primary);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.back-btn{color:#fff;display:flex;align-items:center}.back-btn svg{width:20px;height:20px}
.header-title{font-size:18px;font-weight:700;flex:1}
.hdr-btn{width:36px;height:36px;border-radius:var(--radius-md);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.content{padding:16px}
.alert{padding:10px 14px;border-radius:var(--radius-md);margin-bottom:12px;font-size:13px;font-weight:600}
.alert.success{background:rgba(16,185,129,.1);color:var(--success)}.alert.error{background:rgba(239,68,68,.1);color:var(--danger)}

.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi-card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:16px;text-align:center}
.kpi-val{font-size:28px;font-weight:800}.kpi-lbl{font-size:11px;color:var(--text-tertiary);margin-top:4px}

.filter-row{display:flex;gap:8px;margin-bottom:14px}
.filter-input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;background:var(--surface)}
.filter-select{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;background:var(--surface)}
.btn-search{padding:10px 14px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:13px;font-weight:600;cursor:pointer}

.product-list{display:flex;flex-direction:column;gap:10px}
.product-row{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:all .15s}
.product-row:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.product-img{width:56px;height:56px;border-radius:var(--radius-md);object-fit:cover;flex-shrink:0;background:var(--bg)}
.product-info{flex:1;min-width:0}
.product-name{font-size:14px;font-weight:700;margin-bottom:3px}
.product-meta{font-size:12px;color:var(--text-secondary);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.product-price{font-size:16px;font-weight:800;color:var(--primary);text-align:right;flex-shrink:0}
.product-price del{font-size:11px;color:var(--text-tertiary);display:block}

.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--radius-full)}
.badge-success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.badge-warning{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.badge-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.stock-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.stock-dot.in{background:var(--success)}.stock-dot.out{background:var(--danger)}

.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;padding:12px 0}
.page-link{padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-weight:600;text-decoration:none;color:var(--text-primary);background:var(--surface)}
.page-info{padding:8px 14px;font-size:13px;color:var(--text-secondary)}

.empty-state{text-align:center;padding:60px 20px}.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:0.2}
.empty-state h3{font-size:18px;font-weight:700;margin-bottom:8px}.empty-state p{font-size:13px;color:var(--text-secondary);margin-bottom:16px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;border:none}
.btn-primary{background:var(--primary);color:#fff}
.fab{position:fixed;bottom:80px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(13,92,46,.4);z-index:10;text-decoration:none}
.fab svg{width:24px;height:24px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border-light);padding:8px 0;z-index:20}
.bottom-nav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;text-decoration:none}
.bottom-nav .nav-item svg{width:22px;height:22px;color:var(--text-tertiary)}
.bottom-nav .nav-item span{font-size:10px;font-weight:500;color:var(--text-tertiary)}
.bottom-nav .nav-item.active svg,.bottom-nav .nav-item.active span{color:var(--primary)}
    </style>
</head>
<body>

<header class="page-header">
    <a class="back-btn" href="/seller/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></a>
    <span class="header-title">Sản phẩm</span>
    <a class="hdr-btn" href="/seller/products/create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
</header>

<div class="content">
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <!-- KPI -->
    <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-val" style="color:var(--primary)" th:text="${totalProducts}">0</div><div class="kpi-lbl">Tổng sản phẩm</div></div>
        <div class="kpi-card"><div class="kpi-val" style="color:var(--success)" th:text="${approvedCount}">0</div><div class="kpi-lbl">Đã duyệt</div></div>
        <div class="kpi-card"><div class="kpi-val" style="color:var(--warning)" th:text="${pendingCount}">0</div><div class="kpi-lbl">Chờ duyệt</div></div>
    </div>

    <!-- Filter -->
    <form method="get" th:action="@{/seller/products}" class="filter-row">
        <input type="text" name="search" class="filter-input" placeholder="Tìm sản phẩm..." th:value="${searchQuery}">
        <select name="status" class="filter-select" onchange="this.form.submit()">
            <option value="">Tất cả</option>
            <option value="active" th:selected="${selectedStatus == 'active'}">Đang bán</option>
            <option value="inactive" th:selected="${selectedStatus == 'inactive'}">Ngừng bán</option>
            <option value="outofstock" th:selected="${selectedStatus == 'outofstock'}">Hết hàng</option>
        </select>
        <select name="categoryId" class="filter-select" onchange="this.form.submit()">
            <option value="">Tất cả DM</option>
            <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}" th:selected="${selectedCategory != null && selectedCategory.toString() == cat.categoryId.toString()}"></option>
        </select>
        <button type="submit" class="btn-search">Tìm</button>
    </form>

    <!-- Product list -->
    <div class="product-list" th:if="${products != null and !products.isEmpty()}">
        <div class="product-row" th:each="product : ${products}" th:onclick="|viewProductDetail(${product.productId})|">
            <img th:src="${product.imageUrl != null ? product.imageUrl : '/img/default-product.svg'}" class="product-img" onerror="this.src='/img/default-product.svg'">
            <div class="product-info">
                <div class="product-name" th:text="${product.name}">Name</div>
                <div class="product-meta">
                    <span th:if="${product.category != null}" th:text="${product.category.name}">Category</span>
                    <span class="stock-dot" th:class="${product.stockQuantity > 0 ? 'in' : 'out'}"></span>
                    <span th:text="${product.stockQuantity > 0 ? 'Còn ' + product.stockQuantity : 'Hết hàng'}" th:style="${product.stockQuantity > 0 ? 'color:var(--success)' : 'color:var(--danger)'}">Stock</span>
                    <span class="badge" th:classappend="${product.approvalStatus == 'APPROVED'} ? 'badge-success' : (${product.approvalStatus == 'PENDING'} ? 'badge-warning' : 'badge-danger')" th:text="${product.approvalStatus == 'APPROVED' ? 'Đã duyệt' : product.approvalStatus == 'PENDING' ? 'Chờ duyệt' : 'Từ chối'}">Status</span>
                    <span th:if="${product.expiryDate != null}" style="font-size:11px;color:var(--text-tertiary)" th:text="'HSD: ' + #temporals.format(product.expiryDate, 'dd/MM')">Expiry</span>
                </div>
            </div>
            <div class="product-price">
                <span th:text="${#numbers.formatDecimal(product.originalPrice, 0, 0) + 'đ'}">0đ</span>
                <form th:if="${product.active}" method="post" th:action="@{/seller/products/{id}/toggle(id=${product.productId})}" onclick="event.stopPropagation()" style="margin-top:4px;">
                    <button style="font-size:10px;padding:3px 10px;background:var(--danger);color:#fff;border:none;border-radius:var(--radius-full);cursor:pointer;font-weight:600;" onclick="return confirm('Ngừng bán?')">⏸ Ngừng</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${totalPages > 1}">
        <a class="page-link" th:if="${hasPrevious}" th:href="@{/seller/products(page=${currentPage - 1}, status=${selectedStatus}, search=${searchQuery}, categoryId=${selectedCategory})}">← Trước</a>
        <span class="page-info" th:text="|${currentPage + 1} / ${totalPages}|">1/1</span>
        <a class="page-link" th:if="${hasNext}" th:href="@{/seller/products(page=${currentPage + 1}, status=${selectedStatus}, search=${searchQuery}, categoryId=${selectedCategory})}">Sau →</a>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--text-tertiary);padding:4px;" th:if="${totalProducts > 0}" th:text="|Hiển thị ${products.size()} / ${totalProducts} sản phẩm|">0</div>

    <div class="empty-state" th:unless="${products != null and !products.isEmpty()}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <h3>Chưa có sản phẩm nào</h3>
        <p>Tạo sản phẩm đầu tiên để bắt đầu bán hàng</p>
        <a href="/seller/products/create" class="btn btn-primary">Tạo sản phẩm ngay</a>
    </div>
</div>

<a class="fab" href="/seller/products/create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
<div th:replace="~{common/seller/bottom-nav :: bottom-nav('products')}"></div>

<!-- Detail Modal -->
<div class="modal" id="productDetailModal" style="display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5);overflow-y:auto;">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;">
        <div style="background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:500px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;">
            <div style="padding:16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;"><span style="font-size:16px;font-weight:700;" id="detailTitle">Chi tiết</span><button onclick="closeProductDetail()" style="width:32px;height:32px;border-radius:8px;background:var(--bg);border:none;cursor:pointer;font-size:16px;">✕</button></div>
            <div id="detailBody" style="padding:16px;overflow-y:auto;flex:1;">Đang tải...</div>
            <div style="padding:12px 16px;border-top:1px solid var(--border-light);display:flex;gap:8px;justify-content:flex-end;">
                <button onclick="openEditForm()" class="btn" style="background:var(--bg);font-size:12px;">✏️ Sửa</button>
                <button onclick="closeProductDetail()" class="btn" style="background:var(--bg);font-size:12px;">Đóng</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal" id="editProductModal" style="display:none;position:fixed;z-index:1001;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5);overflow-y:auto;">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;">
        <div style="background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:500px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;">
            <div style="padding:16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;"><span style="font-size:16px;font-weight:700;">Sửa sản phẩm</span><button onclick="closeEditProduct()" style="width:32px;height:32px;border-radius:8px;background:var(--bg);border:none;cursor:pointer;font-size:16px;">✕</button></div>
            <div style="padding:16px;overflow-y:auto;flex:1;">
                <form id="editProductForm" method="post" enctype="multipart/form-data">
                    <div style="margin-bottom:10px;"><label style="font-size:12px;font-weight:600;">Tên *</label><input name="name" id="editName" class="filter-input" style="width:100%;" required></div>
                    <div style="margin-bottom:10px;"><label style="font-size:12px;font-weight:600;">Mô tả</label><textarea name="description" id="editDesc" class="filter-input" style="width:100%;" rows="2"></textarea></div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                        <div style="margin-bottom:10px;"><label style="font-size:12px;font-weight:600;">Giá gốc *</label><input type="number" name="originalPrice" id="editPrice" class="filter-input" style="width:100%;" required min="1000"></div>
                        <div style="margin-bottom:10px;"><label style="font-size:12px;font-weight:600;">Tồn kho</label><input type="number" name="stockQuantity" id="editStock" class="filter-input" style="width:100%;" min="0"></div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                        <div style="margin-bottom:10px;"><label style="font-size:12px;font-weight:600;">Danh mục</label><select name="categoryId" id="editCat" class="filter-select" style="width:100%;"><option value="">Chọn...</option><option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}"></option></select></div>
                        <div style="margin-bottom:10px;"><label style="font-size:12px;font-weight:600;">HSD</label><input type="date" name="expiryDateStr" id="editExpiry" class="filter-input" style="width:100%;"></div>
                    </div>
                    <div style="margin-bottom:10px;"><label style="font-size:12px;font-weight:600;">Ảnh (để trống = giữ cũ)</label><input type="file" name="imageFile" accept="image/*" class="filter-input" style="width:100%;"></div>
                    <input type="hidden" name="existingImageUrl" id="editExistingImg">
                </form>
            </div>
            <div style="padding:12px 16px;border-top:1px solid var(--border-light);display:flex;gap:8px;justify-content:flex-end;">
                <button onclick="closeEditProduct()" class="btn" style="background:var(--bg);font-size:12px;">Hủy</button>
                <button onclick="submitEdit()" class="btn btn-primary" style="font-size:12px;">Lưu</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentProductId=null,currentProductData=null;
async function viewProductDetail(id){currentProductId=id;const m=document.getElementById('productDetailModal'),b=document.getElementById('detailBody');m.style.display='block';b.innerHTML='<div style="text-align:center;padding:30px;">Đang tải...</div>';try{const r=await fetch(`/seller/api/products/${id}/detail`);const d=await r.json();if(d.error){b.innerHTML=`<div style="text-align:center;color:var(--danger);">${d.error}</div>`;return}currentProductData=d;const pt=(d.platformDeals||[]).map(x=>`<span class="badge" style="background:rgba(139,92,246,.1);color:#8b5cf6;margin:2px;">🌐 ${x.dealName}: -${x.discountDisplay}</span>`).join('')||'<span style="font-size:12px;color:var(--text-tertiary);">Không có</span>';const st=(d.storeDeals||[]).map(x=>`<span class="badge" style="background:rgba(13,92,46,.1);color:var(--primary);margin:2px;">🏪 ${x.dealName}: ${x.discountDisplay}</span>`).join('')||'<span style="font-size:12px;color:var(--text-tertiary);">Chưa gán</span>';b.innerHTML=`<div style="text-align:center;margin-bottom:12px;"><img src="${d.imageUrl||'/img/default-product.svg'}" style="width:100%;max-height:180px;object-fit:cover;border-radius:var(--radius-md);" onerror="this.src='/img/default-product.svg'"><h3 style="margin-top:8px;">${d.name}</h3>${d.description?`<p style="font-size:13px;color:var(--text-secondary);">${d.description}</p>`:''}</div><div style="display:flex;justify-content:center;align-items:baseline;gap:8px;margin-bottom:12px;"><span style="font-size:24px;font-weight:800;color:var(--danger);">${(d.finalPrice||0).toLocaleString()}đ</span><span style="font-size:14px;color:var(--text-tertiary);text-decoration:line-through;">${(d.originalPrice||0).toLocaleString()}đ</span><span style="font-size:12px;font-weight:700;color:var(--danger);">(-${d.totalDiscountPercent||0}%)</span></div><div style="font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;"><div>Tồn: <b>${d.stockQuantity||0}</b></div><div>DM: <b>${d.categoryName||'Chưa có'}</b></div><div>HSD: <b>${d.expiryDate?new Date(d.expiryDate).toLocaleDateString('vi-VN'):'Không có'}</b></div><div>Duyệt: <b>${d.approvalStatus}</b></div></div><div style="font-size:11px;font-weight:700;margin-bottom:4px;color:#8b5cf6;">🌐 Deal toàn sàn</div><div style="margin-bottom:10px;">${pt}</div><div style="font-size:11px;font-weight:700;margin-bottom:4px;color:var(--primary);">🏪 Deal của shop</div><div>${st}</div>`}catch(e){b.innerHTML='<div style="text-align:center;color:var(--danger);">Không thể tải</div>'}}
function closeProductDetail(){document.getElementById('productDetailModal').style.display='none'}
function openEditForm(){if(!currentProductData)return;closeProductDetail();document.getElementById('editName').value=currentProductData.name||'';document.getElementById('editDesc').value=currentProductData.description||'';document.getElementById('editPrice').value=currentProductData.originalPrice||'';document.getElementById('editStock').value=currentProductData.stockQuantity||0;document.getElementById('editExpiry').value=currentProductData.expiryDate?currentProductData.expiryDate.split('T')[0]:'';document.getElementById('editExistingImg').value=currentProductData.imageUrl||'';document.getElementById('editProductForm').action=`/seller/products/${currentProductId}/edit`;document.getElementById('editProductModal').style.display='block'}
function closeEditProduct(){document.getElementById('editProductModal').style.display='none'}
function submitEdit(){document.getElementById('editProductForm').submit()}
</script>
</body>
</html>
