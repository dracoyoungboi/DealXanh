<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài chính — DealXanh Seller</title>
    <div th:replace="~{common/admin/css :: css}"></div>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root{--primary:#0d5c2e;--primary-dark:#08421f;--surface:#fff;--bg:#f5f6f8;--text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;--border:#e0e0e0;--border-light:#f0f0f0;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;--info:#3b82f6;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-full:9999px;--font:'Inter',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);padding-bottom:70px}
.page-header{background:var(--primary);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.back-btn{color:#fff;display:flex;align-items:center}.back-btn svg{width:20px;height:20px}
.header-title{font-size:18px;font-weight:700;flex:1}
.content{padding:16px}

.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi-card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:16px}
.kpi-card.full{grid-column:1/-1}
.kpi-val{font-size:22px;font-weight:800}
.kpi-lbl{font-size:11px;color:var(--text-tertiary);margin-top:2px}

.section-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.section-title svg{width:16px;height:16px;color:var(--primary)}

.table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-light)}
.table th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;background:var(--bg);border-bottom:1px solid var(--border-light)}
.table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border-light)}
.table tr:last-child td{border-bottom:none}

.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--radius-full)}
.badge-success{background:#f0fdf4;color:#16a34a}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-secondary)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:0.2}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border-light);padding:8px 0;z-index:20}
.bottom-nav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;text-decoration:none}
.bottom-nav .nav-item svg{width:22px;height:22px;color:var(--text-tertiary)}
.bottom-nav .nav-item span{font-size:10px;font-weight:500;color:var(--text-tertiary)}
.bottom-nav .nav-item.active svg,.bottom-nav .nav-item.active span{color:var(--primary)}
    </style>
</head>
<body>
<header class="page-header">
    <a class="back-btn" href="/seller/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></a>
    <span class="header-title">Tài chính & Đối soát</span>
</header>
<div class="content">
    <!-- KPI -->
    <div class="kpi-grid">
        <div class="kpi-card" style="text-align:center;">
            <div class="kpi-val" style="color:var(--primary);" th:text="${#numbers.formatDecimal(todayRevenue, 0, 0) + 'đ'}">0đ</div>
            <div class="kpi-lbl" th:text="'Doanh thu hôm nay · ' + ${todayOrders} + ' đơn'">0</div>
        </div>
        <div class="kpi-card" style="text-align:center;">
            <div class="kpi-val" style="color:var(--danger);" th:text="${#numbers.formatDecimal(todayCommission, 0, 0) + 'đ'}">0đ</div>
            <div class="kpi-lbl" th:text="'Hoa hồng nền tảng (' + ${commissionRate} + '%)'">0</div>
        </div>
        <div class="kpi-card full" style="text-align:center;">
            <div class="kpi-val" style="color:var(--success);" th:text="${#numbers.formatDecimal(todayNet, 0, 0) + 'đ'}">0đ</div>
            <div class="kpi-lbl">Thu về thực tế (sau hoa hồng)</div>
        </div>
    </div>

    <!-- Month summary -->
    <div class="kpi-grid" style="margin-bottom:16px;">
        <div class="kpi-card" style="text-align:center;">
            <div class="kpi-val" style="color:var(--info);font-size:18px;" th:text="${#numbers.formatDecimal(monthRevenue, 0, 0) + 'đ'}">0đ</div>
            <div class="kpi-lbl">Doanh thu tháng</div>
        </div>
        <div class="kpi-card" style="text-align:center;">
            <div class="kpi-val" style="color:var(--info);font-size:18px;" th:text="${monthOrders}">0</div>
            <div class="kpi-lbl">Tổng đơn tháng</div>
        </div>
    </div>

    <!-- Recent completed orders (đối soát) -->
    <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
        Đơn đã hoàn thành gần đây (đối soát)
    </div>
    <table class="table" th:if="${recentOrders != null and !recentOrders.isEmpty()}">
        <thead><tr><th>Mã đơn</th><th>Khách</th><th>Giá trị</th><th>Hoa hồng</th><th>Thực nhận</th><th>Ngày</th></tr></thead>
        <tbody>
            <tr th:each="order : ${recentOrders}">
                <td style="font-weight:600;color:var(--primary);" th:text="'#' + ${order.orderId}">#123</td>
                <td th:text="${order.user != null ? (order.user.fullName != null ? order.user.fullName : order.user.username) : 'N/A'}">Customer</td>
                <td style="font-weight:600;" th:text="${#numbers.formatDecimal(order.finalAmount, 0, 0) + 'đ'}">0đ</td>
                <td style="color:var(--danger);" th:text="${#numbers.formatDecimal(order.finalAmount * store.getCommissionRate(), 0, 0) + 'đ'}">0đ</td>
                <td style="font-weight:600;color:var(--success);" th:text="${#numbers.formatDecimal(order.finalAmount * (1 - store.getCommissionRate()), 0, 0) + 'đ'}">0đ</td>
                <td style="font-size:12px;color:var(--text-secondary);" th:if="${order.createdAt != null}" th:text="${#temporals.format(order.createdAt, 'dd/MM HH:mm')}">Date</td>
            </tr>
        </tbody>
    </table>
    <div class="empty-state" th:unless="${recentOrders != null and !recentOrders.isEmpty()}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
        <div style="font-weight:600;">Chưa có đơn hoàn thành</div>
        <div style="font-size:12px;">Đơn hàng hoàn thành sẽ hiển thị ở đây</div>
    </div>
</div>
<div th:replace="~{common/seller/bottom-nav :: bottom-nav('finance')}"></div>
</body>
</html>
