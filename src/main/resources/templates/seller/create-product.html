<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Sản phẩm — DealXanh Seller</title>
    <div th:replace="~{common/admin/css :: css}"></div>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root{--primary:#0d5c2e;--primary-dark:#08421f;--surface:#fff;--bg:#f5f6f8;--text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;--border:#e0e0e0;--border-light:#f0f0f0;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;--info:#3b82f6;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-full:9999px;--font:'Inter',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);padding-bottom:70px}

.page-header{background:var(--primary);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.back-btn{color:#fff;display:flex;align-items:center}
.back-btn svg{width:20px;height:20px}
.header-title{font-size:18px;font-weight:700;flex:1}

.content{padding:16px;max-width:600px;margin:0 auto}
.alert{padding:10px 14px;border-radius:var(--radius-md);margin-bottom:12px;font-size:13px;font-weight:600}
.alert.error{background:rgba(239,68,68,.1);color:var(--danger)}

.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:14px;background:var(--surface)}
.form-input:focus{outline:none;border-color:var(--primary)}
textarea.form-input{resize:vertical}
.form-select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:14px;background:var(--surface)}
.form-hint{font-size:11px;color:var(--text-tertiary);margin-top:4px}

.file-upload{border:2px dashed var(--border);border-radius:var(--radius-md);padding:20px;text-align:center;cursor:pointer;transition:border-color .2s}
.file-upload:hover{border-color:var(--primary)}
.file-upload input{display:none}
.file-upload__text{font-size:13px;color:var(--text-secondary)}
.file-upload__hint{font-size:11px;color:var(--text-tertiary);margin-top:4px}

.preview-img{width:100%;max-height:180px;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--border);margin-top:8px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border-radius:var(--radius-md);font-size:14px;font-weight:600;cursor:pointer;border:none;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff;width:100%;justify-content:center}
.btn-primary:hover{background:var(--primary-dark)}
    </style>
</head>
<body>

<header class="page-header">
    <a class="back-btn" href="/seller/products">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </a>
    <span class="header-title">Tạo Sản phẩm mới</span>
</header>

<div class="content">
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <form method="post" th:action="@{/seller/products/create}" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label class="form-label">Tên sản phẩm <span style="color:var(--danger)">*</span></label>
            <input type="text" name="name" class="form-input" required placeholder="VD: Bánh mì thịt nướng">
        </div>

        <div class="form-group">
            <label class="form-label">Mô tả</label>
            <textarea name="description" class="form-input" rows="3" placeholder="Mô tả sản phẩm..."></textarea>
        </div>

        <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
                <label class="form-label">Giá gốc (đ) <span style="color:var(--danger)">*</span></label>
                <input type="number" name="originalPrice" class="form-input" required min="1000" step="1000" placeholder="50000">
            </div>
            <div>
                <label class="form-label">Số lượng tồn kho</label>
                <input type="number" name="stockQuantity" class="form-input" min="0" value="0" placeholder="0">
            </div>
        </div>

        <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
                <label class="form-label">Danh mục</label>
                <select name="categoryId" class="form-select">
                    <option value="">Chọn danh mục...</option>
                    <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}">Category</option>
                </select>
            </div>
            <div>
                <label class="form-label">Loại sản phẩm</label>
                <select name="productType" class="form-select">
                    <option value="SPECIFIC_DEAL">Sản phẩm thường</option>
                    <option value="BLIND_BOX">Blind Box</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Hạn sử dụng</label>
            <input type="date" name="expiryDateStr" class="form-input">
            <div class="form-hint">Để trống nếu không có hạn sử dụng</div>
        </div>

        <div class="form-group">
            <label class="form-label">Ảnh sản phẩm</label>
            <div class="file-upload" onclick="document.getElementById('imageFile').click()">
                <input type="file" id="imageFile" name="imageFile" accept="image/*" onchange="previewImage(this)">
                <div class="file-upload__text" id="uploadText">📷 Nhấn để chọn ảnh</div>
                <div class="file-upload__hint">JPG, PNG, WEBP. Tối đa 5MB</div>
            </div>
            <img id="imagePreview" class="preview-img" style="display:none;" src="" alt="Preview">
        </div>

        <div class="form-group" style="margin-top:20px;">
            <button type="submit" class="btn btn-primary">Tạo sản phẩm</button>
            <div class="form-hint" style="text-align:center;margin-top:8px;">Sản phẩm sẽ được gửi đến admin để duyệt trước khi hiển thị</div>
        </div>
    </form>
</div>

<div th:replace="~{common/seller/bottom-nav :: bottom-nav('products')}"></div>

<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const preview = document.getElementById('imagePreview');
            preview.src = e.target.result;
            preview.style.display = 'block';
            document.getElementById('uploadText').textContent = '📷 ' + input.files[0].name;
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
</body>
</html>
