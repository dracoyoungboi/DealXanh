<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${category.name} — DealXanh|">Danh mục — DealXanh</title>
    <div th:replace="~{common/buyer/css :: css}"></div>
    <link rel="stylesheet" th:href="@{/css/pages/home.css}">
    <style>
html{height:auto;min-height:100%}
body{font-family:var(--font-family);background:#f5f5f5;color:var(--text-primary);padding-bottom:80px}
*,*::before,*::after{box-sizing:border-box}

/* Back bar */
.back-bar{padding:10px 14px;display:flex;align-items:center;gap:6px;background:#fff}
.back-bar a{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none}
.back-bar svg{width:18px;height:18px}

/* Cat header */
.cat-header{padding:8px 14px 6px;background:#fff}
.cat-title{font-size:16px;font-weight:700;color:var(--text-primary)}
.cat-desc{font-size:11px;color:var(--text-secondary);margin-top:2px}

/* Search */
.search-bar{padding:8px 14px 10px;background:#fff}
.search-input{width:100%;padding:9px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:12px;font-family:var(--font-family);background:#f5f5f5;outline:none}
.search-input:focus{border-color:var(--primary);background:#fff}

/* ===== PARTNER BANNERS ===== */
.partners-section{padding:0 14px 10px;background:#fff;border-bottom:1px solid #eee}
.partners-label{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px}
.partners-label span{font-size:12px;font-weight:700;color:var(--text-primary);text-transform:uppercase;letter-spacing:.4px}
.partners-scroll{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.partners-scroll::-webkit-scrollbar{display:none}
.partner-banner{flex-shrink:0;width:140px;height:75px;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.partner-banner__bg{position:absolute;inset:0;border-radius:8px}
.partner-banner__overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.3),rgba(0,0,0,.08))}
.partner-banner__content{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:0 10px}
.partner-banner__logo{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:#fff;object-fit:cover;flex-shrink:0}
.partner-banner__logo--fallback{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.3);color:#fff;font-size:18px;font-weight:700}
.partner-banner__info{display:flex;flex-direction:column;gap:1px;overflow:hidden}
.partner-banner__name{font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.partner-banner__count{font-size:9px;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.3)}

.banner-green{background:linear-gradient(135deg,#0d5c2e,#1a8b4a)}
.banner-blue{background:linear-gradient(135deg,#1a56db,#3b82f6)}
.banner-orange{background:linear-gradient(135deg,#c2410c,#f97316)}
.banner-purple{background:linear-gradient(135deg,#6d28d9,#8b5cf6)}
.banner-teal{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.banner-pink{background:linear-gradient(135deg,#be185d,#ec4899)}

/* ===== PRICE FILTER ===== */
.price-filter{padding:8px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:#fff}
.price-filter::-webkit-scrollbar{display:none}
.price-chip{padding:6px 14px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #ddd;background:#fff;color:var(--text-secondary);transition:all 0.15s;text-decoration:none;font-family:var(--font-family);white-space:nowrap;flex-shrink:0}
.price-chip:hover{border-color:var(--primary);color:var(--primary)}
.price-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== PRODUCT GRID ===== */
.prod-section{padding:8px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media(min-width:768px){.prod-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}}
@media(min-width:1024px){.prod-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}}

.prod-card{background:#fff;border-radius:var(--radius-lg);overflow:hidden;display:block;text-decoration:none;color:inherit;cursor:pointer;position:relative}
.prod-card:active{opacity:.9}

/* Image area */
.prod-card__img-wrap{position:relative;width:100%;padding-top:75%;overflow:hidden;background:#fafafa}
.prod-card__img-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}

/* Discount badge - gold accent like home page */
.prod-card__badge{position:absolute;top:6px;left:6px;padding:3px 7px;background:var(--accent);color:var(--text-primary);border-radius:4px;font-size:9px;font-weight:700;line-height:1.3;z-index:1;letter-spacing:.3px}
.prod-card__type-tag{position:absolute;bottom:0;left:0;padding:1px 5px;background:rgba(0,0,0,.5);color:#fff;font-size:7px;font-weight:600;line-height:1.5;z-index:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Card body */
.prod-card__body{padding:5px 6px 7px}
.prod-card__name{font-size:10px;font-weight:400;color:#222;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px}
.prod-card__price-row{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.prod-card__price{font-size:13px;font-weight:700;color:#ee4d2d;line-height:1.2}
.prod-card__original{font-size:9px;color:#999;text-decoration:line-through;line-height:1.2}
.prod-card__nodeal{font-size:9px;color:#999}
.prod-card__store-row{display:flex;align-items:center;gap:4px;margin-top:4px}
.prod-card__store-avatar{width:14px;height:14px;border-radius:50%;object-fit:cover;border:1px solid #eee;flex-shrink:0}
.prod-card__store-avatar--fallback{width:14px;height:14px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#e8e8e8}
.prod-card__store-avatar--fallback svg{width:9px;height:9px;color:#999}
.prod-card__store-name{font-size:9px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Card action buttons */
.prod-card__actions{display:flex;gap:6px;padding:0 6px 7px;align-items:center}
.prod-card__btn{height:34px;border-radius:10px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.prod-card__btn--cart{width:42px;min-width:42px;flex-shrink:0;background:#F3FAF5;border:1px solid #CDE7D4;color:var(--primary);padding:0}
.prod-card__btn--cart svg{width:18px;height:18px;flex-shrink:0}
.prod-card__btn--cart:hover{background:#E6F4EA;border-color:#A3D4AF}
.prod-card__btn--cart:active{background:#CDE7D4;transform:scale(0.94)}
.prod-card__btn--cart.cart-added{animation:cartPopIn .45s ease;background:#D4EDDA;border-color:#28a745;color:#1e7e34}
.prod-card__btn--buy{flex:1;min-width:0;background:var(--primary);color:#fff;white-space:nowrap;padding:0 6px}
.prod-card__btn--buy:active{background:#0a4824;transform:scale(0.98)}

/* Result count */
.result-count{padding:6px 14px 2px;font-size:10px;color:#999;background:#f5f5f5}

/* Empty state */
.empty-state{text-align:center;padding:60px 24px}
.empty-state__icon{width:48px;height:48px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:#eee;border-radius:50%;color:#999}
.empty-state__title{font-size:13px;font-weight:700;margin-bottom:3px}
.empty-state__desc{font-size:10px;color:var(--text-secondary)}
    </style>
</head>
<body>

<!-- Header -->
<div th:replace="~{common/buyer/header :: header}"></div>

<!-- Back bar -->
<div class="back-bar">
    <a href="javascript:history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        <span th:text="${category.name}">Danh mục</span>
    </a>
</div>

<!-- Category header -->
<div class="cat-header">
    <div class="cat-title" th:text="${category.name}">Danh mục</div>
    <div class="cat-desc" th:text="${category.description != null ? category.description : 'Khám phá sản phẩm giá tốt, deal hấp dẫn mỗi ngày'}"></div>
</div>

<!-- Search -->
<div class="search-bar">
    <form method="get" th:action="@{/category/{id}(id=${category.categoryId})}" id="searchForm">
        <input th:if="${selectedStoreId != null}" type="hidden" name="storeId" th:value="${selectedStoreId}">
        <input th:if="${selectedPriceRange != null}" type="hidden" name="priceRange" th:value="${selectedPriceRange}">
        <input type="text" name="search" class="search-input" th:value="${searchQuery}" placeholder="Tìm sản phẩm trong danh mục..." oninput="debounceSearch()">
    </form>
</div>

<!-- ===== PARTNER BANNERS ===== -->
<th:block th:if="${featuredStores != null and !featuredStores.isEmpty()}">
<div class="partners-section">
    <div class="partners-label"><span>Đối tác nổi bật</span></div>
    <div class="partners-scroll">
        <th:block th:each="fs,iterStat : ${featuredStores}">
            <th:block th:with="bannerClass=${iterStat.index % 6 == 0 ? 'banner-green' : (iterStat.index % 6 == 1 ? 'banner-blue' : (iterStat.index % 6 == 2 ? 'banner-orange' : (iterStat.index % 6 == 3 ? 'banner-purple' : (iterStat.index % 6 == 4 ? 'banner-teal' : 'banner-pink'))))}">
            <a class="partner-banner" th:href="@{/category/{id}(id=${category.categoryId}, storeId=${fs.storeId}, search=${searchQuery})}">
                <div class="partner-banner__bg" th:classappend="${bannerClass}"></div>
                <div class="partner-banner__overlay"></div>
                <div class="partner-banner__content">
                    <img class="partner-banner__logo" th:if="${fs.logoUrl != null and !fs.logoUrl.isEmpty() and fs.logoUrl != '/img/default-avatar.svg'}" th:src="${fs.logoUrl}" th:alt="${fs.storeName}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                    <div class="partner-banner__logo partner-banner__logo--fallback" th:if="${fs.logoUrl == null or fs.logoUrl.isEmpty() or fs.logoUrl == '/img/default-avatar.svg'}" style="display:flex">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v2H3z"/><path d="M5 3h14l2 4H3l2-4z"/><path d="M3 9v12h18V9"/><path d="M10 21v-6h4v6"/></svg>
                    </div>
                    <div class="partner-banner__logo partner-banner__logo--fallback" style="display:none">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v2H3z"/><path d="M5 3h14l2 4H3l2-4z"/><path d="M3 9v12h18V9"/><path d="M10 21v-6h4v6"/></svg>
                    </div>
                    <div class="partner-banner__info">
                        <span class="partner-banner__name" th:text="${fs.storeName}">Store</span>
                        <span class="partner-banner__count" th:text="|${fs.productCount} sản phẩm|">0 sản phẩm</span>
                    </div>
                </div>
            </a>
            </th:block>
        </th:block>
    </div>
</div>
</th:block>

<!-- ===== PRICE FILTER ===== -->
<div class="price-filter">
    <a class="price-chip" th:classappend="${selectedPriceRange == null ? 'active' : ''}" th:href="@{/category/{id}(id=${category.categoryId}, search=${searchQuery})}">Tất cả</a>
    <a class="price-chip" th:classappend="${selectedPriceRange == 'under50k' ? 'active' : ''}" th:href="@{/category/{id}(id=${category.categoryId}, priceRange='under50k', search=${searchQuery})}">Dưới 50k</a>
    <a class="price-chip" th:classappend="${selectedPriceRange == '50k-100k' ? 'active' : ''}" th:href="@{/category/{id}(id=${category.categoryId}, priceRange='50k-100k', search=${searchQuery})}">50k - 100k</a>
    <a class="price-chip" th:classappend="${selectedPriceRange == '100k-200k' ? 'active' : ''}" th:href="@{/category/{id}(id=${category.categoryId}, priceRange='100k-200k', search=${searchQuery})}">100k - 200k</a>
    <a class="price-chip" th:classappend="${selectedPriceRange == 'over200k' ? 'active' : ''}" th:href="@{/category/{id}(id=${category.categoryId}, priceRange='over200k', search=${searchQuery})}">Trên 200k</a>
</div>

<!-- Result count -->
<div class="result-count" th:text="|${#lists.size(products)} sản phẩm|">0 sản phẩm</div>

<!-- ===== PRODUCT GRID ===== -->
<div class="prod-section">
    <div class="prod-grid" th:if="${products != null and !products.isEmpty()}">
        <th:block th:each="p : ${products}">
            <th:block th:with="dealInfo=${dealProductMap != null ? dealProductMap[p.productId] : null}">
                <div class="prod-card">
                    <a th:href="@{'/products/' + ${p.productId}}" style="text-decoration:none;color:inherit;display:block;">
                    <div class="prod-card__img-wrap">
                        <img th:src="${p.imageUrl != null ? p.imageUrl : '/img/default-banner.svg'}" th:alt="${p.name}" onerror="this.src='/img/default-banner.svg'" loading="lazy">
                        <div class="prod-card__badge" th:if="${dealInfo != null}" th:text="|${dealInfo.discountPercent}% GIẢM|">50% GIẢM</div>
                        <div class="prod-card__type-tag" th:if="${dealInfo != null}" th:switch="${dealInfo.dealType}">
                            <span th:case="'FLASH_SALE'">⚡ Flash Sale</span>
                            <span th:case="'COMBO'">📦 Combo</span>
                            <span th:case="'VOUCHER'">🎫 Voucher</span>
                            <span th:case="'SEASONAL'">🌟 Seasonal</span>
                            <span th:case="*">Deal</span>
                        </div>
                    </div>
                    <div class="prod-card__body">
                        <div class="prod-card__name" th:text="${p.name}">Product name</div>
                        <div class="prod-card__price-row">
                            <span class="prod-card__price" th:if="${dealInfo != null}" th:text="${@priceFormatter.format(dealInfo.salePrice)}">50,000đ</span>
                            <span class="prod-card__price" th:unless="${dealInfo != null}" th:text="${@priceFormatter.format(p.currentPrice != null ? p.currentPrice : p.originalPrice)}">50,000đ</span>
                            <span class="prod-card__original" th:if="${dealInfo != null}" th:text="${@priceFormatter.format(dealInfo.originalPrice)}">100,000đ</span>
                            <span class="prod-card__nodeal" th:unless="${dealInfo != null}">Giá gốc</span>
                        </div>
                        <div class="prod-card__store-row">
                            <img class="prod-card__store-avatar" th:if="${p.store != null and p.store.logoUrl != null}" th:src="${p.store.logoUrl}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy">
                            <div class="prod-card__store-avatar--fallback" th:if="${p.store == null or p.store.logoUrl == null}" style="display:flex">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v2H3z"/><path d="M5 3h14l2 4H3l2-4z"/><path d="M3 9v12h18V9"/><path d="M10 21v-6h4v6"/></svg>
                            </div>
                            <div class="prod-card__store-avatar--fallback" style="display:none">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v2H3z"/><path d="M5 3h14l2 4H3l2-4z"/><path d="M3 9v12h18V9"/><path d="M10 21v-6h4v6"/></svg>
                            </div>
                            <span class="prod-card__store-name" th:text="${p.store != null ? p.store.storeName : '—'}">Store</span><span class="prod-card__store-addr" style="font-size:9px;color:#999;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:if="${p.store != null and p.store.address != null}" th:text="${p.store.address}">Address</span>
                        </div>
                    </div>
                    </a>
                    <div class="prod-card__actions">
                        <button class="prod-card__btn prod-card__btn--cart"
                            th:attr="data-pid=${p.productId},data-pname=${p.name},data-sprice=${dealInfo != null ? dealInfo.salePrice : (p.currentPrice != null ? p.currentPrice : p.originalPrice)},data-oprice=${dealInfo != null ? dealInfo.originalPrice : p.originalPrice},data-sname=${p.store != null ? p.store.storeName : ''},data-img=${p.imageUrl != null ? p.imageUrl : ''},data-did=${dealInfo != null ? dealInfo.dealId : 0},data-sid=${p.store != null ? p.store.storeId : 0},data-dtype=${dealInfo != null ? dealInfo.dealType : ''},data-dname=${dealInfo != null ? dealInfo.typeLabel : ''}"
                            onclick="event.stopPropagation();addToCartCat(Number(this.dataset.pid),this.dataset.pname,Number(this.dataset.sprice),Number(this.dataset.oprice),this.dataset.sname,this.dataset.img,Number(this.dataset.did),Number(this.dataset.sid),this.dataset.dtype,this.dataset.dname)" aria-label="Thêm vào giỏ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></button>
                        <button class="prod-card__btn prod-card__btn--buy"
                            th:attr="data-pid=${p.productId},data-pname=${p.name},data-sprice=${dealInfo != null ? dealInfo.salePrice : (p.currentPrice != null ? p.currentPrice : p.originalPrice)},data-oprice=${dealInfo != null ? dealInfo.originalPrice : p.originalPrice},data-sname=${p.store != null ? p.store.storeName : ''},data-img=${p.imageUrl != null ? p.imageUrl : ''},data-did=${dealInfo != null ? dealInfo.dealId : 0},data-sid=${p.store != null ? p.store.storeId : 0},data-dtype=${dealInfo != null ? dealInfo.dealType : ''},data-dname=${dealInfo != null ? dealInfo.typeLabel : ''}"
                            onclick="event.stopPropagation();buyNowCat(Number(this.dataset.pid),this.dataset.pname,Number(this.dataset.sprice),Number(this.dataset.oprice),this.dataset.sname,this.dataset.img,Number(this.dataset.did),Number(this.dataset.sid),this.dataset.dtype,this.dataset.dname)">Mua ngay</button>
                    </div>
                </div>
            </th:block>
        </th:block>
    </div>

    <div class="empty-state" th:unless="${products != null and !products.isEmpty()}">
        <div class="empty-state__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <div class="empty-state__title" th:text="${searchQuery != null or selectedPriceRange != null ? 'Không tìm thấy sản phẩm' : 'Danh mục trống'}">Không tìm thấy</div>
        <div class="empty-state__desc" th:text="${searchQuery != null or selectedPriceRange != null ? 'Thử bỏ lọc hoặc từ khóa khác' : 'Danh mục này chưa có sản phẩm nào'}">Thử lại</div>
    </div>
</div>

<div th:replace="~{common/buyer/mobile-nav :: mobileNav}"></div>
<div th:replace="~{common/buyer/js :: js}"></div>

<script>
let searchTimer;
function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){document.getElementById('searchForm').submit();}, 300);
}

function addToCartCat(productId, productName, salePrice, originalPrice, storeName, imageUrl, dealId, storeId, dealType, dealName) {
    var fd = new URLSearchParams();
    fd.append('dealId', dealId || 0);
    fd.append('productId', productId);
    fd.append('productName', productName);
    fd.append('salePrice', salePrice);
    fd.append('originalPrice', originalPrice);
    fd.append('storeName', storeName);
    fd.append('productImage', imageUrl || '');
    if (storeId) fd.append('storeId', storeId);
    if (dealType) fd.append('dealType', dealType);
    if (dealName) fd.append('dealName', dealName);
    fetch('/api/cart/add', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
        .then(function(r){return r.json()})
        .then(function(d){
            toast(d.message || 'Đã thêm vào giỏ', !d.success);
            if (d.success) { flashCartBtn(productId); updateBadge(d.count); }
        })
        .catch(function(){toast('Lỗi kết nối, thử lại sau', true);});
}

function buyNowCat(productId, productName, salePrice, originalPrice, storeName, imageUrl, dealId, storeId, dealType, dealName) {
    var fd = new URLSearchParams();
    fd.append('dealId', dealId || 0);
    fd.append('productId', productId);
    fd.append('productName', productName);
    fd.append('salePrice', salePrice);
    fd.append('originalPrice', originalPrice);
    fd.append('storeName', storeName);
    fd.append('productImage', imageUrl || '');
    if (storeId) fd.append('storeId', storeId);
    if (dealType) fd.append('dealType', dealType);
    if (dealName) fd.append('dealName', dealName);
    fetch('/api/cart/add', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
        .then(function(r){return r.json()})
        .then(function(d){
            if (d.success) { window.location.href='/buyer/checkout'; }
            else { toast(d.message || 'Không thể mua ngay', true); }
        })
        .catch(function(){toast('Lỗi kết nối, thử lại sau', true);});
}

function toast(msg, isError) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:' + (isError ? '#dc2626' : '#1a1a1a') + ';color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:600;z-index:9999;pointer-events:none;';
    document.body.appendChild(t);
    setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(function(){t.remove();},400);},2000);
}

function flashCartBtn(pid) {
  var btn = document.querySelector('.prod-card__btn--cart[data-pid="' + pid + '"]');
  if (!btn) return;
  btn.classList.add('cart-added');
  setTimeout(function(){ btn.classList.remove('cart-added'); }, 600);
}

function updateBadge(count) {
    var b = document.querySelector('.mobile-nav__cart__badge');
    if (b) { b.textContent = count || ''; b.style.display = (count > 0) ? 'flex' : 'none'; }
}
</script>

<div th:replace="~{common/buyer/footer :: footer}"></div>
</body>
</html>
