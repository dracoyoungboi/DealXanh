<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng — DealXanh</title>
    <div th:replace="~{common/buyer/css :: css}"></div>
    <link rel="stylesheet" th:href="@{/css/pages/home.css}">
    <style>
html{height:auto;min-height:100%}
body{padding-bottom:80px;background:var(--background)}

.back-bar{padding:12px 16px;display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--border)}
.back-bar a{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none}
.back-bar svg{width:18px;height:18px}
.cart-count-badge{background:var(--status-danger);color:#fff;min-width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Cart items */
.cart-body{padding:12px 16px 120px;display:flex;flex-direction:column;gap:10px}
.cart-item{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);padding:12px;display:flex;gap:10px;align-items:center}
.cart-item img{width:64px;height:64px;border-radius:var(--radius-md);object-fit:cover;flex-shrink:0;background:var(--background)}
.cart-item .ci-info{flex:1;min-width:0}
.cart-item .ci-name{font-size:13px;font-weight:600;margin-bottom:2px;line-height:1.3}
.cart-item .ci-store{font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.cart-item .ci-price{display:flex;align-items:baseline;gap:6px}
.cart-item .ci-sale{font-size:15px;font-weight:700;color:var(--primary)}
.cart-item .ci-original{font-size:11px;color:var(--text-tertiary);text-decoration:line-through}

.cart-item .ci-qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cart-item .ci-qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;color:var(--text-primary);font-family:var(--font-family)}
.cart-item .ci-qty button:hover{background:var(--background);border-color:var(--primary)}
.cart-item .ci-qty .qty-val{font-size:14px;font-weight:600;min-width:20px;text-align:center}
.cart-item .ci-remove{width:28px;height:28px;border-radius:50%;background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:16px;flex-shrink:0;font-family:var(--font-family)}

/* Summary */
.cart-summary{position:fixed;bottom:60px;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 16px;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.cart-summary .cs-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cart-summary .cs-label{font-size:13px;color:var(--text-secondary)}
.cart-summary .cs-total{font-size:20px;font-weight:800;color:var(--primary)}
.cart-summary .cs-count{font-size:11px;color:var(--text-tertiary)}
.cart-summary .btn-checkout{display:block;width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-family);transition:all 0.15s;text-align:center;text-decoration:none}
.cart-summary .btn-checkout:hover{background:var(--primary-dark)}

/* Empty */
.empty-cart{text-align:center;padding:80px 24px}
.empty-cart .ec-icon{width:80px;height:80px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--background);border-radius:50%;color:var(--text-tertiary)}
.empty-cart .ec-title{font-size:18px;font-weight:700;margin-bottom:8px}
.empty-cart .ec-desc{font-size:13px;color:var(--text-secondary);margin-bottom:16px}
.empty-cart .ec-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--primary);color:#fff;border-radius:var(--radius-md);font-size:14px;font-weight:600;text-decoration:none}

.toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--radius-md);font-size:13px;font-weight:600;z-index:200;background:#059669;color:#fff;box-shadow:var(--shadow-lg);animation:toastIn .3s ease}
.toast.error{background:#dc2626}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    </style>
</head>
<body>

<div class="back-bar">
    <a href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Trang chủ
    </a>
    <span style="flex:1;font-size:17px;font-weight:700;">Giỏ hàng</span>
    <span class="cart-count-badge" id="cartCountTop">0</span>
</div>

<!-- Not logged in state -->
<div id="cartLogin" style="display:none;text-align:center;padding:100px 24px;">
    <div style="width:80px;height:80px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:#f0f2f5;border-radius:50%;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div style="font-size:17px;font-weight:700;margin-bottom:6px;">Bạn chưa đăng nhập</div>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:20px;">Hãy đăng nhập để mua sắm và theo dõi đơn hàng</div>
    <a href="/login" style="display:inline-flex;align-items:center;gap:6px;padding:12px 28px;background:var(--primary);color:#fff;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;">Đăng nhập</a>
</div>

<!-- Cart items -->
<div class="cart-body" id="cartItems">
    <div style="text-align:center;padding:40px;color:var(--text-tertiary);">Đang tải giỏ hàng...</div>
</div>

<!-- Empty state (hidden by default) -->
<div class="empty-cart" id="cartEmpty" style="display:none;">
    <div class="ec-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    </div>
    <div class="ec-title">Giỏ hàng trống</div>
    <div class="ec-desc">Thêm sản phẩm từ các deal để bắt đầu</div>
    <a href="/" class="ec-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Săn deal ngay
    </a>
</div>

<!-- Summary (hidden when empty) -->
<div class="cart-summary" id="cartSummary" style="display:none;">
    <div class="cs-row">
        <span class="cs-label">Tạm tính (<span id="csCount">0</span> sản phẩm)</span>
        <span class="cs-total" id="csTotal">0đ</span>
    </div>
    <a href="/buyer/checkout" class="btn-checkout">Thanh toán</a>
</div>

<div th:replace="~{common/buyer/mobile-nav :: mobileNav}"></div>
<div th:replace="~{common/buyer/js :: js}"></div>

<script th:inline="javascript">
var isLoggedIn = /*[[${isLoggedIn != null ? isLoggedIn : false}]]*/ false;
var cartItems = [];

function loadCart() {
    if (!isLoggedIn) {
        document.getElementById('cartItems').style.display = 'none';
        document.getElementById('cartEmpty').style.display = 'none';
        document.getElementById('cartSummary').style.display = 'none';
        document.getElementById('cartLogin').style.display = '';
        document.getElementById('cartCountTop').textContent = '0';
        return;
    }
    document.getElementById('cartLogin').style.display = 'none';
    fetch('/api/cart')
        .then(function(r){return r.json()})
        .then(function(d){
            cartItems = d.items || [];
            renderCart();
            updateCartBadge(d.count || 0);
        })
        .catch(function(){document.getElementById('cartItems').innerHTML = '<div style="text-align:center;padding:40px;color:var(--status-danger);">Lỗi tải giỏ hàng</div>'});
}

function renderCart() {
    var list = document.getElementById('cartItems');
    var empty = document.getElementById('cartEmpty');
    var summary = document.getElementById('cartSummary');

    if (!cartItems.length) {
        list.style.display = 'none';
        empty.style.display = '';
        summary.style.display = 'none';
        return;
    }

    list.style.display = '';
    empty.style.display = 'none';
    summary.style.display = '';

    var totalItems = 0;
    var totalPrice = 0;

    var html = '';
    cartItems.forEach(function(item){
        var qty = item.quantity || 1;
        totalItems += qty;
        totalPrice += item.salePrice * qty;

        html += '<div class="cart-item">'
            + '<img src="' + (item.productImage || '/img/default-banner.svg') + '" alt="" onerror="this.src=\'/img/default-banner.svg\'">'
            + '<div class="ci-info">'
            + '<div class="ci-name">' + esc(item.productName) + '</div>'
            + '<div class="ci-store">' + esc(item.storeName) + '</div>'
            + '<div class="ci-price">'
            + '<span class="ci-sale">' + fmt(item.salePrice) + '</span>'
            + '<span class="ci-original">' + fmt(item.originalPrice) + '</span>'
            + '</div></div>'
            + '<div class="ci-qty">'
            + '<button onclick="updateQty(' + item.productId + ',' + (qty-1) + ')">−</button>'
            + '<span class="qty-val">' + qty + '</span>'
            + '<button onclick="updateQty(' + item.productId + ',' + (qty+1) + ')">+</button>'
            + '</div>'
            + '<button class="ci-remove" onclick="removeItem(' + item.productId + ')">✕</button>'
            + '</div>';
    });

    list.innerHTML = html;
    document.getElementById('csCount').textContent = totalItems;
    document.getElementById('csTotal').textContent = fmt(totalPrice);
    document.getElementById('cartCountTop').textContent = totalItems;
}

function updateQty(productId, qty) {
    var fd = new URLSearchParams();
    fd.append('productId', productId);
    fd.append('quantity', qty);
    fetch('/api/cart/update', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
        .then(function(r){return r.json()})
        .then(function(d){
            if (d.success) { loadCart(); updateCartBadge(d.count); }
        });
}

function removeItem(productId) {
    var fd = new URLSearchParams();
    fd.append('productId', productId);
    fetch('/api/cart/remove', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
        .then(function(r){return r.json()})
        .then(function(d){
            if (d.success) { loadCart(); updateCartBadge(d.count); showToast('Đã xoá'); }
        });
}

function updateCartBadge(count) {
    var b = document.getElementById('mobile-nav-cart-badge');
    if (b) {
        if (count > 0) { b.textContent = count; b.style.display = ''; }
        else b.style.display = 'none';
    }
    var top = document.getElementById('cartCountTop');
    if (top) top.textContent = count || 0;
}

function showToast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},300)},2000);
}

function fmt(n) { return (n||0).toLocaleString('vi-VN') + 'đ'; }
function esc(s) { var d=document.createElement('div');d.textContent=s;return d.innerHTML; }

loadCart();
</script>
</body>
</html>
