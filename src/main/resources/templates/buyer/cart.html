<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng — DealXanh</title>
    <div th:replace="~{common/buyer/css :: css}"></div>
    <link rel="stylesheet" th:href="@{/css/pages/home.css}">
    <style>
html{height:auto;min-height:100%}
body{padding-bottom:80px;background:var(--background)}

.back-bar{padding:12px 16px;display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--border)}
.back-bar a{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none}
.back-bar svg{width:18px;height:18px}
.cart-count-badge{background:var(--status-danger);color:#fff;min-width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Cart items */
.cart-body{padding:12px 16px 220px;display:flex;flex-direction:column;gap:10px}
.cart-item{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);padding:12px;display:flex;gap:10px;align-items:center}
.cart-item img{width:64px;height:64px;border-radius:var(--radius-md);object-fit:cover;flex-shrink:0;background:var(--background)}
.cart-item .ci-info{flex:1;min-width:0}
.cart-item .ci-name{font-size:13px;font-weight:600;margin-bottom:2px;line-height:1.3}
.cart-item .ci-store{font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.deal-badge{display:inline-block;padding:1px 6px;border-radius:var(--radius-full);font-size:9px;font-weight:700;margin-left:4px}
.deal-badge--FLASH_SALE{background:#fef3c7;color:#d97706}
.deal-badge--VOUCHER{background:#dbeafe;color:#2563eb}
.deal-badge--COMBO{background:#fce7f3;color:#be185d}
.deal-badge--SEASONAL{background:#e0e7ff;color:#5b21b6}
.cart-item .ci-price{display:flex;align-items:baseline;gap:6px}
.cart-item .ci-sale{font-size:15px;font-weight:700;color:var(--primary)}
.cart-item .ci-original{font-size:11px;color:var(--text-tertiary);text-decoration:line-through}

.cart-item .ci-qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cart-item .ci-qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;color:var(--text-primary);font-family:var(--font-family)}
.cart-item .ci-qty button:hover{background:var(--background);border-color:var(--primary)}
.cart-item .ci-qty .qty-val{font-size:14px;font-weight:600;min-width:20px;text-align:center}
.cart-item .ci-remove{width:28px;height:28px;border-radius:50%;background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:16px;flex-shrink:0;font-family:var(--font-family)}

/* Summary */
.cart-summary{position:fixed;bottom:72px;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:0 0 20px;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.08);border-radius:16px 16px 0 0}
.cart-summary .cs-row{display:flex;justify-content:space-between;align-items:center;margin:0 16px 4px;}
.cart-summary .cs-label{font-size:13px;color:var(--text-secondary)}
.cart-summary .cs-total{font-size:20px;font-weight:800;color:var(--primary)}
.cart-summary .cs-original{font-size:12px;color:var(--text-tertiary);text-decoration:line-through;text-align:right}
.cart-summary .cs-discount{font-size:11px;color:var(--danger);text-align:right;margin-bottom:2px}
.cart-summary .cs-count{font-size:11px;color:var(--text-tertiary)}
.cart-summary .btn-checkout{display:block;width:calc(100% - 32px);margin:0 16px;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-family);transition:all 0.15s;text-align:center;text-decoration:none}
.cart-summary .btn-checkout:hover{background:var(--primary-dark)}

/* Collapsible handle */
.cs-handle-wrap{padding:8px 16px 6px;cursor:pointer;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center}
.cs-handle{width:32px;height:4px;background:var(--border);border-radius:2px}
.cs-handle-label{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;font-weight:600;color:var(--text-secondary)}
.cs-handle-chevron{color:var(--text-tertiary);transition:transform .25s}
.cs-extras{padding:4px 16px 8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.cs-extras .cart-voucher{padding:0}

/* Voucher in cart */
.cart-voucher{padding:8px 16px 0}
.cart-voucher-inner{display:flex;gap:6px;align-items:center}
.cart-voucher-btn{flex:1;display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(212,175,55,.08);border:1px dashed var(--accent);border-radius:var(--radius-md);font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;font-family:var(--font-family);justify-content:center;transition:all .15s}
.cart-voucher-btn:hover{background:rgba(212,175,55,.15);border-style:solid}
.cart-voucher-msg{font-size:10px;padding:2px 0 0;display:none}
.cart-voucher-applied{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:var(--radius-md)}
.cart-voucher-applied__info{display:flex;align-items:center;gap:6px}
.cart-voucher-applied__code{font-size:13px;font-weight:700;color:var(--status-success)}
.cart-voucher-applied__remove{padding:3px 8px;font-size:10px;font-weight:600;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.06);color:#dc2626;border-radius:var(--radius-full);cursor:pointer;font-family:var(--font-family)}

/* Voucher modal */
.vm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.vm-overlay.show{display:flex}
.vm-panel{background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:500px;max-height:70vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.vm-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-light)}
.vm-title{font-size:15px;font-weight:700}
.vm-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--background);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font-family)}
.vm-list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.vm-voucher{padding:12px;border:1px solid var(--border-light);border-radius:var(--radius-lg);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.vm-voucher:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(212,175,55,.15)}
.vm-voucher--disabled{opacity:.45;pointer-events:none}
.vm-voucher__left{width:42px;height:42px;border-radius:var(--radius-md);background:rgba(212,175,55,.12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.vm-voucher__info{flex:1;min-width:0}
.vm-voucher__code{font-size:14px;font-weight:700;color:var(--text-primary)}
.vm-voucher__name{font-size:11px;color:var(--text-secondary);margin-top:1px}
.vm-voucher__meta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.vm-voucher__chip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--radius-full)}
.vm-chip-discount{background:rgba(220,38,38,.08);color:#dc2626}
.vm-chip-min{background:rgba(245,158,11,.08);color:#b45309}
.vm-chip-expiry{background:rgba(107,114,128,.1);color:#6b7280}

/* Empty */
.empty-cart{text-align:center;padding:80px 24px}
.empty-cart .ec-icon{width:80px;height:80px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--background);border-radius:50%;color:var(--text-tertiary)}
.empty-cart .ec-title{font-size:18px;font-weight:700;margin-bottom:8px}
.empty-cart .ec-desc{font-size:13px;color:var(--text-secondary);margin-bottom:16px}
.empty-cart .ec-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--primary);color:#fff;border-radius:var(--radius-md);font-size:14px;font-weight:600;text-decoration:none}

.toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--radius-md);font-size:13px;font-weight:600;z-index:200;background:#059669;color:#fff;box-shadow:var(--shadow-lg);animation:toastIn .3s ease}
.toast.error{background:#dc2626}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    </style>
</head>
<body>

<!-- Desktop Top Navigation Bar -->
<div th:replace="~{common/buyer/top-nav :: topNav}"></div>

<div class="back-bar">
    <a href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Trang chủ
    </a>
    <span style="flex:1;font-size:17px;font-weight:700;">Giỏ hàng</span>
    <span class="cart-count-badge" id="cartCountTop">0</span>
</div>

<!-- Not logged in state -->
<div id="cartLogin" style="display:none;text-align:center;padding:100px 24px;">
    <div style="width:80px;height:80px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:#f0f2f5;border-radius:50%;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div style="font-size:17px;font-weight:700;margin-bottom:6px;">Bạn chưa đăng nhập</div>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:20px;">Hãy đăng nhập để mua sắm và theo dõi đơn hàng</div>
    <a href="/login" style="display:inline-flex;align-items:center;gap:6px;padding:12px 28px;background:var(--primary);color:#fff;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;">Đăng nhập</a>
</div>

<!-- Cart items -->
<div class="cart-body" id="cartItems">
    <div style="text-align:center;padding:40px;color:var(--text-tertiary);">Đang tải giỏ hàng...</div>
</div>

<!-- Empty state (hidden by default) -->
<div class="empty-cart" id="cartEmpty" style="display:none;">
    <div class="ec-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    </div>
    <div class="ec-title">Giỏ hàng trống</div>
    <div class="ec-desc">Thêm sản phẩm từ các deal để bắt đầu</div>
    <a href="/" class="ec-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Săn deal ngay
    </a>
</div>

<!-- Summary (hidden when empty) -->
<div class="cart-summary" id="cartSummary" style="display:none;">
    <!-- Collapsible handle -->
    <div class="cs-handle-wrap" id="csHandle" onclick="toggleCartExtras()">
        <div class="cs-handle"></div>
        <div class="cs-handle-label" id="csHandleLabel">
            <span>🎫</span> Mã giảm giá & Giảm giá
            <svg class="cs-handle-chevron" id="csHandleChevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
    </div>

    <!-- Expandable content: voucher + deal breakdown -->
    <div class="cs-extras" id="csExtras" style="display:none;">
        <div class="cart-voucher">
            <div class="cart-voucher-applied" id="voucherApplied" style="display:none;">
                <div class="cart-voucher-applied__info">
                    <span>🎫</span>
                    <span class="cart-voucher-applied__code" id="voucherAppliedCode"></span>
                </div>
                <button class="cart-voucher-applied__remove" onclick="removeVoucher()">Xoá</button>
            </div>
            <div class="cart-voucher-inner" id="voucherSelect">
                <button class="cart-voucher-btn" onclick="openVoucherModal()">
                    🎫 Chọn mã giảm giá
                </button>
            </div>
            <div class="cart-voucher-msg" id="voucherMsg"></div>
        </div>
        <div class="deal-breakdown" id="dealBreakdown" style="display:none;margin-top:6px;padding:10px 12px;background:rgba(13,92,46,.04);border-radius:8px;border:1px solid rgba(13,92,46,.12);font-size:12px;"></div>
    </div>

    <div class="cs-row" style="margin-top:6px;">
        <span class="cs-label">Tạm tính (<span id="csCount">0</span> sản phẩm)</span>
        <div style="text-align:right;">
            <div class="cs-original" id="csOriginal" style="display:none;"></div>
            <div class="cs-discount" id="csDiscount" style="display:none;"></div>
            <div class="cs-total" id="csTotal">0đ</div>
        </div>
    </div>
    <a href="/buyer/checkout" class="btn-checkout" id="btnCheckout" onclick="saveSelectedItems(event)">Thanh toán</a>
</div>

<!-- Voucher Modal -->
<div class="vm-overlay" id="voucherModal" onclick="closeVoucherModal(event)">
    <div class="vm-panel" onclick="event.stopPropagation()">
        <div class="vm-header">
            <span class="vm-title">🎫 Chọn mã giảm giá</span>
            <button class="vm-close" onclick="closeVoucherModal()">✕</button>
        </div>
        <div class="vm-list" id="voucherList">
            <div style="text-align:center;padding:30px;color:var(--text-tertiary);">Đang tải...</div>
        </div>
    </div>
</div>

<div th:replace="~{common/buyer/mobile-nav :: mobileNav}"></div>
<div th:replace="~{common/buyer/js :: js}"></div>

<script th:inline="javascript">
var isLoggedIn = /*[[${isLoggedIn != null ? isLoggedIn : false}]]*/ false;
var cartItems = [];
var appliedVoucher = null;

function loadCart() {
    if (!isLoggedIn) {
        document.getElementById('cartItems').style.display = 'none';
        document.getElementById('cartEmpty').style.display = 'none';
        document.getElementById('cartSummary').style.display = 'none';
        document.getElementById('cartLogin').style.display = '';
        document.getElementById('cartCountTop').textContent = '0';
        return;
    }
    document.getElementById('cartLogin').style.display = 'none';
    fetch('/api/cart')
        .then(function(r){return r.json()})
        .then(function(d){
            cartItems = d.items || [];
            appliedVoucher = d.voucher || null;
            renderCart();
            updateCartBadge(d.count || 0);
            // Show applied voucher if exists
            if (appliedVoucher) {
                document.getElementById('voucherSelect').style.display = 'none';
                var app = document.getElementById('voucherApplied');
                app.style.display = 'flex';
                document.getElementById('voucherAppliedCode').textContent = appliedVoucher.code + ' - ' + (appliedVoucher.dealName || '');
                expandCartExtras(); // auto-expand to show applied voucher
            } else {
                document.getElementById('voucherApplied').style.display = 'none';
                document.getElementById('voucherSelect').style.display = '';
            }
        })
        .catch(function(){document.getElementById('cartItems').innerHTML = '<div style="text-align:center;padding:40px;color:var(--status-danger);">Lỗi tải giỏ hàng</div>'});
}

function renderCart() {
    var list = document.getElementById('cartItems');
    var empty = document.getElementById('cartEmpty');
    var summary = document.getElementById('cartSummary');

    if (!cartItems.length) {
        list.style.display = 'none';
        empty.style.display = '';
        summary.style.display = 'none';
        return;
    }

    list.style.display = '';
    empty.style.display = 'none';
    summary.style.display = '';

    var totalItems = 0;
    var totalPrice = 0;
    var totalOriginal = 0;

    var html = '';
    // Select-all header
    html += '<div style="display:flex;align-items:center;gap:10px;padding:6px 0 10px;border-bottom:1px solid var(--border-light);margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text-primary);">'
        + '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;">'
        + '<input type="checkbox" id="selectAll" checked onchange="toggleSelectAll(this.checked)" style="width:16px;height:16px;accent-color:var(--primary);">'
        + 'Chọn tất cả (<span id="selectedCount">0</span>)'
        + '</label></div>';
    cartItems.forEach(function(item){
        var qty = item.quantity || 1;
        var maxStock = item.maxStock || 0;
        var unavailable = item.unavailable === true;
        var reason = item.unavailableReason || '';
        var atMax = qty >= maxStock;

        if (unavailable) {
            // Unavailable item: greyed out, no +/- buttons, only remove
            html += '<div class="cart-item cart-item--unavailable" style="opacity:0.5;">'
                + '<img src="' + (item.productImage || '/img/default-banner.svg') + '" alt="" onerror="this.src=\'/img/default-banner.svg\'" style="filter:grayscale(1)">'
                + '<div class="ci-info">'
                + '<div class="ci-name">' + esc(item.productName) + '</div>'
                + '<div class="ci-store">' + esc(item.storeName) + '</div>'
                + '<div class="ci-sale" style="text-decoration:line-through;">' + fmt(item.salePrice) + '</div>'
                + '<div style="font-size:11px;color:var(--status-danger);margin-top:3px;font-weight:600;">' + esc(reason) + '</div>'
                + '<div style="font-size:10px;color:var(--text-tertiary);">Kho: 0 sản phẩm</div>'
                + '</div>'
                + '<button class="ci-remove" onclick="removeItem(' + item.productId + ')" style="pointer-events:auto;">✕</button>'
                + '</div>';
        } else {
            totalItems += qty;
            totalPrice += (item.salePrice || 0) * qty;
            totalOriginal += (item.originalPrice || item.salePrice || 0) * qty;

            html += '<div class="cart-item">'
                + '<input type="checkbox" class="cart-item-cb" checked onchange="recalcCart()" data-pid="' + item.productId + '" style="width:16px;height:16px;accent-color:var(--primary);margin-right:4px;flex-shrink:0;">'
                + '<img src="' + (item.productImage || '/img/default-banner.svg') + '" alt="" onerror="this.src=\'/img/default-banner.svg\'">'
                + '<div class="ci-info">'
                + '<div class="ci-name">' + esc(item.productName) + '</div>'
                + '<div class="ci-store">' + esc(item.storeName) + '</div>'
                + '<div class="ci-price">'
                + '<span class="ci-sale">' + fmt(item.salePrice) + '</span>'
                + '</div>'
                + (maxStock > 0 ? '<div style="font-size:10px;color:var(--text-tertiary);margin-top:2px;">Kho: ' + maxStock + ' sản phẩm</div>' : '')
                + '</div>'
                + '<div class="ci-qty">'
                + '<button onclick="updateQty(' + item.productId + ',' + (qty-1) + ')">−</button>'
                + '<span class="qty-val">' + qty + '</span>'
                + '<button onclick="updateQty(' + item.productId + ',' + (qty+1) + ')"' + (atMax ? ' disabled style="opacity:.35;cursor:not-allowed"' : '') + '>+</button>'
                + '</div>'
                + '<button class="ci-remove" onclick="removeItem(' + item.productId + ')">✕</button>'
                + '</div>';
        }
    });

    list.innerHTML = html;
    recalcCart();
    document.getElementById('cartCountTop').textContent = totalItems;
}

var availableVouchers = [];
var selectedProductIds = [];

function recalcCart() {
    var cbs = document.querySelectorAll('.cart-item-cb');
    var cnt = 0;
    selectedProductIds = [];
    cbs.forEach(function(cb) {
        if (cb.checked) { cnt++; selectedProductIds.push(parseInt(cb.dataset.pid)); }
    });
    document.getElementById('selectedCount').textContent = cnt;
    document.getElementById('selectAll').checked = (cbs.length > 0 && cnt === cbs.length);

    // Recalculate from checked items only
    var ti = 0, tp = 0, to = 0;
    cartItems.forEach(function(item) {
        if (item.unavailable) return;
        if (selectedProductIds.indexOf(item.productId) < 0) return;
        var q = item.quantity || 1;
        ti += q; tp += (item.salePrice || 0) * q; to += (item.originalPrice || item.salePrice || 0) * q;
    });
    document.getElementById('csCount').textContent = ti;
    var vd = appliedVoucher ? (appliedVoucher.voucherDiscount || 0) : 0;
    var ft = tp - vd; if (ft < 0) ft = 0;
    document.getElementById('csTotal').textContent = fmt(ft);
    var dd = to - tp;
    var oe = document.getElementById('csOriginal');
    var de = document.getElementById('csDiscount');
    if (dd > 0 || vd > 0) {
        oe.style.display = ''; oe.textContent = 'Giá gốc ' + fmt(to);
        var parts = []; if (dd > 0) parts.push('Deal -' + fmt(dd)); if (vd > 0) parts.push('Voucher -' + fmt(vd));
        de.style.display = ''; de.textContent = parts.join(' · ');
    } else { oe.style.display = 'none'; de.style.display = 'none'; }

    // Build deal breakdown — group items by dealId
    var db = document.getElementById('dealBreakdown');
    var dealGroups = {};
    cartItems.forEach(function(item) {
        if (item.unavailable) return;
        if (selectedProductIds.indexOf(item.productId) < 0) return;
        var did = item.dealId || 0;
        if (did <= 0) return;
        if (!dealGroups[did]) {
            dealGroups[did] = { dealName: item.dealName, dealType: item.dealType, discountType: item.discountType, discountValue: item.discountValue || 0, applyMethod: item.applyMethod || '', items: [], totalOrig: 0, totalSale: 0 };
        }
        var q = item.quantity || 1;
        var sp = item.salePrice || 0;
        var op = item.originalPrice || sp;
        dealGroups[did].items.push({ name: item.productName, qty: q, orig: op, sale: sp, storeName: item.storeName });
        dealGroups[did].totalOrig += op * q;
        dealGroups[did].totalSale += sp * q;
    });

    var breakdownHtml = '';
    var keys = Object.keys(dealGroups);
    // Only show breakdown when a voucher is applied OR there are active AUTO_APPLY deals
    var hasVoucher = appliedVoucher && appliedVoucher.code;
    if (keys.length > 0 && hasVoucher) {
        breakdownHtml = '<div style="font-weight:700;color:var(--primary);margin-bottom:6px;">Chi tiết giảm giá</div>';
        keys.forEach(function(did) {
            var dg = dealGroups[did];
            var isAuto = dg.applyMethod === 'AUTO_APPLY';
            var totalDiff = dg.totalOrig - dg.totalSale;
            var pct = dg.totalOrig > 0 ? Math.round((totalDiff / dg.totalOrig) * 100) : 0;
            // Badge — only for AUTO_APPLY deals
            var badge = '', badgeStyle = '';
            if (isAuto) {
                badge = dg.discountType === 'FIXED' ? 'Giảm ' + fmt(dg.discountValue) + ' (cố định)' : 'Giảm ' + pct + '%';
                badgeStyle = 'background:rgba(16,185,129,.1);color:var(--success);';
            }
            // Group items by store for shop-level discount display
            var storeGroups = {};
            dg.items.forEach(function(it) {
                var sn = it.storeName || 'Cửa hàng';
                if (!storeGroups[sn]) storeGroups[sn] = { totalOrig: 0, totalSale: 0, count: 0 };
                storeGroups[sn].totalOrig += it.orig * it.qty;
                storeGroups[sn].totalSale += it.sale * it.qty;
                storeGroups[sn].count += it.qty;
            });
            var itemHtml = '';
            var storeKeys = Object.keys(storeGroups);
            storeKeys.forEach(function(sn) {
                var sg = storeGroups[sn];
                var sDiff = sg.totalOrig - sg.totalSale;
                var sPct = sg.totalOrig > 0 ? Math.round((sDiff / sg.totalOrig) * 100) : 0;
                itemHtml += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);padding:2px 0;">'
                    + '<span>' + esc(sn) + ' <span style="color:var(--text-tertiary);font-size:10px;">(' + sg.count + ' SP)</span></span>'
                    + (isAuto && sDiff > 0
                        ? '<span style="color:var(--danger);font-weight:500;">-' + fmt(sDiff) + ' (' + sPct + '%)</span>'
                        : '<span style="color:var(--text-tertiary);font-size:10px;">' + fmt(sg.totalOrig) + '</span>')
                    + '</div>';
            });
            var footerHtml = isAuto && totalDiff > 0
                ? '<div style="text-align:right;font-size:11px;font-weight:700;color:var(--danger);border-top:1px dashed rgba(0,0,0,.06);padding-top:3px;margin-top:2px;">Tổng giảm: -' + fmt(totalDiff) + (pct > 0 ? ' (' + pct + '%)' : '') + '</div>'
                : '<div style="text-align:right;font-size:10px;color:var(--text-tertiary);border-top:1px dashed rgba(0,0,0,.06);padding-top:3px;margin-top:2px;">Nhập mã <strong>' + esc(dg.dealName) + '</strong> để được giảm ' + (dg.discountType === 'FIXED' ? fmt(dg.discountValue) : dg.discountValue + '%') + '</div>';

            breakdownHtml += '<div style="margin-bottom:8px;padding:8px 10px;background:rgba(255,255,255,.7);border-radius:6px;border:1px solid ' + (isAuto ? 'rgba(16,185,129,.2)' : 'rgba(245,158,11,.2)') + ';">'
                + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
                + '<span style="font-weight:700;font-size:12px;color:var(--text-primary);">' + esc(dg.dealName) + '</span>'
                + (badge ? '<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;' + badgeStyle + '">' + badge + '</span>' : '')
                + '</div>'
                + itemHtml
                + footerHtml
                + '</div>';
        });
        db.innerHTML = breakdownHtml;
        db.style.display = '';
    } else {
        db.style.display = 'none';
    }
}

function toggleSelectAll(checked) {
    document.querySelectorAll('.cart-item-cb').forEach(function(cb) { cb.checked = checked; });
    recalcCart();
}

function saveSelectedItems(e) {
    if (selectedProductIds.length === 0) {
        e.preventDefault();
        alert('Vui lòng chọn ít nhất 1 sản phẩm để thanh toán');
        return;
    }
    e.preventDefault();
    var btn = document.getElementById('btnCheckout');
    if (btn) { btn.textContent = 'Đang xử lý...'; btn.style.pointerEvents = 'none'; }
    fetch('/api/cart/checkout-selection', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids: selectedProductIds})
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.success) { window.location.href = '/buyer/checkout'; }
        else { if (btn) { btn.textContent = 'Thanh toán'; btn.style.pointerEvents = ''; } alert(data.message || 'Lỗi'); }
    })
    .catch(function() { if (btn) { btn.textContent = 'Thanh toán'; btn.style.pointerEvents = ''; } });
}

function openVoucherModal() {
    var modal = document.getElementById('voucherModal');
    modal.classList.add('show');
    if (availableVouchers.length === 0) {
        fetch('/api/vouchers/available')
            .then(function(r){return r.json()})
            .then(function(d){
                availableVouchers = d.vouchers || [];
                renderVoucherList();
            })
            .catch(function(){
                document.getElementById('voucherList').innerHTML = '<div style="text-align:center;padding:30px;color:var(--status-danger);">Lỗi tải mã giảm giá</div>';
            });
    } else {
        renderVoucherList();
    }
}

function closeVoucherModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('voucherModal').classList.remove('show');
}

function renderVoucherList() {
    var list = document.getElementById('voucherList');
    if (!availableVouchers.length) {
        list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-tertiary);">Không có mã giảm giá nào khả dụng</div>';
        return;
    }
    var html = '';
    var cartTotal = parseFloat((document.getElementById('csTotal').textContent || '0đ').replace(/[^0-9]/g, ''));
    availableVouchers.forEach(function(v){
        var canApply = cartTotal >= (v.minOrderAmount || 0);
        var discountText = v.discountType === 'PERCENT' ? v.discountValue + '%' : fmt(v.discountValue);
        var maxText = v.discountType === 'PERCENT' && v.maxDiscountAmount ? ' (tối đa ' + fmt(v.maxDiscountAmount) + ')' : '';
        var minText = v.minOrderAmount ? 'Đơn tối thiểu ' + fmt(v.minOrderAmount) : 'Không giới hạn';
        var expiryText = v.endTime ? 'HSD: ' + new Date(v.endTime).toLocaleDateString('vi-VN') : '';
        html += '<div class="vm-voucher' + (canApply ? '' : ' vm-voucher--disabled') + '" onclick="' + (canApply ? 'selectVoucher(\'' + esc(v.code) + '\')' : '') + '">'
            + '<div class="vm-voucher__left">🎫</div>'
            + '<div class="vm-voucher__info">'
            + '<div class="vm-voucher__code">' + esc(v.code) + '</div>'
            + '<div class="vm-voucher__name">' + esc(v.dealName) + ' · ' + esc(v.storeName) + '</div>'
            + '<div class="vm-voucher__meta">'
            + '<span class="vm-voucher__chip vm-chip-discount">Giảm ' + discountText + maxText + '</span>'
            + '<span class="vm-voucher__chip vm-chip-min">' + minText + '</span>'
            + (expiryText ? '<span class="vm-voucher__chip vm-chip-expiry">' + expiryText + '</span>' : '')
            + '</div></div></div>';
    });
    list.innerHTML = html;
}

// ===== COLLAPSIBLE EXTRAS (Voucher + Breakdown) =====
var cartExtrasExpanded = false;
function toggleCartExtras() {
    cartExtrasExpanded = !cartExtrasExpanded;
    var extras = document.getElementById('csExtras');
    var chevron = document.getElementById('csHandleChevron');
    if (cartExtrasExpanded) {
        if (extras) extras.style.display = 'block';
        if (chevron) chevron.style.transform = 'rotate(180deg)';
    } else {
        if (extras) extras.style.display = 'none';
        if (chevron) chevron.style.transform = 'rotate(0deg)';
    }
}
function expandCartExtras() {
    if (!cartExtrasExpanded) toggleCartExtras();
}

function selectVoucher(code) {
    fetch('/api/cart/apply-voucher', {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'code=' + encodeURIComponent(code)
    })
    .then(function(r){return r.json()})
    .then(function(d){
        if (d.success) {
            location.reload();
        } else {
            var msg = document.getElementById('voucherMsg');
            msg.style.display = 'block';
            msg.style.color = '#dc2626';
            msg.textContent = d.message;
        }
    });
}

function removeVoucher() {
    fetch('/api/cart/remove-voucher', {method:'POST'})
    .then(function(){ location.reload(); });
}

function updateQty(productId, qty) {
    if (qty < 0) return;
    var fd = new URLSearchParams();
    fd.append('productId', productId);
    fd.append('quantity', qty);
    fetch('/api/cart/update', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
        .then(function(r){return r.json()})
        .then(function(d){
            if (d.success) { loadCart(); updateCartBadge(d.count); }
            else { showToast(d.message || 'Không thể cập nhật', true); }
        });
}

function removeItem(productId) {
    var fd = new URLSearchParams();
    fd.append('productId', productId);
    fetch('/api/cart/remove', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
        .then(function(r){return r.json()})
        .then(function(d){
            if (d.success) { loadCart(); updateCartBadge(d.count); showToast('Đã xoá'); }
        });
}

function updateCartBadge(count) {
    var b = document.getElementById('mobile-nav-cart-badge');
    if (b) {
        if (count > 0) { b.textContent = count; b.style.display = ''; }
        else b.style.display = 'none';
    }
    var top = document.getElementById('cartCountTop');
    if (top) top.textContent = count || 0;
}

function showToast(msg, isError) {
    var t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},300)},2500);
}

function fmt(n) { return (n||0).toLocaleString('vi-VN') + 'đ'; }
function esc(s) { var d=document.createElement('div');d.textContent=s;return d.innerHTML; }

loadCart();
</script>
