<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${product.name} — DealXanh|">Sản phẩm — DealXanh</title>
    <meta name="description" th:content="${product.description}">
    <div th:replace="~{common/buyer/css :: css}"></div>
    <link rel="stylesheet" th:href="@{/css/pages/home.css}">
    <style>
html{height:auto;min-height:100%}
body{padding-bottom:100px;background:var(--background);font-family:var(--font-family)}

.back-bar{padding:12px 16px;display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.back-bar a{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none}
.back-bar svg{width:18px;height:18px}

/* Product image */
.prod-hero{background:var(--surface);padding:8px;display:flex;justify-content:center}
.prod-hero img{width:100%;max-height:400px;object-fit:contain;display:block;background:#fafafa;border-radius:var(--radius-lg);border:1px solid var(--border-light)}

/* Info section */
.prod-body{padding:12px 16px 100px;display:flex;flex-direction:column;gap:12px}

/* Product card */
.prod-card{background:var(--surface);border-radius:var(--radius-lg);padding:16px;border:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
.prod-card__cat{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:rgba(13,92,46,.08);border-radius:var(--radius-full);font-size:11px;font-weight:600;color:var(--primary);margin-bottom:10px}
.prod-card__cat svg{width:11px;height:11px}
.prod-card__name{font-size:18px;font-weight:800;color:var(--text-primary);margin-bottom:8px;line-height:1.3}
.prod-card__desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:14px}

/* Price */
.prod-price{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.prod-price__sale{font-size:24px;font-weight:800;color:var(--primary)}
.prod-price__original{font-size:14px;color:var(--text-tertiary);text-decoration:line-through}
.prod-price__discount{display:inline-flex;align-items:center;padding:2px 8px;background:rgba(220,38,38,.1);color:#dc2626;border-radius:var(--radius-full);font-size:12px;font-weight:700}

/* Meta info */
.prod-meta{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light)}
.prod-meta__row{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.prod-meta__label{color:var(--text-tertiary)}
.prod-meta__val{font-weight:600;color:var(--text-primary)}
.prod-meta__val--green{color:var(--success)}
.prod-meta__val--red{color:var(--danger)}

/* Deal badge */
.deal-badge-sm{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:700;white-space:nowrap}
.deal-badge--FLASH_SALE{background:#fef3c7;color:#d97706}
.deal-badge--VOUCHER{background:#dbeafe;color:#2563eb}
.deal-badge--COMBO{background:#fce7f3;color:#be185d}
.deal-badge--SEASONAL{background:#e0e7ff;color:#5b21b6}

/* Countdown */
.expiry-countdown{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:var(--radius-md);font-size:12px;font-weight:600;color:#b45309;margin-top:8px}
.expiry-countdown svg{width:13px;height:13px;flex-shrink:0}

/* Store card */
.store-card{background:var(--surface);border-radius:var(--radius-lg);padding:14px 16px;border:1px solid var(--border-light);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px}
.store-card__img{width:48px;height:48px;border-radius:var(--radius-md);overflow:hidden;flex-shrink:0;background:var(--background);display:flex;align-items:center;justify-content:center}
.store-card__img img{width:100%;height:100%;object-fit:cover}
.store-card__img .fallback-icon{width:24px;height:24px;color:var(--text-tertiary)}
.store-card__info{flex:1;min-width:0}
.store-card__name{font-size:14px;font-weight:700;color:var(--text-primary)}
.store-card__addr{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.store-card__meta{display:flex;align-items:center;gap:6px;margin-top:4px}
.store-card__rating{font-size:11px;font-weight:600;color:#b45309}
.store-card__tier{display:inline-flex;padding:2px 7px;border-radius:var(--radius-full);font-size:9px;font-weight:700}
.tier--BRONZE{background:rgba(205,127,50,.12);color:#cd7f32}
.tier--SILVER{background:rgba(192,192,192,.2);color:#888}
.tier--GOLD{background:rgba(255,215,0,.2);color:#b8860b}
.tier--DIAMOND{background:rgba(185,242,255,.3);color:#0284c7}

/* Action buttons */
.action-strip{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom, 0px));left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px 20px;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.08);display:flex;gap:10px}
.btn-add-cart{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border:2px solid var(--primary);background:var(--surface);color:var(--primary);border-radius:var(--radius-md);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-family);transition:all .15s}
.btn-add-cart:hover{background:var(--status-success-bg)}
.btn-buy-now{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-family);transition:all .15s;box-shadow:0 4px 16px rgba(13,92,46,.25)}
.btn-buy-now:hover{background:var(--primary-dark)}

/* Toast */
.toast{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom, 0px) + 68px);left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--radius-md);font-size:13px;font-weight:600;z-index:200;background:#059669;color:#fff;box-shadow:var(--shadow-lg);animation:toastIn .3s ease}
.toast.error{background:#dc2626}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(min-width:768px){
    body{padding-bottom:80px}
    .prod-hero{max-width:520px;margin:0 auto;border-radius:var(--radius-lg);border:1px solid var(--border-light)}
    .prod-body{max-width:520px;margin:0 auto}
    .action-strip{bottom:0;max-width:560px;left:50%;transform:translateX(-50%);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
}
    </style>
</head>
<body>

<!-- Header -->
<div th:replace="~{common/buyer/header :: header}"></div>

<!-- Back bar -->
<div class="back-bar">
    <a href="javascript:history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Quay lại
    </a>
</div>

<!-- Product image -->
<div class="prod-hero">
    <img th:src="${product.imageUrl != null and !product.imageUrl.isEmpty() ? product.imageUrl : '/img/default-banner.svg'}"
         th:alt="${product.name}"
         onerror="this.src='/img/default-banner.svg'">
</div>

<div class="prod-body">

    <!-- Product info card -->
    <div class="prod-card">
        <!-- Category badge -->
        <div class="prod-card__cat" th:if="${category != null}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3z"/><path d="M17 14h3"/><path d="M14 17v3"/><path d="M17 20h3v-3"/></svg>
            <span th:text="${category.name}">Danh mục</span>
        </div>

        <!-- Name -->
        <h1 class="prod-card__name" th:text="${product.name}">Tên sản phẩm</h1>

        <!-- Description -->
        <div class="prod-card__desc" th:text="${product.description != null ? product.description : 'Chưa có mô tả'}">
            Mô tả sản phẩm
        </div>

        <!-- Price -->
        <div class="prod-price">
            <span class="prod-price__sale" th:if="${dealInfo != null}"
                  th:text="${@priceFormatter.format(dealInfo.salePrice)}">0đ</span>
            <span class="prod-price__sale" th:if="${dealInfo == null}"
                  th:text="${@priceFormatter.format(product.getDisplayPrice())}">0đ</span>
            <span class="prod-price__original" th:if="${dealInfo != null and dealInfo.originalPrice != null and dealInfo.salePrice != null and dealInfo.originalPrice > dealInfo.salePrice}"
                  th:text="${@priceFormatter.format(dealInfo.originalPrice)}">0đ</span>
            <th:block th:if="${dealInfo != null}">
                <span class="prod-price__discount" th:text="|-${dealInfo.discountPercent}%|">-0%</span>
            </th:block>
        </div>

        <!-- Deal badge if active deal -->
        <div th:if="${dealInfo != null}" style="margin-bottom:6px;">
            <span class="deal-badge-sm" th:classappend="|deal-badge--${dealInfo.dealType}|"
                  th:text="${dealInfo.typeLabel}">Deal</span>
            <span style="font-size:11px;font-weight:600;color:var(--text-primary);margin-left:6px;"
                  th:text="${dealInfo.dealName}">Tên deal</span>
        </div>

        <!-- Meta info -->
        <div class="prod-meta">
            <div class="prod-meta__row">
                <span class="prod-meta__label">Kho</span>
                <span class="prod-meta__val prod-meta__val--green" th:if="${product.stockQuantity > 0}"
                      th:text="|${product.stockQuantity} sản phẩm|">0 sản phẩm</span>
                <span class="prod-meta__val prod-meta__val--red" th:unless="${product.stockQuantity > 0}"
                      th:text="|${product.stockQuantity} sản phẩm|">0 sản phẩm</span>
            </div>
            <div class="prod-meta__row" th:if="${product.manufacturingDate != null}">
                <span class="prod-meta__label">Ngày sản xuất</span>
                <span class="prod-meta__val"
                      th:text="${#temporals.format(product.manufacturingDate, 'dd/MM/yyyy')}">-</span>
            </div>
            <div class="prod-meta__row" th:if="${product.expiryDate != null}">
                <span class="prod-meta__label">Hạn sử dụng</span>
                <span class="prod-meta__val"
                      th:text="${#temporals.format(product.expiryDate, 'dd/MM/yyyy')}">-</span>
            </div>
            <!-- Countdown đến HSD -->
            <div class="expiry-countdown" th:if="${product.expiryDate != null and product.remainingHours > 0 and product.remainingHours < 168}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span th:if="${product.remainingHours >= 24}"
                      th:text="|Còn ${product.remainingHours / 24} ngày trước HSD|">Còn X ngày</span>
                <span th:unless="${product.remainingHours >= 24}"
                      th:text="|Còn ${product.remainingHours} giờ trước HSD|">Còn X giờ</span>
            </div>
            <div class="prod-meta__row" th:if="${product.productType != null}">
                <span class="prod-meta__label">Loại</span>
                <span class="prod-meta__val"
                      th:text="${product.productType == 'COMBO' ? 'Combo' : 'Sản phẩm lẻ'}">-</span>
            </div>
        </div>

        <!-- Expiry countdown -->
        <div class="expiry-countdown" th:if="${expiryDate != null}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span th:text="|Hạn sử dụng: ${#temporals.format(product.expiryDate, 'dd/MM/yyyy')}|">HSD</span>
        </div>
    </div>

    <!-- Store card - clickable to store page -->
    <a th:if="${store != null}" th:href="@{'/store/' + ${store.storeId}}" style="text-decoration:none;color:inherit;">
        <div class="store-card">
            <div class="store-card__img">
                <img th:if="${store.logoUrl != null and !store.logoUrl.isEmpty()}"
                     th:src="${store.logoUrl}" alt="Store"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                <svg th:if="${store.logoUrl == null or store.logoUrl.isEmpty()}"
                     class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     style="display:flex;">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </div>
            <div class="store-card__info">
                <div class="store-card__name" th:text="${store.storeName}">Tên cửa hàng</div>
                <div class="store-card__addr" th:text="${store.address}">Địa chỉ</div>
                <div class="store-card__meta">
                    <span class="store-card__rating" th:if="${store.averageRating != null and store.averageRating > 0}"
                          th:text="|★ ${#numbers.formatDecimal(store.averageRating, 0, 1)}|">★ 4.5</span>
                    <span class="store-card__tier"
                          th:classappend="|tier--${store.partnerTier}|"
                          th:text="${store.getPartnerTierLabel()}">Đồng</span>
                </div>
            </div>
        </div>
    </a>

    <!-- Related products from same store -->
    <div th:if="${relatedProducts != null and !relatedProducts.isEmpty()}" style="margin-top:8px">
        <div style="font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:10px;padding-left:4px">
            Sản phẩm khác từ shop này
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
            <a th:each="rp : ${relatedProducts}" th:href="@{'/products/' + ${rp.productId}}"
               style="background:var(--surface);border-radius:var(--radius-md);overflow:hidden;text-decoration:none;color:inherit;border:1px solid var(--border-light)">
                <div style="width:100%;padding-top:75%;position:relative;overflow:hidden;background:#fafafa">
                    <img th:src="${rp.imageUrl != null ? rp.imageUrl : '/img/default-banner.svg'}"
                         th:alt="${rp.name}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover"
                         onerror="this.src='/img/default-banner.svg'" loading="lazy">
                </div>
                <div style="padding:6px 8px 8px">
                    <div style="font-size:10px;font-weight:500;color:#222;line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px" th:text="${rp.name}">Name</div>
                    <div style="font-size:12px;font-weight:700;color:#ee4d2d" th:text="${@priceFormatter.format(rp.getDisplayPrice())}">0đ</div>
                </div>
            </a>
        </div>
    </div>

</div>

<!-- Action buttons -->
<div class="action-strip" th:if="${product.stockQuantity > 0}">
    <button class="btn-add-cart"
            th:attr="data-pid=${product.productId},data-pname=${product.name},data-sale=${dealInfo != null ? dealInfo.salePrice : product.getDisplayPrice()},data-original=${dealInfo != null ? dealInfo.originalPrice : product.originalPrice},data-storename=${store != null ? store.storeName : ''},data-image=${product.imageUrl},data-dealid=${dealInfo != null ? dealInfo.dealId : 0},data-storeid=${store != null ? store.storeId : 0},data-dealtype=${dealInfo != null ? dealInfo.dealType : ''},data-dealname=${dealInfo != null ? dealInfo.dealName : ''}"
            onclick="addToCartDetail(
                Number(this.dataset.pid), this.dataset.pname,
                Number(this.dataset.sale), Number(this.dataset.original),
                this.dataset.storename, this.dataset.image,
                Number(this.dataset.dealid), Number(this.dataset.storeid),
                this.dataset.dealtype, this.dataset.dealname
            )">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Thêm vào giỏ
    </button>
    <button class="btn-buy-now"
            th:attr="data-pid=${product.productId},data-pname=${product.name},data-sale=${dealInfo != null ? dealInfo.salePrice : product.getDisplayPrice()},data-original=${dealInfo != null ? dealInfo.originalPrice : product.originalPrice},data-storename=${store != null ? store.storeName : ''},data-image=${product.imageUrl},data-dealid=${dealInfo != null ? dealInfo.dealId : 0},data-storeid=${store != null ? store.storeId : 0},data-dealtype=${dealInfo != null ? dealInfo.dealType : ''},data-dealname=${dealInfo != null ? dealInfo.dealName : ''}"
            onclick="buyNowDetail(
                Number(this.dataset.pid), this.dataset.pname,
                Number(this.dataset.sale), Number(this.dataset.original),
                this.dataset.storename, this.dataset.image,
                Number(this.dataset.dealid), Number(this.dataset.storeid),
                this.dataset.dealtype, this.dataset.dealname
            )">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Mua ngay
    </button>
</div>

<div class="action-strip" th:if="${product.stockQuantity <= 0}" style="justify-content:center;">
    <button class="btn-add-cart" disabled style="opacity:.5;cursor:not-allowed;flex:none;padding:12px 24px;">
        Hết hàng
    </button>
</div>

<div th:replace="~{common/buyer/mobile-nav :: mobileNav}"></div>
<div th:replace="~{common/buyer/js :: js}"></div>

<script>
function addToCartDetail(productId, productName, salePrice, originalPrice, storeName, productImage, dealId, storeId, dealType, dealName) {
    var fd = new URLSearchParams();
    fd.append('dealId', dealId || 0);
    fd.append('productId', productId);
    fd.append('productName', productName);
    fd.append('salePrice', salePrice);
    fd.append('originalPrice', originalPrice);
    fd.append('storeName', storeName);
    fd.append('productImage', productImage || '');
    if (storeId) fd.append('storeId', storeId);
    if (dealType) fd.append('dealType', dealType);
    if (dealName) fd.append('dealName', dealName);

    fetch('/api/cart/add', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
        .then(function(r){return r.json()})
        .then(function(d){
            showToast(d.message || 'Đã thêm vào giỏ', !d.success);
            if (d.success) updateCartBadge(d.count);
        })
        .catch(function(){showToast('Lỗi kết nối, thử lại sau', true);});
}

function buyNowDetail(productId, productName, salePrice, originalPrice, storeName, productImage, dealId, storeId, dealType, dealName) {
    var fd = new URLSearchParams();
    fd.append('dealId', dealId || 0);
    fd.append('productId', productId);
    fd.append('productName', productName);
    fd.append('salePrice', salePrice);
    fd.append('originalPrice', originalPrice);
    fd.append('storeName', storeName);
    fd.append('productImage', productImage || '');
    if (storeId) fd.append('storeId', storeId);
    if (dealType) fd.append('dealType', dealType);
    if (dealName) fd.append('dealName', dealName);

    fetch('/api/cart/add', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
        .then(function(r){return r.json()})
        .then(function(d){
            if (d.success) { window.location.href='/buyer/checkout'; }
            else { showToast(d.message || 'Không thể mua ngay', true); }
        })
        .catch(function(){showToast('Lỗi kết nối, thử lại sau', true);});
}

function showToast(msg, isError) {
    var t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},300);},2000);
}

function updateCartBadge(count) {
    var b = document.getElementById('mobile-nav-cart-badge');
    if (b) {
        if (count > 0) { b.textContent = count; b.style.display = ''; }
        else b.style.display = 'none';
    }
}
</script>

<div th:replace="~{common/buyer/footer :: footer}"></div>

</body>
</html>
