<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${store.storeName} — DealXanh|">Cửa hàng — DealXanh</title>
    <meta name="description" th:text="|Thông tin cửa hàng ${store.storeName} trên DealXanh — ${productCount} sản phẩm đang có deal|">
    <div th:replace="~{common/buyer/css :: css}"></div>
    <link rel="stylesheet" th:href="@{/css/pages/home.css}">
    <style>
html{height:auto;min-height:100%}
body{padding-bottom:80px;background:var(--background);font-family:var(--font-family)}
*,*::before,*::after{box-sizing:border-box}

/* Back bar */
.back-bar{padding:12px 16px;display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.back-bar a{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none}
.back-bar svg{width:18px;height:18px}
.back-bar__title{font-size:17px;font-weight:700;color:var(--text-primary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Store header */
.store-header{background:var(--surface);padding:28px 16px 20px;text-align:center;border-bottom:1px solid var(--border);position:relative}
.store-header__logo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--primary);margin:0 auto 12px;display:block;background:var(--background)}
.store-header__logo--fallback{width:80px;height:80px;border-radius:50%;background:var(--status-success-bg);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:var(--primary);border:3px solid var(--primary)}
.store-header__logo--fallback svg{width:36px;height:36px}
.store-header__name{font-size:22px;font-weight:800;color:var(--text-primary);margin-bottom:4px;line-height:1.3}
.store-header__address{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;gap:4px;line-height:1.4}
.store-header__address svg{width:14px;height:14px;flex-shrink:0}
.store-header__meta{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.store-header__rating{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--text-primary)}
.store-header__rating svg{width:16px;height:16px;color:var(--accent)}

/* Partner tier badge */
.tier-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:var(--radius-full);font-size:11px;font-weight:700;letter-spacing:.4px}
.tier-bronze{background:linear-gradient(135deg,#cd7f32,#8b5a2b);color:#fff}
.tier-silver{background:linear-gradient(135deg,#c0c0c0,#808080);color:#fff}
.tier-gold{background:linear-gradient(135deg,#ffd700,#b8860b);color:#5c3a00}
.tier-diamond{background:linear-gradient(135deg,#b9f2ff,#00bfff);color:#003d5c}

/* Description section */
.desc-section{margin:12px 16px;padding:16px;background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border)}
.desc-section__title{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:8px}
.desc-section__text{font-size:13px;color:var(--text-secondary);line-height:1.7}

/* Products section */
.products-section{padding:0 16px 20px}
.products-section__header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px}
.products-section__title{font-size:16px;font-weight:700;color:var(--text-primary)}
.products-section__count{font-size:12px;color:var(--text-secondary)}

/* Product grid — compact style like category page */
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:768px){.prod-grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media(min-width:1024px){.prod-grid{grid-template-columns:repeat(4,1fr);gap:12px}}

.prod-card{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;display:block;text-decoration:none;color:inherit;cursor:pointer;border:1px solid var(--border);transition:box-shadow .15s}
.prod-card:hover{box-shadow:var(--shadow-md)}
.prod-card:active{opacity:.9}

.prod-card__img-wrap{position:relative;width:100%;padding-top:100%;overflow:hidden;background:#fafafa}
.prod-card__img-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.prod-card__body{padding:6px 8px 8px}
.prod-card__name{font-size:11px;font-weight:500;color:#222;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:29px}
.prod-card__price{font-size:14px;font-weight:700;color:var(--primary);line-height:1}

/* Empty products */
.empty-products{text-align:center;padding:40px 16px}
.empty-products__icon{width:48px;height:48px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:var(--background);border-radius:50%;color:var(--text-tertiary)}
.empty-products__text{font-size:13px;color:var(--text-secondary)}
    </style>
</head>
<body>

<div th:replace="~{common/buyer/header :: header}"></div>

<!-- Back bar -->
<div class="back-bar">
    <a href="javascript:history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="back-bar__title" th:text="${store.storeName}">Cua hang</span>
</div>

<!-- Store header -->
<div class="store-header">
    <img class="store-header__logo"
         th:if="${store.logoUrl != null and !store.logoUrl.isEmpty()}"
         th:src="${store.logoUrl}"
         th:alt="${store.storeName}"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="store-header__logo--fallback"
         th:if="${store.logoUrl == null or store.logoUrl.isEmpty()}"
         style="display:flex">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7h18v2H3z"/><path d="M5 3h14l2 4H3l2-4z"/><path d="M3 9v12h18V9"/><path d="M10 21v-6h4v6"/>
        </svg>
    </div>
    <div class="store-header__logo--fallback" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7h18v2H3z"/><path d="M5 3h14l2 4H3l2-4z"/><path d="M3 9v12h18V9"/><path d="M10 21v-6h4v6"/>
        </svg>
    </div>

    <h1 class="store-header__name" th:text="${store.storeName}">Store Name</h1>

    <div class="store-header__address" th:if="${store.address != null and !store.address.isEmpty()}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span th:text="${store.address}">Địa chỉ cửa hàng</span>
    </div>

    <div class="store-header__meta">
        <!-- Rating -->
        <div class="store-header__rating" th:if="${store.averageRating != null and store.averageRating > 0}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.97 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span th:text="${#numbers.formatDecimal(store.averageRating, 0, 1)}">4.5</span>
        </div>

        <!-- Partner tier -->
        <span class="tier-badge"
              th:classappend="${store.partnerTier == null or store.partnerTier == 'BRONZE' ? 'tier-bronze' : (store.partnerTier == 'SILVER' ? 'tier-silver' : (store.partnerTier == 'GOLD' ? 'tier-gold' : 'tier-diamond'))}"
              th:switch="${store.partnerTier != null ? store.partnerTier : 'BRONZE'}">
            <span th:case="'BRONZE'">Đồng</span>
            <span th:case="'SILVER'">Bạc</span>
            <span th:case="'GOLD'">Vàng</span>
            <span th:case="'DIAMOND'">Kim Cương</span>
            <span th:case="*">Đồng</span>
        </span>
    </div>
</div>

<!-- Description -->
<div class="desc-section" th:if="${store.description != null and !store.description.isEmpty()}">
    <div class="desc-section__title">Giới thiệu</div>
    <div class="desc-section__text" th:text="${store.description}">Mô tả cửa hàng...</div>
</div>

<!-- Products -->
<div class="products-section">
    <div class="products-section__header">
        <span class="products-section__title" th:text="|Sản phẩm của cửa hàng (${productCount})|">Sản phẩm của cửa hàng (0)</span>
    </div>

    <div class="prod-grid" th:if="${products != null and !products.isEmpty()}">
        <th:block th:each="p : ${products}">
            <a class="prod-card" th:href="@{/product/{id}(id=${p.productId})}">
                <div class="prod-card__img-wrap">
                    <img th:src="${p.imageUrl != null ? p.imageUrl : '/img/default-banner.svg'}" th:alt="${p.name}" onerror="this.src='/img/default-banner.svg'" loading="lazy">
                </div>
                <div class="prod-card__body">
                    <div class="prod-card__name" th:text="${p.name}">Product name</div>
                    <div class="prod-card__price" th:text="|${#numbers.formatDecimal(p.currentPrice != null ? p.currentPrice : p.originalPrice, 0, 0)}đ|">50,000đ</div>
                </div>
            </a>
        </th:block>
    </div>

    <div class="empty-products" th:unless="${products != null and !products.isEmpty()}">
        <div class="empty-products__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </div>
        <div class="empty-products__text">Cửa hàng chưa có sản phẩm nào</div>
    </div>
</div>

<!-- ===== REVIEW SECTION ===== -->
<div class="review-section" id="reviewSection">
    <div class="review-section__header">
        <h3>Đánh giá cửa hàng</h3>
        <span class="review-section__avg" id="reviewAvg"></span>
    </div>

    <!-- Review form -->
    <div class="review-form" id="reviewForm" style="display:none;">
        <div class="review-form__stars" id="starRating">
            <span data-v="1">☆</span><span data-v="2">☆</span><span data-v="3">☆</span><span data-v="4">☆</span><span data-v="5">☆</span>
        </div>
        <input type="hidden" id="reviewRating" value="0">
        <input type="hidden" id="reviewStoreId" th:value="${store?.storeId}">
        <input type="hidden" id="reviewOrderId" value="">
        <textarea class="review-form__textarea" id="reviewComment" rows="2" placeholder="Chia sẻ trải nghiệm của bạn..."></textarea>
        <button class="review-form__submit" onclick="submitReview()">Gửi đánh giá</button>
    </div>

    <!-- Reviews list -->
    <div class="review-list" id="reviewList">
        <div style="text-align:center;padding:16px;color:var(--text-tertiary);font-size:13px;">Đang tải đánh giá...</div>
    </div>
</div>

<style>
.review-section { padding: 16px 20px 100px; background: var(--surface); margin-top: 12px; }
.review-section__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.review-section__header h3 { font-size: 16px; font-weight: 700; }
.review-section__avg { font-size: 14px; font-weight: 600; color: var(--accent); }
.review-form { margin-bottom: 16px; padding: 14px; background: var(--background); border-radius: 12px; }
.review-form__stars { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.review-form__stars span { font-size: 28px; cursor: pointer; color: #d1d5db; transition: color .12s; }
.review-form__stars span.active { color: #f59e0b; }
.review-form__textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; }
.review-form__submit { width: 100%; margin-top: 8px; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.review-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
.review-item:last-child { border-bottom: none; }
.review-item__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.review-item__user { font-size: 13px; font-weight: 600; }
.review-item__stars { color: #f59e0b; font-size: 12px; }
.review-item__comment { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.review-item__time { font-size: 10px; color: var(--text-tertiary); margin-top: 4px; }
</style>

<script>
// Star rating
document.querySelectorAll('#starRating span').forEach(function(s) {
    s.addEventListener('click', function() {
        var v = parseInt(this.dataset.v);
        document.getElementById('reviewRating').value = v;
        document.querySelectorAll('#starRating span').forEach(function(ss, i) {
            ss.textContent = i < v ? '★' : '☆';
            ss.classList.toggle('active', i < v);
        });
    });
});

// Load reviews
function loadReviews() {
    fetch('/api/reviews/store/' + (document.getElementById('reviewStoreId').value || ''))
    .then(function(r) { return r.json(); })
    .then(function(d) {
        var list = document.getElementById('reviewList');
        var reviews = d.reviews || [];
        if (!reviews.length) {
            list.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text-tertiary);font-size:13px;">Chưa có đánh giá nào</div>';
        } else {
            var html = '';
            for (var i = 0; i < reviews.length; i++) {
                var r = reviews[i];
                var stars = '';
                for (var s = 0; s < 5; s++) stars += s < (r.rating||0) ? '★' : '☆';
                html += '<div class="review-item">' +
                    '<div class="review-item__header">' +
                        '<span class="review-item__user">' + escH(r.userName || 'Người dùng') + (r.verified ? ' ✅' : '') + '</span>' +
                        '<span class="review-item__stars">' + stars + '</span>' +
                    '</div>' +
                    (r.comment ? '<div class="review-item__comment">' + escH(r.comment) + '</div>' : '') +
                    '<div class="review-item__time">' + (r.createdAt || '') + '</div>' +
                '</div>';
            }
            list.innerHTML = html;
        }
        // Avg
        if (d.avgRating) {
            document.getElementById('reviewAvg').textContent = '⭐ ' + d.avgRating.toFixed(1) + ' (' + (d.totalReviews||0) + ')';
        }
    });
}
function escH(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function submitReview() {
    var rating = parseInt(document.getElementById('reviewRating').value) || 0;
    if (rating < 1) { alert('Vui lòng chọn số sao'); return; }
    var fd = new URLSearchParams();
    fd.append('storeId', document.getElementById('reviewStoreId').value);
    fd.append('rating', rating);
    fd.append('comment', document.getElementById('reviewComment').value);
    var oid = document.getElementById('reviewOrderId').value;
    if (oid) fd.append('orderId', oid);
    fetch('/api/review/create', { method: 'POST', body: fd })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.success) { alert(d.message); loadReviews(); document.getElementById('reviewComment').value = ''; }
        else alert(d.message);
    });
}

// Show review form if ?review=1
(function() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('review') === '1') {
        document.getElementById('reviewForm').style.display = 'block';
        document.getElementById('reviewOrderId').value = params.get('orderId') || '';
    }
    loadReviews();
})();
</script>

<!-- Footer -->
<div th:replace="~{common/buyer/footer :: footer}"></div>

<div th:replace="~{common/buyer/mobile-nav :: mobileNav}"></div>
<div th:replace="~{common/buyer/js :: js}"></div>
</body>
</html>
