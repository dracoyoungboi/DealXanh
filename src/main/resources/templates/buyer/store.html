<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${store.storeName + ' — DealXanh'}">Cửa hàng — DealXanh</title>
    <div th:replace="~{common/admin/css :: css}"></div>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root{--primary:#0d5c2e;--primary-dark:#08421f;--surface:#fff;--bg:#f5f6f8;--text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;--border:#e0e0e0;--border-light:#f0f0f0;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-full:9999px;--font:'Inter',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:auto;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);padding-bottom:80px}

/* Cover */
.cover{width:100%;height:180px;object-fit:cover;background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
.cover-placeholder{width:100%;height:180px;background:linear-gradient(135deg,var(--primary),#1a6b3c);display:flex;align-items:center;justify-content:center}

/* Store header */
.store-header{background:var(--surface);padding:0 20px 16px;margin-top:-40px;position:relative;z-index:5;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.store-logo-wrap{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.store-logo{width:72px;height:72px;border-radius:var(--radius-md);object-fit:cover;border:3px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.12);margin-top:-36px;background:var(--surface)}
.store-logo-ph{width:72px;height:72px;border-radius:var(--radius-md);background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;font-weight:700;border:3px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.12);margin-top:-36px}
.store-name{font-size:20px;font-weight:800;margin-top:4px}
.store-meta{font-size:12px;color:var(--text-secondary);margin-top:2px}
.store-rating{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-top:4px}
.store-rating .star{color:#f59e0b}

.tier-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:700;color:#fff;margin-left:8px}
.tier-DIAMOND{background:linear-gradient(135deg,#667eea,#764ba2)}
.tier-GOLD{background:linear-gradient(135deg,#d4af37,#b8932a)}
.tier-SILVER{background:linear-gradient(135deg,#a8b8c8,#7a8a9a)}
.tier-BRONZE{background:linear-gradient(135deg,#cd7f32,#a0522d)}

/* Info chips */
.info-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.info-chip{font-size:10px;padding:4px 10px;background:var(--bg);border-radius:var(--radius-full);display:flex;align-items:center;gap:3px;color:var(--text-secondary)}
.info-chip svg{width:12px;height:12px}

/* Section */
.section{padding:16px 20px}
.section-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title svg{width:18px;height:18px;color:var(--primary)}

/* Categories */
.cat-list{display:flex;flex-wrap:wrap;gap:8px}
.cat-tag{padding:6px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-full);font-size:12px;font-weight:500}

/* Products */
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.prod-card{background:var(--surface);border-radius:var(--radius-md);padding:12px;border:1px solid var(--border-light)}
.prod-img{width:100%;height:120px;object-fit:cover;border-radius:var(--radius-sm);background:var(--bg);margin-bottom:8px}
.prod-name{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.3}
.prod-price{font-size:14px;font-weight:800;color:var(--primary)}
.prod-status{font-size:10px;color:var(--text-tertiary);margin-top:2px}

/* Deals */
.deal-scroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.deal-scroll::-webkit-scrollbar{display:none}
.deal-card{min-width:240px;background:var(--surface);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border-light);flex-shrink:0}
.deal-type{font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--radius-full);margin-bottom:8px;display:inline-block}
.deal-type.FLASH_SALE{background:#fef2f2;color:#dc2626}
.deal-type.VOUCHER{background:#eff6ff;color:#2563eb}
.deal-type.COMBO{background:#f0fdf4;color:#16a34a}
.deal-type.SEASONAL{background:#fffbeb;color:#d97706}
.deal-name{font-size:14px;font-weight:700;margin-bottom:4px}
.deal-discount{font-size:18px;font-weight:800;color:var(--danger)}
.deal-time{font-size:10px;color:var(--text-tertiary);margin-top:4px}

/* Description */
.desc-text{font-size:13px;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap}

/* Back button */
.back-bar{padding:12px 20px;display:flex;align-items:center;gap:8px}
.back-bar a{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none}
.back-bar svg{width:18px;height:18px}

/* Empty */
.empty{text-align:center;padding:30px;color:var(--text-tertiary);font-size:12px}
    </style>
</head>
<body>

<!-- Cover -->
<img th:if="${store.coverImageUrl != null}" th:src="${store.coverImageUrl}" class="cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
<div class="cover-placeholder" th:if="${store.coverImageUrl == null}" style="display:flex;"></div>

<!-- Back -->
<div class="back-bar">
    <a href="/home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Khám phá
    </a>
</div>

<!-- Store Header -->
<div class="store-header">
    <div class="store-logo-wrap">
        <img th:if="${store.logoUrl != null}" th:src="${store.logoUrl}" class="store-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="store-logo-ph" th:if="${store.logoUrl == null}" th:text="${store.storeName.charAt(0)}">S</div>
        <div>
            <div class="store-name" th:text="${store.storeName}">Store</div>
            <div class="store-meta" th:text="${store.businessType != null ? store.businessType : 'Cửa hàng'}">Type</div>
        </div>
    </div>
    <div class="store-rating">
        ⭐ <span th:text="${#numbers.formatDecimal(store.averageRating, 0, 1)}">4.5</span>
        <span style="color:var(--text-tertiary);" th:text="'(' + ${store.totalReviews} + ' đánh giá)'">(0)</span>
        <span th:class="'tier-badge tier-' + ${store.partnerTier}" th:text="${store.partnerTierLabel}">Đồng</span>
    </div>
    <div class="info-chips">
        <span class="info-chip" th:if="${store.address != null}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span th:text="${store.address + (store.district != null ? ', ' + store.district : '') + (store.city != null ? ', ' + store.city : '')}">Address</span>
        </span>
        <span class="info-chip" th:if="${store.openTime != null}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span th:text="${store.openTime + ' - ' + store.closeTime}">Hours</span>
        </span>
        <span class="info-chip" th:if="${store.phone != null}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
            <span th:text="${store.phone}">Phone</span>
        </span>
    </div>
</div>

<!-- Description -->
<div class="section" data-section="description" th:if="${store.description != null and !store.description.isEmpty()}">
    <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Về chúng tôi
    </div>
    <div class="desc-text" th:text="${store.description}">Description</div>
</div>

<!-- Categories -->
<div class="section" data-section="categories" th:if="${store.categories != null and !store.categories.isEmpty()}">
    <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Danh mục sản phẩm
    </div>
    <div class="cat-list">
        <span class="cat-tag" th:each="cat : ${#strings.arraySplit(store.categories, ',')}" th:text="${cat.trim()}">Category</span>
    </div>
</div>

<!-- Active Deals -->
<div class="section" data-section="deals" th:if="${activeDeals != null and !activeDeals.isEmpty()}">
    <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        Deal đang chạy
    </div>
    <div class="deal-scroll">
        <div class="deal-card" th:each="deal : ${activeDeals}">
            <span class="deal-type" th:classappend="${deal.dealType}" th:text="${deal.dealType == 'FLASH_SALE' ? '⚡ Flash Sale' : deal.dealType == 'VOUCHER' ? '🎫 Voucher' : deal.dealType == 'COMBO' ? '🎁 Combo' : '🌸 Seasonal'}">Type</span>
            <div class="deal-name" th:text="${deal.dealName}">Deal</div>
            <div class="deal-discount" th:text="${deal.discountType == 'PERCENT' ? deal.discountValue + '%' : #numbers.formatDecimal(deal.discountValue, 0, 0) + 'đ'}">Discount</div>
            <div class="deal-time" th:text="'Đến ' + #temporals.format(deal.endTime, 'dd/MM')">Time</div>
        </div>
    </div>
</div>
<div class="section" th:unless="${activeDeals != null and !activeDeals.isEmpty()}">
    <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        Deal đang chạy
    </div>
    <div class="empty">Hiện chưa có deal nào đang chạy</div>
</div>

<!-- Products -->
<div class="section" data-section="products">
    <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>
        Sản phẩm
    </div>
    <div class="prod-grid" th:if="${products != null and !products.isEmpty()}">
        <div class="prod-card" th:each="p : ${products}">
            <img th:src="${p.imageUrl != null ? p.imageUrl : '/img/default-product.svg'}" class="prod-img" onerror="this.src='/img/default-product.svg'">
            <div class="prod-name" th:text="${p.name}">Product</div>
            <div class="prod-price" th:text="${#numbers.formatDecimal(p.originalPrice, 0, 0) + 'đ'}">0đ</div>
            <div class="prod-status" th:text="${p.active ? '✅ Đang bán' : '⏸ Ngừng bán'}">Status</div>
        </div>
    </div>
    <div class="empty" th:unless="${products != null and !products.isEmpty()}">Cửa hàng chưa có sản phẩm nào</div>
</div>

<script>
// Apply store page config (section toggles + order from seller store-page builder)
(function() {
    var config = /*[[${store.storePageConfig != null ? store.storePageConfig : ''}]]*/ '';
    if (!config) return;
    var parts = config.split('||');
    var toggles = {};
    var order = '';
    try { toggles = JSON.parse(parts[0] || '{}'); } catch(e) {}
    order = parts[1] || '';

    // Apply section visibility based on toggles (use data-section attributes)
    document.querySelectorAll('.section[data-section]').forEach(function(sec) {
        var name = sec.dataset.section;
        if (name && toggles[name] === false) {
            sec.style.display = 'none';
        }
    });

    // Apply section order if specified
    if (order) {
        var orderList = order.split(',');
        var container = document.querySelector('.store-header') ? document.querySelector('.store-header').parentNode : null;
        if (!container) return;
        var sectionsByKey = {};
        document.querySelectorAll('.section[data-section]').forEach(function(sec) {
            sectionsByKey[sec.dataset.section] = sec;
        });
        var allSections = document.querySelectorAll('.section[data-section]');
        var orderedSections = [];
        orderList.forEach(function(sectionName) {
            if (sectionsByKey[sectionName]) {
                orderedSections.push(sectionsByKey[sectionName]);
            }
        });
        // Append remaining sections not in order
        allSections.forEach(function(sec) {
            if (orderedSections.indexOf(sec) === -1) {
                orderedSections.push(sec);
            }
        });
        var storeHeader = document.querySelector('.store-header');
        var anchor = storeHeader ? storeHeader.nextSibling : null;
        orderedSections.forEach(function(sec) {
            if (anchor) {
                container.insertBefore(sec, anchor);
            } else {
                container.appendChild(sec);
            }
        });
    }
})();
</script>

</body>
</html>
