<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xac nhan don hang — DealXanh</title>
    <meta name="description" content="Xac nhan don hang DealXanh">

    <div th:replace="~{common/buyer/css :: css}"></div>
    <link rel="stylesheet" th:href="@{/css/pages/home.css}">

    <style>
html{height:auto;min-height:100%}
body{padding-bottom:120px;background:var(--background)}

.back-bar{padding:12px 16px;display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.back-bar a{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none}
.back-bar svg{width:18px;height:18px}
.back-bar__title{flex:1;font-size:17px;font-weight:700;text-align:center;margin-right:38px}

/* ===== STEPPER ===== */
.stepper{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 12px;position:relative;background:var(--surface);border-bottom:1px solid var(--border-light)}
.stepper__line{position:absolute;top:28px;left:calc(12% + 16px);right:calc(12% + 16px);height:2px;background:var(--border);z-index:0}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;flex:0 0 auto;min-width:56px}
.step__circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--border);color:var(--text-tertiary);transition:all .25s}
.step__circle--done{background:var(--primary);color:#fff}
.step__circle--done::after{content:'\2713';font-size:14px}
.step__circle--active{background:var(--surface);border:2px solid var(--primary);color:var(--primary);box-shadow:0 0 0 4px rgba(13,92,46,.1)}
.step__label{font-size:10px;font-weight:600;color:var(--text-tertiary);text-align:center;white-space:nowrap}
.step--active .step__label{color:var(--primary)}
.step--done .step__label{color:var(--primary)}

/* ===== ORDER BODY ===== */
.order-body{padding:12px 16px 140px;display:flex;flex-direction:column;gap:12px}

/* Store group card */
.store-group{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.store-group__header{padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-light);background:var(--background)}
.store-group__header img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--surface);flex-shrink:0}
.store-group__header .sg-name{font-size:13px;font-weight:700;flex:1}
.store-group__header .sg-addr{font-size:10px;color:var(--text-secondary);display:flex;align-items:center;gap:2px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.store-group__header .sg-addr svg{width:11px;height:11px;flex-shrink:0}

/* Item row */
.os-item{display:flex;gap:10px;align-items:center;padding:12px 16px}
.os-item+.os-item{border-top:1px solid var(--border-light)}
.os-item__img{width:52px;height:52px;border-radius:var(--radius-md);object-fit:cover;flex-shrink:0;background:var(--background)}
.os-item__info{flex:1;min-width:0}
.os-item__name{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.os-item__meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.os-item__qty{display:inline-flex;align-items:center;background:var(--background);padding:2px 8px;border-radius:var(--radius-full);font-size:11px;font-weight:600;color:var(--text-secondary)}
.os-item__pickup{font-size:11px;color:var(--text-tertiary);display:flex;align-items:center;gap:3px}
.os-item__pickup svg{width:11px;height:11px}
.os-item__price{text-align:right;flex-shrink:0}
.os-item__sale{font-size:15px;font-weight:700;color:var(--primary);display:block}
.os-item__original{font-size:10px;color:var(--text-tertiary);text-decoration:line-through;display:block;margin-top:1px}

/* Store notes */
.store-group__notes{padding:8px 16px 14px;border-top:1px solid var(--border-light)}
.os-notes{width:100%;border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;font-size:12px;font-family:var(--font-family);resize:none;background:var(--background);color:var(--text-primary);box-sizing:border-box;outline:none;transition:border-color .2s}
.os-notes:focus{border-color:var(--primary)}

/* Price breakdown card */
.price-card{background:var(--surface);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.price-card__title{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text-primary)}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;color:var(--text-secondary)}
.price-row--strike{color:var(--text-tertiary)}
.price-row--strike .price-row__val{text-decoration:line-through}
.price-row--discount{color:var(--status-success);font-weight:600}
.price-row--divider{border-top:1px dashed var(--border);margin-top:8px;padding-top:12px}
.price-row--total{font-size:16px;font-weight:800;color:var(--primary)}
.price-row--total .price-row__val{font-size:20px}

/* ===== STICKY BOTTOM ===== */
.sticky-bottom{position:fixed;bottom:60px;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 16px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.sticky-bottom__left{display:flex;flex-direction:column}
.sticky-bottom__label{font-size:11px;color:var(--text-secondary)}
.sticky-bottom__total{font-size:20px;font-weight:800;color:var(--primary)}
.btn-submit{padding:12px 24px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-family);white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-submit:hover{background:var(--primary-dark)}
.btn-submit:active{transform:scale(.97)}
.btn-submit svg{width:16px;height:16px}

/* Empty / error */
.os-empty{text-align:center;padding:60px 24px;color:var(--text-secondary);font-size:14px}
.os-empty p{margin-bottom:12px}
.os-empty a{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--primary);color:#fff;border-radius:var(--radius-md);font-size:13px;font-weight:600;text-decoration:none}
    </style>
</head>
<body>

<!-- Header: Back + Title -->
<div class="back-bar">
    <a href="javascript:history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Quay lai
    </a>
    <span class="back-bar__title">Xac nhan don hang</span>
</div>

<!-- Stepper: Step 2 active -->
<div class="stepper">
    <div class="stepper__line"></div>
    <div class="step step--done">
        <div class="step__circle step__circle--done"></div>
        <div class="step__label">Gio hang</div>
    </div>
    <div class="step step--active">
        <div class="step__circle step__circle--active">2</div>
        <div class="step__label">Xac nhan</div>
    </div>
    <div class="step">
        <div class="step__circle">3</div>
        <div class="step__label">Thanh toan</div>
    </div>
    <div class="step">
        <div class="step__circle">4</div>
        <div class="step__label">Hoan tat</div>
    </div>
</div>

<!-- Order body -->
<div class="order-body">

    <!-- Empty state -->
    <th:block th:if="${storeGroups == null or storeGroups.isEmpty()}">
        <div class="os-empty">
            <p>Khong co san pham nao trong don hang.</p>
            <a href="/">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                San deal ngay
            </a>
        </div>
    </th:block>

    <!-- Items grouped by store -->
    <th:block th:if="${storeGroups != null and !storeGroups.isEmpty()}">
        <th:block th:each="entry : ${storeGroups}">
            <th:block th:with="storeId=${entry.key}, items=${entry.value}, store=${storeInfo != null ? storeInfo[entry.key] : null}">
                <div class="store-group">
                    <!-- Store header -->
                    <div class="store-group__header">
                        <img th:src="${store != null and store.logoUrl != null ? store.logoUrl : '/img/default-avatar.svg'}" alt="" onerror="this.style.display='none'">
                        <span class="sg-name" th:text="${store != null ? store.storeName : 'Cua hang'}">Cua hang</span>
                        <span class="sg-addr" th:if="${store != null and store.address != null}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            <span th:text="${store.address}">Address</span>
                        </span>
                    </div>

                    <!-- Items -->
                    <th:block th:each="item : ${items}">
                        <div class="os-item">
                            <img class="os-item__img" th:src="${item.imageUrl != null ? item.imageUrl : '/img/default-banner.svg'}" th:alt="${item.productName}" onerror="this.src='/img/default-banner.svg'">
                            <div class="os-item__info">
                                <div class="os-item__name" th:text="${item.productName}">Product Name</div>
                                <div class="os-item__meta">
                                    <span class="os-item__qty" th:text="|x${item.quantity != null ? item.quantity : 1}|">x1</span>
                                    <span class="os-item__pickup">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                        Nhan tai cua hang
                                    </span>
                                </div>
                            </div>
                            <div class="os-item__price">
                                <span class="os-item__sale" th:text="|${#numbers.formatDecimal(item.salePrice != null ? item.salePrice : 0, 0, 0)}d|">50,000d</span>
                                <span class="os-item__original" th:if="${item.originalPrice != null and item.originalPrice > item.salePrice}" th:text="|${#numbers.formatDecimal(item.originalPrice, 0, 0)}d|">100,000d</span>
                            </div>
                        </div>
                    </th:block>

                    <!-- Store notes -->
                    <div class="store-group__notes">
                        <textarea class="os-notes" rows="2" th:attr="placeholder=${store != null ? 'Ghi chu cho ' + store.storeName + ' (khong bat buoc)...' : 'Ghi chu (khong bat buoc)...'}"></textarea>
                    </div>
                </div>
            </th:block>
        </th:block>
    </th:block>

    <!-- Price breakdown -->
    <div class="price-card" th:if="${storeGroups != null and !storeGroups.isEmpty()}">
        <div class="price-card__title">Chi tiet thanh toan</div>
        <div class="price-row price-row--strike">
            <span>Tong gia goc</span>
            <span class="price-row__val" th:text="|${#numbers.formatDecimal(subtotal + totalDiscount, 0, 0)}d|">0d</span>
        </div>
        <div class="price-row price-row--discount" th:if="${totalDiscount > 0}">
            <span>Giam gia Deal</span>
            <span class="price-row__val" th:text="|-${#numbers.formatDecimal(totalDiscount, 0, 0)}d|">-0d</span>
        </div>
        <div class="price-row price-row--divider price-row--total">
            <span>Tong thanh toan</span>
            <span class="price-row__val" th:text="|${#numbers.formatDecimal(total, 0, 0)}d|">0d</span>
        </div>
    </div>

</div>

<!-- Sticky bottom bar -->
<div class="sticky-bottom" th:if="${storeGroups != null and !storeGroups.isEmpty()}">
    <div class="sticky-bottom__left">
        <span class="sticky-bottom__label" th:text="|${itemCount} san pham|">0 san pham</span>
        <span class="sticky-bottom__total" th:text="|${#numbers.formatDecimal(total, 0, 0)}d|">0d</span>
    </div>
    <form th:action="@{/buyer/payment}" method="get" style="margin:0">
        <button type="submit" class="btn-submit">
            Chon phuong thuc thanh toan
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
    </form>
</div>

<div th:replace="~{common/buyer/mobile-nav :: mobileNav}"></div>
<div th:replace="~{common/buyer/js :: js}"></div>

</body>
</html>
