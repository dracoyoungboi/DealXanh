<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  common/buyer/search-overlay.html
  Shopee-style search overlay with live suggestions dropdown
-->
<body th:fragment="searchOverlay">
<div id="search-overlay" class="search-overlay" style="display:none;" aria-hidden="true">
    <div class="search-overlay__container">
        <div class="search-overlay__input-wrapper">
            <svg class="search-overlay__icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" class="search-overlay__input" placeholder="Tìm kiếm món ăn, quán ăn..." aria-label="Tìm kiếm" oninput="onSearchInput(this.value)" onkeydown="onSearchKeydown(event)" autocomplete="off">
            <button id="search-close" class="search-overlay__close" aria-label="Đóng tìm kiếm" onclick="closeSearch()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Suggestions dropdown -->
        <div class="search-overlay__suggestions" id="search-suggestions">
            <div class="search-overlay__title" id="suggest-title">Tìm kiếm phổ biến</div>
            <div class="search-suggestions" id="suggest-list">
                <button class="search-suggestion__chip" onclick="doSearch('Bánh mì')">Bánh mì</button>
                <button class="search-suggestion__chip" onclick="doSearch('Cà phê')">Cà phê</button>
                <button class="search-suggestion__chip" onclick="doSearch('Bún phở')">Bún phở</button>
                <button class="search-suggestion__chip" onclick="doSearch('Trà sữa')">Trà sữa</button>
                <button class="search-suggestion__chip" onclick="doSearch('Cơm')">Cơm</button>
                <button class="search-suggestion__chip" onclick="doSearch('Bánh ngọt')">Bánh ngọt</button>
            </div>
        </div>

        <!-- Loading -->
        <div class="search-overlay__loading" id="search-loading" style="display:none">
            <div style="text-align:center;padding:30px;color:var(--text-tertiary);font-size:13px">Đang tìm...</div>
        </div>

        <!-- No results -->
        <div class="search-overlay__no-results" id="search-no-results" style="display:none">
            <div style="text-align:center;padding:30px;color:var(--text-tertiary)">
                <p style="font-size:13px;margin-bottom:8px">Không tìm thấy sản phẩm phù hợp</p>
                <button class="search-suggestion__chip" id="search-anyway-btn" style="margin-top:8px" onclick="performSearchNow()">Tìm kiếm trên toàn hệ thống</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
