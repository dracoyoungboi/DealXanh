<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  common/buyer/account-dropdown-menu.html
  Shared account dropdown menu items for both desktop and mobile.
  Desktop: used inside .desktop-top-nav__account-dropdown
  Mobile:  used inside .dx-popup

  Keep in sync: edit here, both sides update.
  3 items only: Tài khoản của tôi, Đơn hàng của tôi, Đăng xuất
-->
<body>
<th:block th:fragment="accountMenuItems">
    <a href="/buyer/profile" class="account-dropdown-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Tài khoản của tôi</span>
    </a>
    <a href="/buyer/orders" class="account-dropdown-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>Đơn hàng của tôi</span>
    </a>
    <div class="account-dropdown-divider"></div>
    <a href="/logout" class="account-dropdown-item account-dropdown-item--danger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Đăng xuất</span>
    </a>
</th:block>
</body>
</html>
