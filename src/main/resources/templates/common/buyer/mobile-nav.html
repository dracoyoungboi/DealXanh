<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  common/buyer/mobile-nav.html
-->
<body th:fragment="mobileNav">
<nav class="mobile-nav" id="mobile-nav">
    <ul class="mobile-nav__list">
        <li>
            <a th:href="@{/}" class="mobile-nav__link" th:classappend="${activeNav == 'home'} ? ' mobile-nav__link--active' : ''">
                <svg class="mobile-nav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Trang chủ</span>
            </a>
        </li>
        <li>
            <a th:href="@{/buyer/deal-map}" class="mobile-nav__link" th:classappend="${activeNav == 'map'} ? ' mobile-nav__link--active' : ''">
                <svg class="mobile-nav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                    <line x1="8" y1="2" x2="8" y2="18"></line>
                    <line x1="16" y1="6" x2="16" y2="22"></line>
                </svg>
                <span>Bản đồ</span>
            </a>
        </li>
        <li>
            <a th:href="@{/buyer/cart}" class="mobile-nav__link" id="mobile-cart-btn" th:classappend="${activeNav == 'cart'} ? ' mobile-nav__link--active' : ''" style="position:relative">
                <svg class="mobile-nav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span>Giỏ hàng</span>
                <span id="mobile-nav-cart-badge" class="mobile-nav__cart__badge" th:if="${cartItemCount != null and cartItemCount > 0}" th:text="${cartItemCount}">0</span>
            </a>
        </li>
        <li>
            <a th:href="@{/buyer/orders}" class="mobile-nav__link" th:classappend="${activeNav == 'orders'} ? ' mobile-nav__link--active' : ''">
                <svg class="mobile-nav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <span>Đơn hàng</span>
            </a>
        </li>
        <li>
             <a href="#" onclick="handleAccountClick(event)" class="mobile-nav__link" th:classappend="${activeNav == 'account'} ? ' mobile-nav__link--active' : ''">
                <svg class="mobile-nav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Tài khoản</span>
            </a>
        </li>
    </ul>
</nav>
<!-- Mobile Mini-Cart Popup (triggered by long-press on cart button) -->
<div class="mobile-mini-cart-overlay" id="mobile-mini-cart-overlay" style="display:none" onclick="closeMobileMiniCart()"></div>
<div class="mobile-mini-cart" id="mobile-mini-cart" style="display:none">
    <div class="mobile-mini-cart-header">
        <span class="mobile-mini-cart-title">Giỏ hàng</span>
        <span class="mobile-mini-cart-count" id="mobile-mini-cart-count">0</span>
        <button class="mobile-mini-cart-close" onclick="closeMobileMiniCart()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="mobile-mini-cart-list" id="mobile-mini-cart-list">
        <div class="mobile-mini-cart-loading">Đang tải...</div>
    </div>
    <div class="mobile-mini-cart-footer">
        <div class="mobile-mini-cart-summary" id="mobile-mini-cart-summary" style="display:none">
            <div class="mobile-mini-cart-subtotal-row">
                <span>Tạm tính:</span>
                <span class="mobile-mini-cart-subtotal" id="mobile-mini-cart-subtotal">0đ</span>
            </div>
            <div class="mobile-mini-cart-discount-row" id="mobile-mini-cart-discount-row" style="display:none">
                <span>Giảm giá:</span>
                <span class="mobile-mini-cart-discount" id="mobile-mini-cart-discount">-0đ</span>
            </div>
        </div>
        <!-- Mini voucher row (inline, like cart page) -->
        <div class="mobile-mini-cart-voucher" id="mobile-mini-cart-voucher">
            <div class="mobile-mini-cart-voucher-applied" id="mobile-mini-cart-voucher-applied" style="display:none;">
                <span class="mobile-mini-cart-voucher-code" id="mobile-mini-cart-voucher-code"></span>
                <button class="mobile-mini-cart-voucher-remove" onclick="event.stopPropagation();window._mobileMiniCartRemoveVoucher()">✕</button>
            </div>
            <button class="mobile-mini-cart-voucher-btn" id="mobile-mini-cart-voucher-btn" onclick="event.stopPropagation();window._mobileMiniCartToggleVoucherList()">🎫 Chọn mã giảm giá</button>
            <div class="mobile-mini-cart-voucher-list" id="mobile-mini-cart-voucher-list" style="display:none;"></div>
        </div>
        <a th:href="@{/buyer/checkout}" class="mobile-mini-cart-checkout-btn" onclick="closeMobileMiniCart()">Thanh toán ngay</a>
        <a th:href="@{/buyer/cart}" class="mobile-mini-cart-view-btn" onclick="closeMobileMiniCart()">Xem giỏ hàng</a>
    </div>
</div>

<style>
/* ===== MOBILE MINI-CART POPUP ===== */
.mobile-mini-cart-overlay {
    position: fixed; inset: 0; z-index: 900;
    background: rgba(0,0,0,.45);
    animation: overlayFadeIn .2s ease-out;
}
@keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }

.mobile-mini-cart {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 901;
    background: var(--surface, #fff);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 28px rgba(0,0,0,.18);
    max-height: 60vh;
    padding-bottom: env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
    animation: mobileMiniCartUp .25s cubic-bezier(.4,0,.2,1);
}
@keyframes mobileMiniCartUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.mobile-mini-cart-header {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border, #e0e0e0);
    flex-shrink: 0;
}
.mobile-mini-cart-title {
    font-size: 15px; font-weight: 700; color: var(--text-primary, #1a1a1a);
}
.mobile-mini-cart-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 20px; padding: 0 6px;
    background: var(--danger, #ef4444); color: #fff;
    border-radius: 9999px; font-size: 11px; font-weight: 700;
}
.mobile-mini-cart-close {
    margin-left: auto; width: 32px; height: 32px;
    border-radius: 50%; background: var(--background, #f5f6f8);
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; color: var(--text-secondary, #666);
}

.mobile-mini-cart-list {
    overflow-y: auto; flex: 1;
    max-height: 360px;
    scrollbar-width: thin;
}
.mobile-mini-cart-list::-webkit-scrollbar { width: 3px; }
.mobile-mini-cart-list::-webkit-scrollbar-thumb { background: var(--border, #e0e0e0); border-radius: 3px; }

.mobile-mini-cart-item {
    display: flex; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border, #e0e0e0);
    align-items: center;
}
.mobile-mini-cart-item:last-child { border-bottom: none; }
.mobile-mini-cart-item--unavailable { opacity: .45; pointer-events: none; }

.mobile-mini-cart-item-img {
    width: 48px; height: 48px; border-radius: 8px;
    object-fit: cover; flex-shrink: 0;
    background: var(--background, #f5f6f8);
}
.mobile-mini-cart-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.mobile-mini-cart-item-name {
    font-size: 13px; font-weight: 500; color: var(--text-primary, #1a1a1a);
    line-height: 1.3; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.mobile-mini-cart-item-bottom { display: flex; align-items: center; justify-content: space-between; }
.mobile-mini-cart-item-price { font-size: 14px; font-weight: 700; color: var(--primary, #0d5c2e); }

/* Qty controls */
.mobile-mini-cart-item-qty-wrap {
    display: flex; align-items: center; gap: 2px;
    background: var(--background, #f5f6f8);
    border-radius: 9999px; padding: 3px;
}
.mobile-mini-cart-qty-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: var(--surface, #fff);
    color: var(--text-primary, #1a1a1a);
    font-size: 16px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
}
.mobile-mini-cart-qty-btn:disabled { opacity: .3; }
.mobile-mini-cart-qty-num {
    min-width: 22px; text-align: center;
    font-size: 13px; font-weight: 600;
    color: var(--text-primary, #1a1a1a);
}
.mobile-mini-cart-item-del {
    width: 26px; height: 26px; border-radius: 50%;
    border: none; background: none;
    color: var(--text-tertiary, #999);
    font-size: 14px; cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
}

.mobile-mini-cart-empty, .mobile-mini-cart-loading {
    text-align: center; padding: 40px 16px;
    color: var(--text-tertiary, #999); font-size: 13px;
}
.mobile-mini-cart-more {
    text-align: center; padding: 8px 16px;
    font-size: 12px; color: var(--text-tertiary, #999); font-weight: 500;
}

.mobile-mini-cart-footer {
    padding: 8px 16px 14px; border-top: 1px solid var(--border, #e0e0e0);
    flex-shrink: 0;
}
.mobile-mini-cart-summary {
    margin-bottom: 8px; padding: 6px 0;
}
.mobile-mini-cart-subtotal-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--text-secondary, #666);
}
.mobile-mini-cart-subtotal {
    font-size: 15px; font-weight: 700; color: var(--text-primary, #1a1a1a);
}
.mobile-mini-cart-discount-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--success, #10b981);
    margin-top: 3px;
}
.mobile-mini-cart-discount { font-weight: 600; color: var(--success, #10b981); }

.mobile-mini-cart-checkout-btn {
    display: block; width: 100%; padding: 12px 0;
    background: var(--primary, #0d5c2e); color: #fff;
    text-align: center; border-radius: 10px;
    font-size: 14px; font-weight: 600; text-decoration: none;
    margin-bottom: 6px;
}
.mobile-mini-cart-checkout-btn:active { background: #08421f; }

.mobile-mini-cart-view-btn {
    display: block; width: 100%; padding: 10px 0;
    background: none; color: var(--text-secondary, #666);
    text-align: center; border-radius: 10px;
    font-size: 13px; font-weight: 500; text-decoration: none;
    border: 1px solid var(--border, #e0e0e0);
}
.mobile-mini-cart-view-btn:active { background: var(--background, #f5f6f8); }

/* Mini voucher */
.mobile-mini-cart-voucher { margin-bottom: 6px; }
.mobile-mini-cart-voucher-btn {
    display: block; width: 100%; padding: 8px 0;
    background: rgba(212,175,55,.08); border: 1px dashed var(--accent, #d4af37);
    color: var(--accent, #d4af37); border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    text-align: center;
}
.mobile-mini-cart-voucher-applied {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; background: rgba(16,185,129,.08);
    border: 1px solid rgba(16,185,129,.2); border-radius: 10px;
}
.mobile-mini-cart-voucher-code { font-size: 12px; font-weight: 700; color: var(--success, #10b981); }
.mobile-mini-cart-voucher-remove {
    width: 22px; height: 22px; border-radius: 50%; border: none;
    background: rgba(239,68,68,.1); color: var(--danger, #ef4444);
    font-size: 11px; cursor: pointer; flex-shrink: 0;
}
/* Inline voucher list */
.mobile-mini-cart-voucher-list {
    max-height: 160px; overflow-y: auto;
    border: 1px solid var(--border, #e0e0e0);
    border-radius: 8px; margin-top: 4px;
}
.mobile-mini-cart-voucher-item {
    display: flex; flex-direction: column; gap: 1px;
    padding: 8px 10px; border-bottom: 1px solid var(--border, #e0e0e0);
    cursor: pointer;
}
.mobile-mini-cart-voucher-item:last-child { border-bottom: none; }
.mobile-mini-cart-voucher-item--disabled { opacity: .45; pointer-events: none; }
.mobile-mini-cart-voucher-item-code { font-size: 12px; font-weight: 700; color: var(--text-primary, #1a1a1a); }
.mobile-mini-cart-voucher-item-discount { font-size: 10px; font-weight: 600; color: #dc2626; }
.mobile-mini-cart-voucher-item-min { font-size: 10px; color: var(--text-tertiary, #999); }
</style>

<script>
// Define function globally to ensure it's available when onclick fires
window.handleAccountClick = function(event) {
    event.preventDefault();
    event.stopPropagation();

    console.log('=== ACCOUNT CLICK START ===');

    // Always try to go to profile first
    // Server will check authentication and redirect if needed
    console.log('Redirecting to /profile...');
    window.location.href = '/profile';
};

// ===== MOBILE MINI-CART — Long-Press on Cart Button =====
(function() {
    var cartBtn = document.getElementById('mobile-cart-btn');
    if (!cartBtn) return;

    var pressTimer = null;
    var isLongPress = false;
    var LONG_PRESS_MS = 500;

    function openMobileMiniCart() {
        var overlay = document.getElementById('mobile-mini-cart-overlay');
        var panel = document.getElementById('mobile-mini-cart');
        if (overlay) overlay.style.display = 'block';
        if (panel) panel.style.display = 'flex';
        fetchMobileMiniCart();
    }

    window.closeMobileMiniCart = function() {
        var overlay = document.getElementById('mobile-mini-cart-overlay');
        var panel = document.getElementById('mobile-mini-cart');
        if (overlay) overlay.style.display = 'none';
        if (panel) panel.style.display = 'none';
    };

    function fetchMobileMiniCart() {
        var list = document.getElementById('mobile-mini-cart-list');
        if (list) list.innerHTML = '<div class="mobile-mini-cart-loading">Đang tải...</div>';

        fetch('/api/cart')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            renderMobileMiniCart(data);
        })
        .catch(function() {
            if (list) list.innerHTML = '<div class="mobile-mini-cart-empty">Không thể tải giỏ hàng</div>';
        });
    }

    function renderMobileMiniCart(data) {
        window._mobileMiniCartData = data;
        var count = data.count || 0;
        var items = data.items || [];
        var countEl = document.getElementById('mobile-mini-cart-count');
        var listEl = document.getElementById('mobile-mini-cart-list');
        if (countEl) countEl.textContent = count;

        if (!listEl) return;

        var summaryEl = document.getElementById('mobile-mini-cart-summary');
        if (summaryEl) summaryEl.style.display = items.length > 0 ? 'block' : 'none';

        if (items.length === 0) {
            listEl.innerHTML = '<div class="mobile-mini-cart-empty">Không có đơn hàng nào</div>';
            updateMobileMiniCartSubtotal([]);
            return;
        }

        var html = '';
        for (var i = 0; i < Math.min(items.length, 5); i++) {
            var item = items[i];
            var pid = item.productId || 0;
            var imgSrc = item.productImage || '/img/default-banner.svg';
            var name = item.productName || '';
            var qty = item.quantity || 0;
            var salePrice = item.salePrice || 0;
            var maxStock = item.maxStock || 99;
            var unavailable = item.unavailable;
            var unavail = unavailable ? ' mobile-mini-cart-item--unavailable' : '';
            var qtyDisabled = unavailable ? ' disabled' : '';
            var plusDisabled = (qty >= maxStock || unavailable) ? ' disabled' : '';

            html += '<div class="mobile-mini-cart-item' + unavail + '">' +
                '<img class="mobile-mini-cart-item-img" src="' + escapeHtml(imgSrc) + '" alt="" loading="lazy" onerror="this.src=\'/img/default-banner.svg\'">' +
                '<div class="mobile-mini-cart-item-info">' +
                    '<div class="mobile-mini-cart-item-name">' + escapeHtml(name) + '</div>' +
                    '<div class="mobile-mini-cart-item-bottom">' +
                        '<span class="mobile-mini-cart-item-price">' + salePrice.toLocaleString('vi-VN') + 'đ</span>' +
                        '<div class="mobile-mini-cart-item-qty-wrap">' +
                            '<button class="mobile-mini-cart-qty-btn" onclick="event.stopPropagation();window._mobileMiniCartUpdate(' + pid + ', ' + (qty - 1) + ')"' + qtyDisabled + '>−</button>' +
                            '<span class="mobile-mini-cart-qty-num">' + qty + '</span>' +
                            '<button class="mobile-mini-cart-qty-btn" onclick="event.stopPropagation();window._mobileMiniCartUpdate(' + pid + ', ' + (qty + 1) + ')"' + plusDisabled + '>+</button>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<button class="mobile-mini-cart-item-del" onclick="event.stopPropagation();window._mobileMiniCartRemove(' + pid + ')" title="Xóa">✕</button>' +
            '</div>';
        }
        if (items.length > 5) {
            html += '<div class="mobile-mini-cart-more">+ ' + (items.length - 5) + ' sản phẩm khác</div>';
        }
        listEl.innerHTML = html;
        updateMobileMiniCartSubtotal(items);
    }

    function updateMobileMiniCartSubtotal(items) {
        var subtotalEl = document.getElementById('mobile-mini-cart-subtotal');
        var discountRowEl = document.getElementById('mobile-mini-cart-discount-row');
        var discountEl = document.getElementById('mobile-mini-cart-discount');
        if (!subtotalEl) return;

        var tp = 0, to = 0;
        var fixedDealIds = {}, fixedDealDiscount = 0;
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            if (item.unavailable) continue;
            var qty = item.quantity || 0;
            var sale = item.salePrice || 0;
            var orig = item.originalPrice || 0;
            tp += sale * qty;
            to += orig * qty;
            if (item.discountType === 'FIXED' && item.dealId > 0 && !fixedDealIds[item.dealId]) {
                fixedDealDiscount += (item.discountValue || 0);
                fixedDealIds[item.dealId] = true;
            }
        }
        var dd = to - tp;
        var vd = window._mobileMiniCartSelectedVoucher ? (window._mobileMiniCartSelectedVoucher.voucherDiscount || 0) : 0;
        var total = tp - fixedDealDiscount - vd;
        if (total < 0) total = 0;

        subtotalEl.textContent = total.toLocaleString('vi-VN') + 'đ';

        if (discountRowEl && discountEl) {
            if (dd > 0 || vd > 0) {
                discountRowEl.style.display = 'flex';
                var parts = [];
                if (dd > 0) parts.push('Deal -' + dd.toLocaleString('vi-VN') + 'đ');
                if (vd > 0) parts.push('Voucher -' + vd.toLocaleString('vi-VN') + 'đ');
                discountEl.textContent = parts.join(' · ');
            } else {
                discountRowEl.style.display = 'none';
            }
        }
        updateMobileVoucherDisplay();
    }

    function updateMobileVoucherDisplay() {
        var voucher = window._mobileMiniCartSelectedVoucher || null;
        var appliedEl = document.getElementById('mobile-mini-cart-voucher-applied');
        var btnEl = document.getElementById('mobile-mini-cart-voucher-btn');
        var listEl = document.getElementById('mobile-mini-cart-voucher-list');
        var codeEl = document.getElementById('mobile-mini-cart-voucher-code');
        if (voucher && voucher.code) {
            if (appliedEl) appliedEl.style.display = 'flex';
            if (btnEl) btnEl.style.display = 'none';
            if (listEl) listEl.style.display = 'none';
            if (codeEl) codeEl.textContent = '🎫 ' + voucher.code + ' -' + (voucher.voucherDiscount || 0).toLocaleString('vi-VN') + 'đ';
        } else {
            if (appliedEl) appliedEl.style.display = 'none';
            if (btnEl) btnEl.style.display = '';
        }
    }

    window._mobileMiniCartSelectedVoucher = null;

    window._mobileMiniCartRemoveVoucher = function() {
        window._mobileMiniCartSelectedVoucher = null;
        updateMobileMiniCartSubtotal(window._mobileMiniCartData ? window._mobileMiniCartData.items || [] : []);
    };

    window._mobileMiniCartToggleVoucherList = function() {
        var listEl = document.getElementById('mobile-mini-cart-voucher-list');
        if (!listEl) return;
        if (listEl.style.display !== 'none') { listEl.style.display = 'none'; listEl.innerHTML = ''; return; }
        listEl.innerHTML = '<div style="text-align:center;padding:10px;color:var(--text-tertiary);font-size:12px;">Đang tải...</div>';
        listEl.style.display = 'block';
        fetch('/api/vouchers/available')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var vouchers = d.vouchers || [];
            if (!vouchers.length) {
                listEl.innerHTML = '<div style="text-align:center;padding:10px;color:var(--text-tertiary);font-size:12px;">Không có mã giảm giá nào</div>';
                return;
            }
            // Calculate cart subtotal to check min order
            var cartTp = 0;
            if (window._mobileMiniCartData && window._mobileMiniCartData.items) {
                var items = window._mobileMiniCartData.items;
                for (var j = 0; j < items.length; j++) {
                    if (!items[j].unavailable) cartTp += (items[j].salePrice || 0) * (items[j].quantity || 1);
                }
            }
            var html = '';
            for (var i = 0; i < vouchers.length; i++) {
                var v = vouchers[i];
                var discountText = v.discountType === 'PERCENT' ? v.discountValue + '%' : v.discountValue.toLocaleString('vi-VN') + 'đ';
                var maxText = v.discountType === 'PERCENT' && v.maxDiscountAmount ? ' (tối đa ' + v.maxDiscountAmount.toLocaleString('vi-VN') + 'đ)' : '';
                var minOrder = v.minOrderAmount || 0;
                var meetsMin = cartTp >= minOrder;
                var minText = minOrder > 0 ? 'Đơn tối thiểu ' + minOrder.toLocaleString('vi-VN') + 'đ' + (meetsMin ? '' : ' (đơn hiện tại ' + cartTp.toLocaleString('vi-VN') + 'đ)') : 'Không giới hạn';
                var disabledClass = meetsMin ? '' : ' mobile-mini-cart-voucher-item--disabled';
                var onclick = meetsMin ? 'event.stopPropagation();window._mobileMiniCartSelectVoucher(\'' + (v.code || '').replace(/'/g, "\\'") + '\',' + (v.voucherDiscount || v.discountValue || 0) + ',\'' + escapeHtml(v.dealName || '') + '\')' : '';
                html += '<div class="mobile-mini-cart-voucher-item' + disabledClass + '" onclick="' + onclick + '">' +
                    '<span class="mobile-mini-cart-voucher-item-code">' + escapeHtml(v.code) + (meetsMin ? '' : ' 🔒') + '</span>' +
                    '<span class="mobile-mini-cart-voucher-item-discount">Giảm ' + discountText + maxText + '</span>' +
                    '<span class="mobile-mini-cart-voucher-item-min">' + minText + '</span>' +
                '</div>';
            }
            listEl.innerHTML = html;
        })
        .catch(function() {
            listEl.innerHTML = '<div style="text-align:center;padding:10px;color:var(--danger);font-size:12px;">Lỗi tải</div>';
        });
    };

    window._mobileMiniCartSelectVoucher = function(code, voucherDiscount, dealName) {
        fetch('/api/cart/apply-voucher', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'code=' + encodeURIComponent(code)
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var listEl = document.getElementById('mobile-mini-cart-voucher-list');
            if (listEl) { listEl.style.display = 'none'; listEl.innerHTML = ''; }
            if (d.success) {
                window._mobileMiniCartSelectedVoucher = d.data || { code: code, voucherDiscount: voucherDiscount, dealName: dealName };
            } else {
                alert(d.message || 'Không thể áp dụng mã');
            }
            updateMobileMiniCartSubtotal(window._mobileMiniCartData ? window._mobileMiniCartData.items || [] : []);
        })
        .catch(function() {
            alert('Lỗi kết nối khi áp dụng mã');
        });
    };

    // Exposed update/remove functions for mobile mini-cart
    window._mobileMiniCartUpdate = function(productId, newQty) {
        if (newQty <= 0) { window._mobileMiniCartRemove(productId); return; }
        var fd = new URLSearchParams();
        fd.append('productId', productId); fd.append('quantity', newQty);
        fetch('/api/cart/update', { method: 'POST', body: fd })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success && window._mobileMiniCartData && window._mobileMiniCartData.items) {
                var items = window._mobileMiniCartData.items;
                for (var i = 0; i < items.length; i++) {
                    if (items[i].productId === productId) { items[i].quantity = newQty; break; }
                }
                var total = 0;
                for (var j = 0; j < items.length; j++) { total += items[j].quantity || 0; }
                window._mobileMiniCartData.count = total;
                renderMobileMiniCart(window._mobileMiniCartData);
                if (window.updateCartBadge) window.updateCartBadge(total);
            }
        });
    };

    window._mobileMiniCartRemove = function(productId) {
        var fd = new URLSearchParams();
        fd.append('productId', productId);
        fetch('/api/cart/remove', { method: 'POST', body: fd })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success && window._mobileMiniCartData && window._mobileMiniCartData.items) {
                var newItems = [], newCount = 0;
                for (var i = 0; i < window._mobileMiniCartData.items.length; i++) {
                    if (window._mobileMiniCartData.items[i].productId !== productId) {
                        newItems.push(window._mobileMiniCartData.items[i]);
                        newCount += window._mobileMiniCartData.items[i].quantity || 0;
                    }
                }
                window._mobileMiniCartData.items = newItems;
                window._mobileMiniCartData.count = newCount;
                renderMobileMiniCart(window._mobileMiniCartData);
                if (window.updateCartBadge) window.updateCartBadge(newCount);
            }
        });
    };

    function escapeHtml(text) {
        if (!text) return '';
        var d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    // --- Long-press detection ---
    cartBtn.addEventListener('pointerdown', function(e) {
        isLongPress = false;
        pressTimer = setTimeout(function() {
            isLongPress = true;
            openMobileMiniCart();
        }, LONG_PRESS_MS);
    });

    cartBtn.addEventListener('pointermove', function(e) {
        // Cancel long-press if finger moves too much
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    });

    cartBtn.addEventListener('pointerup', function(e) {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        if (isLongPress) {
            e.preventDefault();
            e.stopPropagation();
            // Don't navigate — mini-cart is already open
        }
    });

    cartBtn.addEventListener('pointercancel', function() {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    });

    // Prevent click navigation after long-press
    cartBtn.addEventListener('click', function(e) {
        if (isLongPress) {
            e.preventDefault();
            e.stopPropagation();
            isLongPress = false;
        }
    }, true); // capture phase to intercept before navigation
})();
</script>
</body>
</html>
