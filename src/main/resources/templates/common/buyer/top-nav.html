<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  common/buyer/top-nav.html
  Desktop horizontal top navbar — visible only on min-width: 768px
  Replaces mobile-header + mobile-nav on desktop screens

  Layout:
    Left:   Logo | divider | Nav links (Trang chủ, Bản đồ, Đơn hàng)
    Right:  Search | Cart+badge | Notifications+badge | Avatar pill (avatar + text + chevron)
-->
<body th:fragment="topNav">
<nav id="desktop-top-nav" class="desktop-top-nav">
    <div class="desktop-top-nav__inner">
        <!-- Left group: Logo | divider | Nav links -->
        <div class="desktop-top-nav__left">
            <a th:href="@{/}" class="desktop-top-nav__logo" aria-label="DealXanh">
                <img th:src="@{/img/logo-header.svg}" alt="DealXanh">
            </a>

            <!-- Vertical divider -->
            <div class="desktop-top-nav__divider"></div>

            <!-- Nav links -->
            <div class="desktop-top-nav__links">
                <a th:href="@{/}" class="desktop-top-nav__link" th:classappend="${activeNav == 'home'} ? 'desktop-top-nav__link--active' : ''">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>Trang chủ</span>
                </a>
                <a th:href="@{/buyer/deal-map}" class="desktop-top-nav__link" th:classappend="${activeNav == 'map'} ? 'desktop-top-nav__link--active' : ''">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>Bản đồ</span>
                </a>
                <a th:href="@{/buyer/orders}" class="desktop-top-nav__link" th:classappend="${activeNav == 'orders'} ? 'desktop-top-nav__link--active' : ''">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    <span>Đơn hàng</span>
                </a>
            </div>
        </div>

        <!-- Right: Action icons -->
        <div class="desktop-top-nav__actions">
            <!-- Search -->
            <button class="desktop-top-nav__icon-btn" aria-label="Tìm kiếm" onclick="openSearch()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>

            <!-- Cart with mini-dropdown on hover -->
            <div class="desktop-top-nav__cart-wrap" id="desktop-cart-wrap" th:attr="data-active=${activeNav == 'cart'} ? 'true' : null">
                <a th:href="@{/buyer/cart}" class="desktop-top-nav__icon-btn" aria-label="Giỏ hàng" th:classappend="${activeNav == 'cart'} ? 'desktop-top-nav__icon-btn--active' : ''" style="position:relative">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="desktop-cart-badge" class="desktop-top-nav__badge" th:text="${cartItemCount != null ? cartItemCount : ''}" th:style="${cartItemCount != null and cartItemCount > 0} ? 'display:flex' : ''">0</span>
                </a>

                <!-- Mini-cart dropdown (hidden by default, shown on hover) -->
                <div class="desktop-top-nav__cart-dropdown" id="cart-dropdown" style="display:none">
                    <div class="cart-dropdown-header">
                        <span class="cart-dropdown-title">Giỏ hàng</span>
                        <span class="cart-dropdown-count" id="cart-dropdown-count">0</span>
                    </div>
                    <div class="cart-dropdown-list" id="cart-dropdown-list">
                        <div class="cart-dropdown-loading">Đang tải...</div>
                    </div>
                    <div class="cart-dropdown-footer">
                        <div class="cart-dropdown-summary" id="cart-dropdown-summary" style="display:none">
                            <div class="cart-dropdown-subtotal-row">
                                <span>Tạm tính:</span>
                                <span class="cart-dropdown-subtotal" id="cart-dropdown-subtotal">0đ</span>
                            </div>
                            <div class="cart-dropdown-discount-row" id="cart-dropdown-discount-row" style="display:none">
                                <span>Giảm giá:</span>
                                <span class="cart-dropdown-discount" id="cart-dropdown-discount">-0đ</span>
                            </div>
                        </div>
                        <!-- Mini voucher row (inline, like cart page) -->
                        <div class="cart-dropdown-voucher" id="cart-dropdown-voucher">
                            <!-- Applied voucher badge -->
                            <div class="cart-dropdown-voucher-applied" id="cart-dropdown-voucher-applied" style="display:none;">
                                <span class="cart-dropdown-voucher-code" id="cart-dropdown-voucher-code"></span>
                                <button class="cart-dropdown-voucher-remove" onclick="event.stopPropagation();window._miniCartRemoveVoucher()">✕</button>
                            </div>
                            <!-- Select voucher button -->
                            <button class="cart-dropdown-voucher-btn" id="cart-dropdown-voucher-btn" onclick="event.stopPropagation();window._miniCartToggleVoucherList()">🎫 Chọn mã giảm giá</button>
                            <!-- Inline voucher list (hidden by default) -->
                            <div class="cart-dropdown-voucher-list" id="cart-dropdown-voucher-list" style="display:none;"></div>
                        </div>
                        <a th:href="@{/buyer/checkout}" class="cart-dropdown-checkout-btn">Thanh toán ngay</a>
                        <a th:href="@{/buyer/cart}" class="cart-dropdown-view-btn">Xem giỏ hàng</a>
                    </div>
                </div>
            </div>

            <!-- Notifications with hover dropdown (desktop) -->
            <div class="desktop-top-nav__notif-wrap" id="desktop-notif-wrap">
                <button class="desktop-top-nav__icon-btn" id="desktop-notif-toggle" aria-label="Thông báo" onclick="if(window.innerWidth<768)toggleNotifications()" style="position:relative">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span id="desktop-notif-badge" class="desktop-top-nav__badge" th:text="${notifCount != null ? notifCount : ''}" th:style="${notifCount != null and notifCount > 0} ? 'display:flex' : ''">0</span>
                </button>
                <!-- Mini-notif dropdown (desktop hover) -->
                <div class="desktop-top-nav__notif-dropdown" id="desktop-notif-dropdown" style="display:none">
                    <div class="cart-dropdown-header">
                        <span class="cart-dropdown-title">Thông báo</span>
                        <span class="cart-dropdown-count" id="desktop-notif-dropdown-count">0</span>
                    </div>
                    <div class="cart-dropdown-list" id="desktop-notif-dropdown-list">
                        <div class="cart-dropdown-loading">Đang tải...</div>
                    </div>
                    <div class="cart-dropdown-footer" style="text-align:center">
                        <a href="/buyer/orders" style="font-size:13px;font-weight:600;color:var(--primary);text-decoration:none">Xem tất cả</a>
                    </div>
                </div>
            </div>

            <!-- Account dropdown wrap — logged in: show avatar + name + chevron toggle -->
            <div th:if="${currentUserFullName != null}" class="desktop-top-nav__account-wrap" id="desktop-account-wrap">
                <button type="button" id="account-trigger" class="desktop-top-nav__avatar-pill" th:classappend="${activeNav == 'account'} ? 'desktop-top-nav__avatar-pill--active' : ''" aria-label="Tài khoản" aria-expanded="false" aria-haspopup="true">
                    <!-- Avatar circle: shows real photo when available, falls back to initials -->
                    <span class="desktop-top-nav__avatar-circle" style="position:relative;background:#1a5c38;color:#fff;font-weight:700;font-size:13px;">
                        <img th:if="${currentUserAvatar != null and !currentUserAvatar.isEmpty()}"
                             th:src="${currentUserAvatar}"
                             alt="" width="30" height="30"
                             onerror="this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='';"
                             style="width:100%;height:100%;border-radius:50%;object-fit:cover;position:absolute;top:0;left:0;display:block;">
                        <span th:text="${currentUserInitials}"
                              th:style="${currentUserAvatar != null and !currentUserAvatar.isEmpty()} ? 'display:none' : ''">MT</span>
                    </span>
                    <span class="desktop-top-nav__avatar-name" th:text="${currentUserFullName}">Nguyễn Minh Tuấn</span>
                    <svg class="desktop-top-nav__chevron" id="account-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>

                <!-- Account dropdown menu — shared fragment with 3 items -->
                <div class="desktop-top-nav__account-dropdown" id="account-dropdown" style="display:none" onclick="var self=this;setTimeout(function(){self.style.display='none';var t=document.getElementById('account-trigger');if(t)t.setAttribute('aria-expanded','false');var c=document.getElementById('account-chevron');if(c)c.classList.remove('chevron-open');},50);">
                    <div th:replace="~{common/buyer/account-dropdown-menu :: accountMenuItems}"></div>
                </div>
            </div>
            <!-- Auth buttons — logged out: show Login + Register -->
            <div th:unless="${currentUserFullName != null}" class="header-auth-buttons">
                <a href="/login" class="btn-header-login">Đăng nhập</a>
                <a href="/register" class="btn-header-register">Đăng ký</a>
            </div>
        </div>
    </div>
</nav>

<script>
// ===== DESKTOP BADGE SYNC =====
// Sync cart badge between mobile and desktop
(function() {
    // Override global updateCartBadge to update both mobile and desktop badges
    var _origUpdateCartBadge = window.updateCartBadge;
    window.updateCartBadge = function(count) {
        // Call original if it exists
        if (_origUpdateCartBadge) _origUpdateCartBadge(count);
        // Also update desktop badge
        var db = document.getElementById('desktop-cart-badge');
        if (db) {
            if (count > 0) {
                db.textContent = count;
                db.style.display = 'flex';
            } else {
                db.style.display = 'none';
            }
        }
    };

    // Override updateNotifBadge to update both mobile and desktop badges
    var _origUpdateNotifBadge = window.updateNotifBadge;
    window.updateNotifBadge = function(count) {
        if (_origUpdateNotifBadge) _origUpdateNotifBadge(count);
        var db = document.getElementById('desktop-notif-badge');
        if (db) {
            if (count > 0) {
                db.textContent = count;
                db.style.display = 'flex';
            } else {
                db.style.display = 'none';
            }
        }
    };

    // Poll cart count every 30s
    setInterval(function() {
        fetch('/api/cart/count')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var count = d.count || 0;
            var db = document.getElementById('desktop-cart-badge');
            if (db) {
                if (count > 0) { db.textContent = count; db.style.display = 'flex'; }
                else { db.style.display = 'none'; }
            }
        }).catch(function() {});
    }, 30000);

    // Poll notification count every 60s
    setInterval(function() {
        fetch('/api/notifications/count')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) {
                var count = d.count || 0;
                var db = document.getElementById('desktop-notif-badge');
                if (db) {
                    if (count > 0) { db.textContent = count; db.style.display = 'flex'; }
                    else { db.style.display = 'none'; }
                }
            }
        }).catch(function() {});
    }, 60000);
})();

// ===== MINI-CART DROPDOWN =====
(function() {
    var cartWrap = document.getElementById('desktop-cart-wrap');
    var cartDropdown = document.getElementById('cart-dropdown');
    var closeTimer = null;
    var cachedCartData = null;
    var hasFetched = false;

    if (!cartWrap || !cartDropdown) return;

    function showCartDropdown() {
        // Cancel any pending close
        if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
        // If already visible, no-op
        if (cartDropdown.style.display !== 'none') return;

        // Fetch cart data only if we don't have cached data for this hover session
        if (!hasFetched) {
            fetchCartData();
        } else if (cachedCartData) {
            renderCartDropdown(cachedCartData);
        }
        cartDropdown.style.display = 'flex';
    }

    function hideCartDropdown() {
        // Debounce with 200ms delay
        if (closeTimer) clearTimeout(closeTimer);
        closeTimer = setTimeout(function() {
            cartDropdown.style.display = 'none';
            // Reset cache flag so next hover fetches fresh data
            hasFetched = false;
            cachedCartData = null;
            closeTimer = null;
        }, 200);
    }

    function cancelHide() {
        if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    }

    function fetchCartData() {
        var list = document.getElementById('cart-dropdown-list');
        if (list) list.innerHTML = '<div class="cart-dropdown-loading">Đang tải...</div>';

        fetch('/api/cart')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            cachedCartData = data;
            hasFetched = true;
            renderCartDropdown(data);
        })
        .catch(function() {
            hasFetched = true;
            cachedCartData = { items: [], count: 0 };
            if (list) {
                list.innerHTML = '<div class="cart-dropdown-empty">' +
                    '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--border);margin-bottom:8px">' +
                    '<circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>' +
                    '<path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>' +
                    '<p>Không thể tải giỏ hàng</p></div>';
            }
        });
    }

    window._miniCartData = null; // shared cache

    function renderCartDropdown(data) {
        window._miniCartData = data;
        var count = data.count || 0;
        var items = data.items || [];
        var countEl = document.getElementById('cart-dropdown-count');
        var listEl = document.getElementById('cart-dropdown-list');
        if (countEl) countEl.textContent = count;

        if (!listEl) return;

        var summaryEl = document.getElementById('cart-dropdown-summary');
        if (summaryEl) summaryEl.style.display = items.length > 0 ? 'block' : 'none';

        if (items.length === 0) {
            listEl.innerHTML = '<div class="cart-dropdown-empty"><p>Không có đơn hàng nào</p></div>';
            updateMiniCartSubtotal([]);
            return;
        }

        var html = '';
        for (var i = 0; i < Math.min(items.length, 6); i++) {
            var item = items[i];
            var pid = item.productId || 0;
            var imgSrc = item.productImage || '/img/default-banner.svg';
            var name = item.productName || '';
            var qty = item.quantity || 0;
            var salePrice = item.salePrice || 0;
            var originalPrice = item.originalPrice || 0;
            var maxStock = item.maxStock || 99;
            var unavailable = item.unavailable;
            var unavailClass = unavailable ? ' cart-dropdown-item--unavailable' : '';

            var qtyDisabled = unavailable ? ' disabled' : '';
            var plusDisabled = (qty >= maxStock || unavailable) ? ' disabled' : '';

            html += '<div class="cart-dropdown-item' + unavailClass + '">' +
                '<img class="cart-dropdown-item-img" src="' + escapeHtmlAttr(imgSrc) + '" alt="" loading="lazy" onerror="this.src=\'/img/default-banner.svg\'">' +
                '<div class="cart-dropdown-item-info">' +
                    '<div class="cart-dropdown-item-name">' + escapeHtml(name) + '</div>' +
                    '<div class="cart-dropdown-item-bottom">' +
                        '<span class="cart-dropdown-item-price">' + salePrice.toLocaleString('vi-VN') + 'đ</span>' +
                        '<div class="cart-dropdown-item-qty-wrap">' +
                            '<button class="cart-dropdown-qty-btn" onclick="event.stopPropagation();window._miniCartUpdate(' + pid + ', ' + (qty - 1) + ')"' + qtyDisabled + '>−</button>' +
                            '<span class="cart-dropdown-qty-num">' + qty + '</span>' +
                            '<button class="cart-dropdown-qty-btn" onclick="event.stopPropagation();window._miniCartUpdate(' + pid + ', ' + (qty + 1) + ')"' + plusDisabled + '>+</button>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<button class="cart-dropdown-item-del" onclick="event.stopPropagation();window._miniCartRemove(' + pid + ')" title="Xóa">✕</button>' +
            '</div>';
        }

        if (items.length > 6) {
            html += '<div class="cart-dropdown-more">+ ' + (items.length - 6) + ' sản phẩm khác</div>';
        }

        listEl.innerHTML = html;
        updateMiniCartSubtotal(items);
    }

    function updateMiniCartSubtotal(items) {
        var subtotalEl = document.getElementById('cart-dropdown-subtotal');
        var discountRowEl = document.getElementById('cart-dropdown-discount-row');
        var discountEl = document.getElementById('cart-dropdown-discount');
        if (!subtotalEl) return;

        var tp = 0, to = 0; // same vars as cart page recalcCart
        var fixedDealIds = {}, fixedDealDiscount = 0;
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            if (item.unavailable) continue;
            var qty = item.quantity || 0;
            var sale = item.salePrice || 0;
            var orig = item.originalPrice || 0;
            tp += sale * qty;
            to += orig * qty;
            if (item.discountType === 'FIXED' && item.dealId > 0 && !fixedDealIds[item.dealId]) {
                fixedDealDiscount += (item.discountValue || 0);
                fixedDealIds[item.dealId] = true;
            }
        }
        // Match cart page: dd = to - tp (PERCENT savings already in price)
        var dd = to - tp;
        var vd = window._miniCartSelectedVoucher ? (window._miniCartSelectedVoucher.voucherDiscount || 0) : 0;
        var total = tp - fixedDealDiscount - vd;
        if (total < 0) total = 0;

        subtotalEl.textContent = total.toLocaleString('vi-VN') + 'đ';

        if (discountRowEl && discountEl) {
            if (dd > 0 || vd > 0) {
                discountRowEl.style.display = 'flex';
                var parts = [];
                if (dd > 0) parts.push('Deal -' + dd.toLocaleString('vi-VN') + 'đ');
                if (vd > 0) parts.push('Voucher -' + vd.toLocaleString('vi-VN') + 'đ');
                discountEl.textContent = parts.join(' · ');
            } else {
                discountRowEl.style.display = 'none';
            }
        }

        // Update voucher display
        updateMiniVoucherDisplay();
    }

    function updateMiniVoucherDisplay() {
        var voucher = window._miniCartSelectedVoucher || null;
        var voucherRow = document.getElementById('cart-dropdown-voucher');
        var appliedEl = document.getElementById('cart-dropdown-voucher-applied');
        var btnEl = document.getElementById('cart-dropdown-voucher-btn');
        var listEl = document.getElementById('cart-dropdown-voucher-list');
        var codeEl = document.getElementById('cart-dropdown-voucher-code');
        if (!voucherRow) return;
        if (voucher && voucher.code) {
            if (appliedEl) appliedEl.style.display = 'flex';
            if (btnEl) btnEl.style.display = 'none';
            if (listEl) listEl.style.display = 'none';
            if (codeEl) codeEl.textContent = '🎫 ' + voucher.code + ' -' + (voucher.voucherDiscount || 0).toLocaleString('vi-VN') + 'đ';
        } else {
            if (appliedEl) appliedEl.style.display = 'none';
            if (btnEl) btnEl.style.display = '';
            // Don't auto-hide list — it's toggled separately
        }
    }

    // Initialize: mini-cart has its own voucher state (not from session)
    window._miniCartSelectedVoucher = null;

    window._miniCartRemoveVoucher = function() {
        window._miniCartSelectedVoucher = null;
        updateMiniCartSubtotal(window._miniCartData ? window._miniCartData.items || [] : []);
    };

    // Toggle inline voucher list inside mini-cart
    window._miniCartToggleVoucherList = function() {
        var listEl = document.getElementById('cart-dropdown-voucher-list');
        if (!listEl) return;
        var isVisible = listEl.style.display !== 'none';
        if (isVisible) {
            listEl.style.display = 'none';
            listEl.innerHTML = '';
            return;
        }
        // Fetch and show vouchers
        listEl.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-tertiary);font-size:12px;">Đang tải...</div>';
        listEl.style.display = 'block';
        fetch('/api/vouchers/available')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var vouchers = d.vouchers || [];
            if (!vouchers.length) {
                listEl.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-tertiary);font-size:12px;">Không có mã giảm giá nào khả dụng</div>';
                return;
            }
            // Calculate cart subtotal (tp) to check min order
            var cartTp = 0;
            if (window._miniCartData && window._miniCartData.items) {
                var items = window._miniCartData.items;
                for (var j = 0; j < items.length; j++) {
                    if (!items[j].unavailable) cartTp += (items[j].salePrice || 0) * (items[j].quantity || 1);
                }
            }
            var html = '';
            for (var i = 0; i < vouchers.length; i++) {
                var v = vouchers[i];
                var discountText = v.discountType === 'PERCENT' ? v.discountValue + '%' : v.discountValue.toLocaleString('vi-VN') + 'đ';
                var maxText = v.discountType === 'PERCENT' && v.maxDiscountAmount ? ' (tối đa ' + v.maxDiscountAmount.toLocaleString('vi-VN') + 'đ)' : '';
                var minOrder = v.minOrderAmount || 0;
                var meetsMin = cartTp >= minOrder;
                var minText = minOrder > 0 ? 'Đơn tối thiểu ' + minOrder.toLocaleString('vi-VN') + 'đ' + (meetsMin ? '' : ' (đơn hiện tại ' + cartTp.toLocaleString('vi-VN') + 'đ)') : 'Không giới hạn';
                var disabledClass = meetsMin ? '' : ' cart-dropdown-voucher-item--disabled';
                var onclick = meetsMin ? 'event.stopPropagation();window._miniCartSelectVoucher(\'' + (v.code || '').replace(/'/g, "\\'") + '\',' + (v.voucherDiscount || v.discountValue || 0) + ',\'' + escapeHtml(v.dealName || '') + '\')' : '';
                html += '<div class="cart-dropdown-voucher-item' + disabledClass + '" onclick="' + onclick + '">' +
                    '<span class="cart-dropdown-voucher-item-code">' + escapeHtml(v.code) + (meetsMin ? '' : ' 🔒') + '</span>' +
                    '<span class="cart-dropdown-voucher-item-discount">Giảm ' + discountText + maxText + '</span>' +
                    '<span class="cart-dropdown-voucher-item-min">' + minText + '</span>' +
                '</div>';
            }
            listEl.innerHTML = html;
        })
        .catch(function() {
            listEl.innerHTML = '<div style="text-align:center;padding:12px;color:var(--danger);font-size:12px;">Lỗi tải mã giảm giá</div>';
        });
    };

    window._miniCartSelectVoucher = function(code, voucherDiscount, dealName) {
        // Call server API to validate and apply voucher (syncs with session)
        fetch('/api/cart/apply-voucher', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'code=' + encodeURIComponent(code)
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var listEl = document.getElementById('cart-dropdown-voucher-list');
            if (listEl) { listEl.style.display = 'none'; listEl.innerHTML = ''; }
            if (d.success) {
                window._miniCartSelectedVoucher = d.data || { code: code, voucherDiscount: voucherDiscount, dealName: dealName };
            } else {
                alert(d.message || 'Không thể áp dụng mã');
            }
            updateMiniCartSubtotal(window._miniCartData ? window._miniCartData.items || [] : []);
        })
        .catch(function() {
            alert('Lỗi kết nối khi áp dụng mã');
        });
    };

    // Exposed for onclick handlers
    window._miniCartUpdate = function(productId, newQty) {
        if (newQty <= 0) {
            window._miniCartRemove(productId);
            return;
        }
        var formData = new URLSearchParams();
        formData.append('productId', productId);
        formData.append('quantity', newQty);
        fetch('/api/cart/update', { method: 'POST', body: formData })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) {
                // Update cached data
                if (window._miniCartData && window._miniCartData.items) {
                    var items = window._miniCartData.items;
                    var found = false;
                    for (var i = 0; i < items.length; i++) {
                        if (items[i].productId === productId) {
                            items[i].quantity = newQty;
                            found = true;
                            break;
                        }
                    }
                    if (found) {
                        // Recalculate count
                        var total = 0;
                        for (var j = 0; j < items.length; j++) {
                            total += items[j].quantity || 0;
                        }
                        window._miniCartData.count = total;
                    }
                }
                renderCartDropdown(window._miniCartData || { items: [], count: 0 });
                var badgeCount = window._miniCartData ? window._miniCartData.count : 0;
                if (window.updateCartBadge) window.updateCartBadge(badgeCount);
            }
        });
    };

    window._miniCartRemove = function(productId) {
        var formData = new URLSearchParams();
        formData.append('productId', productId);
        fetch('/api/cart/remove', { method: 'POST', body: formData })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) {
                // Remove from cached data
                if (window._miniCartData && window._miniCartData.items) {
                    var newItems = [];
                    var newCount = 0;
                    for (var i = 0; i < window._miniCartData.items.length; i++) {
                        if (window._miniCartData.items[i].productId !== productId) {
                            newItems.push(window._miniCartData.items[i]);
                            newCount += window._miniCartData.items[i].quantity || 0;
                        }
                    }
                    window._miniCartData.items = newItems;
                    window._miniCartData.count = newCount;
                }
                renderCartDropdown(window._miniCartData || { items: [], count: 0 });
                var badgeCount = window._miniCartData ? window._miniCartData.count : 0;
                if (window.updateCartBadge) window.updateCartBadge(badgeCount);
            }
        });
    };

    // Mouse events on the container wrap
    cartWrap.addEventListener('mouseenter', showCartDropdown);
    cartWrap.addEventListener('mouseleave', hideCartDropdown);

    // Cancel close when hovering over the dropdown itself
    cartDropdown.addEventListener('mouseenter', cancelHide);
    cartDropdown.addEventListener('mouseleave', hideCartDropdown);

    // Escape HTML helpers
    function escapeHtml(text) {
        if (!text) return '';
        var d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }
    function escapeHtmlAttr(text) {
        if (!text) return '';
        return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
})();

// ===== DESKTOP NOTIF HOVER DROPDOWN =====
(function() {
    var notifWrap = document.getElementById('desktop-notif-wrap');
    var notifDropdown = document.getElementById('desktop-notif-dropdown');
    var closeTimer = null;
    var hasFetched = false;

    if (!notifWrap || !notifDropdown) return;

    function timeAgo(dateStr) {
        if (!dateStr) return '';
        var d = new Date(dateStr), now = new Date();
        var diff = Math.floor((now - d) / 1000);
        if (diff < 60) return 'Vừa xong';
        if (diff < 3600) return Math.floor(diff/60) + ' phút trước';
        if (diff < 86400) return Math.floor(diff/3600) + ' giờ trước';
        if (diff < 604800) return Math.floor(diff/86400) + ' ngày trước';
        return d.toLocaleDateString('vi-VN');
    }

    function getNotifIcon(type) {
        if (!type) return '🔔';
        if (type.indexOf('ORDER') === 0) return '📦';
        if (type.indexOf('DEAL') === 0) return '🎉';
        if (type === 'COMPLETED') return '✅';
        if (type === 'CANCELLED') return '❌';
        return '🔔';
    }

    function showNotifDropdown() {
        if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
        if (notifDropdown.style.display !== 'none') return;
        if (!hasFetched) fetchNotifs();
        notifDropdown.style.display = 'flex';
    }

    function hideNotifDropdown() {
        if (closeTimer) clearTimeout(closeTimer);
        closeTimer = setTimeout(function() {
            notifDropdown.style.display = 'none';
            hasFetched = false;
            closeTimer = null;
        }, 200);
    }

    function cancelHide() {
        if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    }

    function fetchNotifs() {
        var list = document.getElementById('desktop-notif-dropdown-list');
        if (list) list.innerHTML = '<div class="cart-dropdown-loading">Đang tải...</div>';
        fetch('/api/notifications')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            hasFetched = true;
            if (!data.success || !data.notifications) {
                if (list) list.innerHTML = '<div class="cart-dropdown-empty"><p>Không thể tải thông báo</p></div>';
                return;
            }
            var notifs = data.notifications;
            var countEl = document.getElementById('desktop-notif-dropdown-count');
            if (countEl) countEl.textContent = data.unreadCount || 0;

            if (notifs.length === 0) {
                if (list) list.innerHTML = '<div class="cart-dropdown-empty"><p>Chưa có thông báo nào</p></div>';
                return;
            }

            var html = '';
            for (var i = 0; i < Math.min(notifs.length, 10); i++) {
                var n = notifs[i];
                var unreadClass = n.isRead ? '' : ' unread';
                html += '<div class="cart-dropdown-item' + unreadClass + '" onclick="event.stopPropagation();window.location.href=\'' + (n.linkUrl || '/buyer/orders') + '\'" style="align-items:flex-start;gap:10px">' +
                    '<span style="font-size:20px;flex-shrink:0">' + getNotifIcon(n.type) + '</span>' +
                    '<div style="flex:1;min-width:0">' +
                        '<div style="font-size:13px;font-weight:600;color:var(--text-primary);line-height:1.3;margin-bottom:2px">' + escapeHtml(n.title) + '</div>' +
                        '<div style="font-size:11px;color:var(--text-secondary);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + escapeHtml(n.message) + '</div>' +
                        '<div style="font-size:10px;color:var(--text-tertiary);margin-top:4px">' + timeAgo(n.createdAt) + '</div>' +
                    '</div>' +
                    (n.isRead ? '' : '<span style="width:7px;height:7px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:4px"></span>') +
                '</div>';
            }
            if (list) list.innerHTML = html;
        })
        .catch(function() {
            hasFetched = true;
            if (list) list.innerHTML = '<div class="cart-dropdown-empty"><p>Không thể tải thông báo</p></div>';
        });
    }

    function escapeHtml(text) {
        if (!text) return '';
        var d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    notifWrap.addEventListener('mouseenter', showNotifDropdown);
    notifWrap.addEventListener('mouseleave', hideNotifDropdown);
    notifDropdown.addEventListener('mouseenter', cancelHide);
    notifDropdown.addEventListener('mouseleave', hideNotifDropdown);
})();

// ===== DESKTOP ACCOUNT DROPDOWN =====
(function() {
    var trigger = document.getElementById('account-trigger');
    var dropdown = document.getElementById('account-dropdown');
    var chevron = document.getElementById('account-chevron');

    if (!trigger || !dropdown) return;

    function openDropdown() {
        dropdown.style.display = 'block';
        trigger.setAttribute('aria-expanded', 'true');
        if (chevron) chevron.classList.add('chevron-open');
    }

    function closeDropdown() {
        dropdown.style.display = 'none';
        trigger.setAttribute('aria-expanded', 'false');
        if (chevron) chevron.classList.remove('chevron-open');
    }

    function toggleDropdown(e) {
        e.stopPropagation();
        e.preventDefault();
        if (dropdown.style.display === 'none' || dropdown.style.display === '') {
            openDropdown();
        } else {
            closeDropdown();
        }
    }

    // Click trigger → toggle
    trigger.addEventListener('click', toggleDropdown);

    // Click inside dropdown → don't close
    dropdown.addEventListener('click', function(e) {
        e.stopPropagation();
    });

    // Click outside → close
    document.addEventListener('click', function(e) {
        if (dropdown.style.display !== 'none') {
            // Check click is outside both trigger and dropdown
            if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
                closeDropdown();
            }
        }
    });

    // ESC key → close
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && dropdown.style.display !== 'none') {
            closeDropdown();
            trigger.focus();
        }
    });
})();
</script>
