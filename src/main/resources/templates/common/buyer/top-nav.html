<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  common/buyer/top-nav.html
  Desktop horizontal top navbar — visible only on min-width: 768px
  Replaces mobile-header + mobile-nav on desktop screens

  Layout:
    Left:   Logo | divider | Nav links (Trang chủ, Bản đồ, Đơn hàng)
    Right:  Search | Cart+badge | Notifications+badge | Avatar pill (avatar + text + chevron)
-->
<body th:fragment="topNav">
<nav id="desktop-top-nav" class="desktop-top-nav">
    <div class="desktop-top-nav__inner">
        <!-- Left group: Logo | divider | Nav links -->
        <div class="desktop-top-nav__left">
            <a th:href="@{/}" class="desktop-top-nav__logo" aria-label="DealXanh">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0d5c2e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="desktop-top-nav__brand">DealXanh</span>
            </a>

            <!-- Vertical divider -->
            <div class="desktop-top-nav__divider"></div>

            <!-- Nav links -->
            <div class="desktop-top-nav__links">
                <a th:href="@{/}" class="desktop-top-nav__link" th:classappend="${activeNav == 'home'} ? 'desktop-top-nav__link--active' : ''">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>Trang chủ</span>
                </a>
                <a th:href="@{/buyer/deal-map}" class="desktop-top-nav__link" th:classappend="${activeNav == 'map'} ? 'desktop-top-nav__link--active' : ''">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>Bản đồ</span>
                </a>
                <a th:href="@{/buyer/orders}" class="desktop-top-nav__link" th:classappend="${activeNav == 'orders'} ? 'desktop-top-nav__link--active' : ''">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    <span>Đơn hàng</span>
                </a>
            </div>
        </div>

        <!-- Right: Action icons -->
        <div class="desktop-top-nav__actions">
            <!-- Search -->
            <button class="desktop-top-nav__icon-btn" aria-label="Tìm kiếm" onclick="openSearch()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>

            <!-- Cart with badge -->
            <a th:href="@{/buyer/cart}" class="desktop-top-nav__icon-btn" aria-label="Giỏ hàng" th:classappend="${activeNav == 'cart'} ? 'desktop-top-nav__icon-btn--active' : ''" style="position:relative">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span id="desktop-cart-badge" class="desktop-top-nav__badge" th:text="${cartItemCount != null ? cartItemCount : ''}" th:style="${cartItemCount != null and cartItemCount > 0} ? 'display:flex' : ''">0</span>
            </a>

            <!-- Notifications with badge -->
            <button class="desktop-top-nav__icon-btn" id="desktop-notif-toggle" aria-label="Thông báo" onclick="toggleNotifications()" style="position:relative">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span id="desktop-notif-badge" class="desktop-top-nav__badge" th:text="${notifCount != null ? notifCount : ''}" th:style="${notifCount != null and notifCount > 0} ? 'display:flex' : ''">0</span>
            </button>

            <!-- Avatar pill button -->
            <a href="#" onclick="handleAccountClick(event)" class="desktop-top-nav__avatar-pill" th:classappend="${activeNav == 'account'} ? 'desktop-top-nav__avatar-pill--active' : ''">
                <span class="desktop-top-nav__avatar-circle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </span>
                <span class="desktop-top-nav__avatar-name">Tài khoản</span>
                <svg class="desktop-top-nav__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </a>
        </div>
    </div>
</nav>

<script>
// ===== DESKTOP BADGE SYNC =====
// Sync cart badge between mobile and desktop
(function() {
    // Override global updateCartBadge to update both mobile and desktop badges
    var _origUpdateCartBadge = window.updateCartBadge;
    window.updateCartBadge = function(count) {
        // Call original if it exists
        if (_origUpdateCartBadge) _origUpdateCartBadge(count);
        // Also update desktop badge
        var db = document.getElementById('desktop-cart-badge');
        if (db) {
            if (count > 0) {
                db.textContent = count;
                db.style.display = 'flex';
            } else {
                db.style.display = 'none';
            }
        }
    };

    // Override updateNotifBadge to update both mobile and desktop badges
    var _origUpdateNotifBadge = window.updateNotifBadge;
    window.updateNotifBadge = function(count) {
        if (_origUpdateNotifBadge) _origUpdateNotifBadge(count);
        var db = document.getElementById('desktop-notif-badge');
        if (db) {
            if (count > 0) {
                db.textContent = count;
                db.style.display = 'flex';
            } else {
                db.style.display = 'none';
            }
        }
    };

    // Poll cart count every 30s
    setInterval(function() {
        fetch('/api/cart/count')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var count = d.count || 0;
            var db = document.getElementById('desktop-cart-badge');
            if (db) {
                if (count > 0) { db.textContent = count; db.style.display = 'flex'; }
                else { db.style.display = 'none'; }
            }
        }).catch(function() {});
    }, 30000);

    // Poll notification count every 60s
    setInterval(function() {
        fetch('/api/notifications/count')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) {
                var count = d.count || 0;
                var db = document.getElementById('desktop-notif-badge');
                if (db) {
                    if (count > 0) { db.textContent = count; db.style.display = 'flex'; }
                    else { db.style.display = 'none'; }
                }
            }
        }).catch(function() {});
    }, 60000);
})();
</script>
</body>
</html>
