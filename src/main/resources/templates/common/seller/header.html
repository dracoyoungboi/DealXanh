<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="header(pageTitle,activePage)">

<header class="sl-topbar">
    <div class="sl-topbar__left">
        <!-- Hamburger (mobile only) -->
        <button class="sl-topbar__hamburger" onclick="openMobileSidebar()"
                title="Mở menu" aria-label="Mở menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <div class="sl-topbar__title" th:text="${pageTitle}">Dashboard</div>
    </div>

    <div class="sl-topbar__right">
        <div class="sl-topbar__actions">
            <a href="/logout" class="sl-logout-btn" title="Đăng xuất">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </a>
        </div>
    </div>
</header>

</body>
</html>
