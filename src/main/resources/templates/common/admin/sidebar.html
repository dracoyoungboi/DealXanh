<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  common/admin/sidebar.html
  Admin sidebar fragment with dynamic active states

  Usage:
  <div th:replace="~{common/admin/sidebar :: sidebar('dashboard')}"></div>
  <div th:replace="~{common/admin/sidebar :: sidebar('users')}"></div>

  Parameters:
  - activeSidebar: The current active page identifier (dashboard, users, seller-verify, profile, etc.)
-->
<body th:fragment="sidebar(activeSidebar)">
<aside class="sidebar">
    <a th:href="${adminUser != null and adminUser.role != null and adminUser.role.name == 'ROLE_MODERATOR' ? '/admin/seller-verify' : '/admin/dashboard'}"
       class="sidebar-header" style="text-decoration:none;cursor:pointer;">
        <div class="sidebar-header__logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
        </div>
        <div class="sidebar-header__text">
            <div class="sidebar-header__brand">DealXanh</div>
            <div class="sidebar-header__sub" th:text="${adminUser != null and adminUser.role != null and adminUser.role.name == 'ROLE_MODERATOR' ? 'Moderator Portal' : 'Admin Portal'}">Admin Portal</div>
        </div>
    </a>

    <div class="nav-section">
        <div class="nav-section__label">Tổng quan</div>
        <a class="nav-item" th:href="@{/admin/dashboard}" th:classappend="${activeSidebar == 'dashboard'} ? 'active' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
                <path d="M14 14h7v7h-7z"/>
            </svg>
            Dashboard
        </a>
    </div>

    <div class="nav-section">
        <div class="nav-section__label">Quản lý</div>
        <a class="nav-item" th:href="@{/admin/seller-verify}" th:classappend="${activeSidebar == 'seller-verify'} ? 'active' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Xét duyệt Seller
            <span class="nav-badge" id="sidebar-pending-count" th:if="${stats != null && stats.pendingStores > 0}" th:text="${stats.pendingStores}">0</span>
        </a>
        <a class="nav-item" th:href="@{/admin/users}" th:classappend="${activeSidebar == 'users'} ? 'active' : ''">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            Người dùng
        </a>
        <a class="nav-item" th:href="@{/admin/deals}" th:classappend="${activeSidebar == 'deals'} ? 'active' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
            Tất cả Deals
        </a>
        <a class="nav-item" th:href="@{/admin/products}" th:classappend="${activeSidebar == 'products'} ? 'active' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            Sản phẩm
        </a>
        <a class="nav-item" th:href="@{/admin/orders}" th:classappend="${activeSidebar == 'orders'} ? 'active' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            Đơn hàng
        </a>
    </div>

    <div class="nav-section">
        <div class="nav-section__label">Tài chính & Hỗ trợ</div>
        <a class="nav-item" th:href="@{/admin/finance}" th:classappend="${activeSidebar == 'finance'} ? 'active' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="1" x2="12" y2="23"/>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            Tài chính & Đối soát
        </a>
        <a class="nav-item" th:href="@{/admin/dispute}" th:classappend="${activeSidebar == 'dispute'} ? 'active' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            Khiếu nại & Tranh chấp
        </a>
        <a class="nav-item" th:href="@{/admin/analytics}" th:classappend="${activeSidebar == 'analytics'} ? 'active' : ''">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            Báo cáo & Analytics
        </a>
    </div>


    <div class="sidebar-footer">
        <a th:href="@{/admin/profile}" class="sidebar-user" style="text-decoration:none;">
            <div class="sidebar-user__avatar">
                <img th:src="${adminUser != null && adminUser.avatarUrl != null ? adminUser.avatarUrl : '/img/default-avatar.svg'}" alt="Admin">
            </div>
            <div>
                <div class="sidebar-user__name" th:text="${adminUser != null ? (adminUser.fullName != null ? adminUser.fullName : adminUser.username) : 'Admin'}">Admin Name</div>
                <div class="sidebar-user__role" th:text="${adminUser != null && adminUser.role != null ? (adminUser.role.name == 'ROLE_ADMIN' ? 'Quản trị viên' : 'Kiểm duyệt viên') : 'Quản trị viên'}">Quản trị viên</div>
            </div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:rgba(255,255,255,.55);margin-left:auto;">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </a>
    </div>
</aside>
</body>
</html>
