<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  common/admin/header.html
  Admin header fragment with dynamic title and optional date picker

  Usage:
  <div th:replace="~{common/admin/header :: header('Dashboard Tổng quan', true)}"></div>
  <div th:replace="~{common/admin/header :: header('Quản lý Người dùng', false)}"></div>

  Parameters:
  - title: Page title
  - showDatePicker: true to show date picker button (only for dashboard)
-->
<body th:fragment="header(title, showDatePicker)">
<header class="topbar">
    <div class="topbar__title" th:text="${title}">Dashboard</div>
    <div class="topbar__right">
        <!-- Date Picker (optional - only for dashboard) -->
        <th:block th:if="${showDatePicker}">
            <button class="topbar-period" onclick="toggleDatePicker()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span id="currentDate">Hôm nay · <span th:text="${#temporals.format(#temporals.createToday(), 'dd/MM/yyyy')}">08/05/2026</span></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>

            <!-- Date Picker Modal -->
            <div class="date-picker-modal" id="datePickerModal">
                <div class="date-picker-content" onclick="event.stopPropagation()">
                    <div class="date-picker-header">
                        <h3>Chọn ngày xem thống kê</h3>
                        <button class="date-picker-close" onclick="toggleDatePicker()">✕</button>
                    </div>
                    <div class="date-picker-body">
                        <div class="date-picker-presets">
                            <button class="preset-btn active" data-preset="today" onclick="selectPreset('today')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                                    <line x1="16" y1="2" x2="16" y2="6"/>
                                    <line x1="8" y1="2" x2="8" y2="6"/>
                                    <line x1="3" y1="10" x2="21" y2="10"/>
                                </svg>
                                Hôm nay
                            </button>
                            <button class="preset-btn" data-preset="yesterday" onclick="selectPreset('yesterday')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="15 18 9 12 15 6"/>
                                </svg>
                                Hôm qua
                            </button>
                            <button class="preset-btn" data-preset="week" onclick="selectPreset('week')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                                </svg>
                                7 ngày qua
                            </button>
                        </div>
                        <div class="date-picker-divider">
                            <span>Hoặc chọn ngày cụ thể</span>
                        </div>
                        <div class="date-picker-input">
                            <label for="customDate">Chọn ngày:</label>
                            <input type="date" id="customDate" class="custom-date-input">
                            <button class="apply-date-btn" onclick="applyCustomDate()">Áp dụng</button>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>

        <!-- Profile Button -->
        <a href="/admin/profile" class="topbar-btn" title="Hồ sơ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </a>

        <!-- Logout Button -->
        <a href="/logout" class="topbar-btn" title="Đăng xuất">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </a>
    </div>
</header>

<!-- Date Picker Scripts (only included when showDatePicker is true) -->
<th:block th:if="${showDatePicker}">
<script>
function toggleDatePicker() {
    const modal = document.getElementById('datePickerModal');
    if (modal) {
        modal.classList.toggle('active');
    }
}

function selectPreset(preset) {
    // Remove active class from all buttons
    document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
    // Add active class to clicked button
    event.target.closest('.preset-btn').classList.add('active');

    // Handle preset selection
    const today = new Date();
    let selectedDate;

    switch(preset) {
        case 'today':
            selectedDate = today;
            break;
        case 'yesterday':
            selectedDate = new Date(today);
            selectedDate.setDate(today.getDate() - 1);
            break;
        case 'week':
            selectedDate = new Date(today);
            selectedDate.setDate(today.getDate() - 7);
            break;
    }

    // Update current date display
    const formattedDate = formatDate(selectedDate);
    document.getElementById('currentDate').innerHTML = getPresetLabel(preset) + ' · ' + formattedDate;

    // Close modal
    toggleDatePicker();

    // Reload page with selected date
    const url = new URL(window.location);
    url.searchParams.set('date', selectedDate.toISOString().split('T')[0]);
    window.location.href = url.toString();
}

function applyCustomDate() {
    const customDateInput = document.getElementById('customDate');
    if (customDateInput && customDateInput.value) {
        // Update current date display
        const selectedDate = new Date(customDateInput.value);
        const formattedDate = formatDate(selectedDate);
        document.getElementById('currentDate').innerHTML = selectedDate.toLocaleDateString('vi-VN');

        // Close modal
        toggleDatePicker();

        // Reload page with selected date
        const url = new URL(window.location);
        url.searchParams.set('date', customDateInput.value);
        window.location.href = url.toString();
    }
}

function formatDate(date) {
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    return `${day}/${month}/${year}`;
}

function getPresetLabel(preset) {
    switch(preset) {
        case 'today': return 'Hôm nay';
        case 'yesterday': return 'Hôm qua';
        case 'week': return '7 ngày qua';
        default: return '';
    }
}

// Close modal when clicking outside
document.addEventListener('click', function(e) {
    const modal = document.getElementById('datePickerModal');
    const periodBtn = document.querySelector('.topbar-period');
    if (modal && modal.classList.contains('active') && !modal.contains(e.target) && !periodBtn.contains(e.target)) {
        modal.classList.remove('active');
    }
});
</script>
</th:block>

</body>
</html>
