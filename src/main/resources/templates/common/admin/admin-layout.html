<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  common/admin/admin-layout.html

  Usage in your pages:
  <!DOCTYPE html>
  <html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Your Page Title - DealXanh Admin</title>
      <!-- Include your CSS here -->
  </head>
  <body>
      <div th:replace="~{common/admin/admin-layout :: layout(
          activeSidebar='users',
          pageTitle='Quản lý Người dùng',
          showDatePicker=false
          )}">

          <!-- Your page content here -->
          <div class="content">
              <h1>Your Content</h1>
          </div>

      </div>
  </body>
  </html>

  Parameters:
  - activeSidebar: current page (dashboard, users, seller-verify, profile, etc.)
  - pageTitle: page title for header
  - showDatePicker: true only for dashboard page
-->
<body th:fragment="layout(activeSidebar, pageTitle, showDatePicker)">
<div class="layout">
    <!-- Include sidebar from common fragment -->
    <div th:replace="~{common/admin/sidebar :: sidebar(${activeSidebar})}"></div>

    <!-- Main content area -->
    <div class="main">
        <!-- Include header from common fragment -->
        <div th:replace="~{common/admin/header :: header(${pageTitle}, ${showDatePicker})}"></div>

        <!-- Page content - th:replace with your content -->
        <div th:replace="~{__*__}"></div>
    </div>
</div>
</body>
</html>
