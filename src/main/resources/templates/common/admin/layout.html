<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - DealXanh Admin' : 'Admin Dashboard - DealXanh'}">Admin Dashboard - DealXanh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
:root{
    --primary:#0d5c2e;--primary-dark:#08421f;--primary-light:#1a7c40;
    --accent:#d4af37;
    --surface:#fff;--bg:#f0f2f5;
    --text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;
    --border:#e0e0e0;--border-light:#f0f0f0;
    --shadow-sm:0 2px 8px rgba(0,0,0,.07);--shadow-md:0 4px 16px rgba(0,0,0,.1);
    --danger:#ef4444;--danger-bg:rgba(239,68,68,.1);
    --warning:#f59e0b;--warning-bg:rgba(245,158,11,.1);
    --success:#10b981;--success-bg:rgba(16,185,129,.1);
    --info:#3b82f6;--info-bg:rgba(59,130,246,.1);
    --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:20px;--radius-full:9999px;
    --font:'Inter',-apple-system,sans-serif;--tr:200ms ease-out;
    --sidebar:240px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text-primary);height:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}

/* Layout */
.layout{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{
    width:var(--sidebar);flex-shrink:0;
    background:var(--primary);
    display:flex;flex-direction:column;
    position:fixed;top:0;bottom:0;left:0;z-index:30;
    overflow-y:auto;scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{display:none}
.sidebar-header{
    padding:20px 16px;
    border-bottom:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;gap:10px;
}
.sidebar-header__logo{
    width:36px;height:36px;border-radius:var(--radius-md);
    background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sidebar-header__logo svg{width:18px;height:18px;color:#fff}
.sidebar-header__text{overflow:hidden}
.sidebar-header__brand{font-size:16px;font-weight:800;color:#fff}
.sidebar-header__sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}

.nav-section{padding:16px 10px 0}
.nav-section__label{
    font-size:10px;font-weight:700;color:rgba(255,255,255,.4);
    text-transform:uppercase;letter-spacing:.8px;
    padding:0 8px;margin-bottom:6px;
}
.nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;border-radius:var(--radius-md);
    color:rgba(255,255,255,.65);font-size:13px;font-weight:500;
    margin-bottom:2px;cursor:pointer;transition:all var(--tr);
    position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.nav-item.active::before{
    content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:0 2px 2px 0;background:#fff;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-badge{
    margin-left:auto;min-width:18px;height:18px;border-radius:9px;
    background:var(--danger);color:#fff;font-size:10px;font-weight:700;
    padding:0 4px;display:flex;align-items:center;justify-content:center;
}
.sidebar-footer{
    margin-top:auto;padding:14px 10px;
    border-top:1px solid rgba(255,255,255,.1);
}
.sidebar-user{
    display:flex;align-items:center;gap:10px;padding:8px;
    border-radius:var(--radius-md);cursor:pointer;
    transition:background var(--tr);
}
.sidebar-user:hover{background:rgba(255,255,255,.1)}
.sidebar-user__avatar{
    width:34px;height:34px;border-radius:50%;overflow:hidden;
    border:2px solid rgba(255,255,255,.2);flex-shrink:0;
}
.sidebar-user__avatar img{width:100%;height:100%;object-fit:cover}
.sidebar-user__name{font-size:13px;font-weight:600;color:#fff}
.sidebar-user__role{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}

/* Main content */
.main{
    margin-left:var(--sidebar);flex:1;
    display:flex;flex-direction:column;min-height:100vh;
}

/* Top bar */
.topbar{
    background:var(--surface);
    padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--border-light);
    position:sticky;top:0;z-index:20;
}
.topbar__title{font-size:18px;font-weight:800}
.topbar__right{display:flex;align-items:center;gap:12px}
.topbar-btn{
    width:36px;height:36px;border-radius:var(--radius-md);
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    transition:background var(--tr);position:relative;
}
.topbar-btn:hover{background:var(--border-light)}
.topbar-btn svg{width:18px;height:18px;color:var(--text-secondary)}
.topbar-notif{
    position:absolute;top:6px;right:6px;
    width:8px;height:8px;border-radius:50%;
    background:var(--danger);border:1.5px solid var(--surface);
}

/* Content area */
.content{padding:24px}
    </style>
</head>
<body>
<div class="layout">
    <!-- Hardcoded Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-header__logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div class="sidebar-header__text">
                <div class="sidebar-header__brand">DealXanh</div>
                <div class="sidebar-header__sub">Admin Portal</div>
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-section__label">Tổng quan</div>
            <a class="nav-item" th:href="@{/admin/dashboard}" th:classappend="${activeSidebar == 'dashboard'} ? ' active' : ''">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                    <path d="M14 14h7v7h-7z"/>
                </svg>
                Dashboard
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section__label">Quản lý</div>
            <a class="nav-item" th:href="@{/admin/seller-verify}" th:classappend="${activeSidebar == 'seller-verify'} ? ' active' : ''">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Xét duyệt Seller
                <span class="nav-badge" id="sidebar-pending-count" th:if="${pendingSellerCount != null and pendingSellerCount > 0}" th:text="${pendingSellerCount}">12</span>
            </a>
            <a class="nav-item" th:href="@{/admin/users}" th:classappend="${activeSidebar == 'users'} ? ' active' : ''">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Người dùng
            </a>
            <a class="nav-item" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                Tất cả Deals
            </a>
            <a class="nav-item" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <path d="M16 10a4 4 0 0 1-8 0"/>
                </svg>
                Đơn hàng
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section__label">Tài chính & Hỗ trợ</div>
            <a class="nav-item" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                Tài chính
            </a>
            <a class="nav-item" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                Khiếu nại & Tranh chấp
                <span class="nav-badge">3</span>
            </a>
            <a class="nav-item" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                Báo cáo & Analytics
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section__label">Hệ thống</div>
            <a class="nav-item" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.07 4.93l-1.41 1.41M4.93 19.07l-1.41 1.41M2 12h2M20 12h2M4.93 4.93l1.41 1.41M19.07 19.07l-1.41 1.41M12 2v2M12 20v2"/>
                </svg>
                Cài đặt
            </a>
        </div>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user__avatar">
                    <img src="/img/default-avatar.svg" alt="Admin">
                </div>
                <div>
                    <div class="sidebar-user__name" th:text="${#authentication != null ? #authentication.name : 'Admin'}">Admin Name</div>
                    <div class="sidebar-user__role">Super Admin</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <div class="main">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar__title" th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">Dashboard</div>
            <div class="topbar__right">
                <button class="topbar-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="topbar-notif"></span>
                </button>
                <button class="topbar-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M12 14a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <div class="content">
            <div th:replace="${contentTemplate}"></div>
        </div>
    </div>
</div>
</body>
</html>
