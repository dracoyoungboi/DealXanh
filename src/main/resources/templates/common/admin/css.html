<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  common/admin/css.html
  Admin common CSS fragment with all variables and base styles
-->
<head th:fragment="css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
    :root{
        --primary:#0d5c2e;--primary-dark:#08421f;--primary-light:#1a7c40;
        --accent:#d4af37;
        --surface:#fff;--bg:#f0f2f5;
        --text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;
        --border:#e0e0e0;--border-light:#f0f0f0;
        --shadow-sm:0 2px 8px rgba(0,0,0,.07);--shadow-md:0 4px 16px rgba(0,0,0,.1);
        --danger:#ef4444;--danger-bg:rgba(239,68,68,.1);
        --warning:#f59e0b;--warning-bg:rgba(245,158,11,.1);
        --success:#10b981;--success-bg:rgba(16,185,129,.1);
        --info:#3b82f6;--info-bg:rgba(59,130,246,.1);
        --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:20px;--radius-full:9999px;
        --font:'Inter',-apple-system,sans-serif;--tr:200ms ease-out;
        --sidebar:240px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{font-family:var(--font);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text-primary);height:100%}
    button{cursor:pointer;border:none;background:none;font-family:inherit}
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}

    /* Layout */
    .layout{display:flex;min-height:100vh}

    /* Sidebar */
    .sidebar{
        width:var(--sidebar);flex-shrink:0;
        background:var(--primary);
        display:flex;flex-direction:column;
        position:fixed;top:0;bottom:0;left:0;z-index:30;
        overflow-y:auto;scrollbar-width:none;
    }
    .sidebar::-webkit-scrollbar{display:none}
    .sidebar-header{
        padding:20px 16px;
        border-bottom:1px solid rgba(255,255,255,.1);
        display:flex;align-items:center;gap:10px;
    }
    .sidebar-header__logo{
        width:36px;height:36px;border-radius:var(--radius-md);
        background:rgba(255,255,255,.15);
        display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .sidebar-header__logo svg{width:18px;height:18px;color:#fff}
    .sidebar-header__text{overflow:hidden}
    .sidebar-header__brand{font-size:16px;font-weight:800;color:#fff}
    .sidebar-header__sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}

    .nav-section{padding:16px 10px 0}
    .nav-section__label{
        font-size:10px;font-weight:700;color:rgba(255,255,255,.4);
        text-transform:uppercase;letter-spacing:.8px;
        padding:0 8px;margin-bottom:6px;
    }
    .nav-item{
        display:flex;align-items:center;gap:10px;
        padding:10px 10px;border-radius:var(--radius-md);
        color:rgba(255,255,255,.65);font-size:13px;font-weight:500;
        margin-bottom:2px;cursor:pointer;transition:all var(--tr);
        position:relative;
    }
    .nav-item:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
    .nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
    .nav-item.active::before{
        content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
        width:3px;height:20px;border-radius:0 2px 2px 0;background:#fff;
    }
    .nav-item svg{width:17px;height:17px;flex-shrink:0}
    .nav-badge{
        margin-left:auto;min-width:18px;height:18px;border-radius:9px;
        background:var(--danger);color:#fff;font-size:10px;font-weight:700;
        padding:0 4px;display:flex;align-items:center;justify-content:center;
    }
    .sidebar-footer{
        margin-top:auto;padding:14px 10px;
        border-top:1px solid rgba(255,255,255,.1);
    }
    .sidebar-user{
        display:flex;align-items:center;gap:10px;padding:8px;
        border-radius:var(--radius-md);cursor:pointer;
        transition:background var(--tr);
    }
    .sidebar-user:hover{background:rgba(255,255,255,.1)}
    .sidebar-user__avatar{
        width:34px;height:34px;border-radius:50%;overflow:hidden;
        border:2px solid rgba(255,255,255,.2);flex-shrink:0;
    }
    .sidebar-user__avatar img{width:100%;height:100%;object-fit:cover}
    .sidebar-user__name{font-size:13px;font-weight:600;color:#fff}
    .sidebar-user__role{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}

    /* Main content */
    .main{
        margin-left:var(--sidebar);flex:1;
        display:flex;flex-direction:column;min-height:100vh;
    }

    /* Top bar */
    .topbar{
        background:var(--surface);
        padding:14px 24px;
        display:flex;align-items:center;justify-content:space-between;
        border-bottom:1px solid var(--border-light);
        position:sticky;top:0;z-index:20;
    }
    .topbar__title{font-size:18px;font-weight:800}
    .topbar__right{display:flex;align-items:center;gap:12px}
    .topbar-btn{
        width:36px;height:36px;border-radius:var(--radius-md);
        background:var(--bg);
        display:flex;align-items:center;justify-content:center;
        transition:background var(--tr);position:relative;
    }
    .topbar-btn:hover{background:var(--border-light)}
    .topbar-btn svg{width:18px;height:18px;color:var(--text-secondary)}
    .topbar-notif{
        position:absolute;top:6px;right:6px;
        width:8px;height:8px;border-radius:50%;
        background:var(--danger);border:1.5px solid var(--surface);
    }

    /* Content area */
    .content{padding:24px}
    </style>
</head>
</html>
