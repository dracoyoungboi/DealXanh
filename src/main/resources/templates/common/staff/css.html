<!DOCTYPE html>
<html><body>
<div th:fragment="css" th:remove="tag">
<style>
:root{--primary:#0d5c2e;--primary-dark:#08421f;--primary-light:#1a7c40;--accent:#d4af37;--surface:#fff;--bg:#f5f6f8;--text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;--border:#e0e0e0;--border-light:#f0f0f0;--shadow-sm:0 2px 8px rgba(0,0,0,.07);--shadow-md:0 4px 20px rgba(0,0,0,.12);--danger:#ef4444;--warning:#f59e0b;--success:#10b981;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:20px;--radius-full:9999px;--font:'Inter',-apple-system,sans-serif;--tr:200ms ease-out;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text-primary);padding-bottom:80px}
button{cursor:pointer;border:none;background:none;font-family:inherit}
img{display:block;max-width:100%}

/* Header */
.emp-header{background:var(--primary);padding:calc(var(--safe-top) + 16px) 16px 20px;position:relative;overflow:hidden}
.emp-header::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.1) 0%,transparent 50%)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:relative;z-index:1}
.emp-greeting{display:flex;align-items:center;gap:10px}
.emp-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.3);flex-shrink:0;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:700}
.emp-avatar img{width:100%;height:100%;object-fit:cover}
.emp-name{font-size:14px;font-weight:700;color:#fff}
.emp-role{font-size:11px;color:rgba(255,255,255,.65);margin-top:1px}
.header-actions{display:flex;gap:8px}
.hdr-btn{width:38px;height:38px;border-radius:var(--radius-md);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff;transition:background var(--tr);text-decoration:none}
.hdr-btn:hover{background:rgba(255,255,255,.2)}
.hdr-btn svg{width:18px;height:18px}

/* Slot strip */
.slot-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:1}
.slot-strip::-webkit-scrollbar{display:none}
.slot-pill{flex-shrink:0;padding:8px 14px;border-radius:var(--radius-full);border:1.5px solid rgba(255,255,255,.2);font-size:12px;font-weight:600;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px;transition:all var(--tr);cursor:pointer;white-space:nowrap}
.slot-pill.active{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);color:#fff}
.slot-pill.urgent{border-color:rgba(239,68,68,.5);color:#fca5a5;animation:urgentPulse 1.5s ease-in-out infinite}
@keyframes urgentPulse{0%,100%{background:rgba(239,68,68,.15)}50%{background:rgba(239,68,68,.25)}}
.slot-pill-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}

/* Bottom nav */
.emp-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border-light);display:grid;grid-template-columns:repeat(4,1fr);height:calc(60px + var(--safe-bot));padding-bottom:var(--safe-bot)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-tertiary);font-size:10px;font-weight:500;transition:color var(--tr);text-decoration:none}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:22px;height:22px}
.nav-scan-wrap{display:flex;align-items:center;justify-content:center}
.nav-scan-circle{width:52px;height:52px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(13,92,46,.4);margin-bottom:16px;transition:all var(--tr)}
.nav-scan-circle:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(13,92,46,.5)}
.nav-scan-circle svg{width:24px;height:24px;color:#fff}
.nav-badge{position:absolute;top:8px;right:calc(50% - 16px);width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style>
</div>
</body></html>
