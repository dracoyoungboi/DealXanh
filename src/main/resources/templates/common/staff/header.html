<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="header">
<header class="emp-header">
  <div class="header-top">
    <a class="emp-greeting" th:href="@{/staff/profile}" style="text-decoration:none;cursor:pointer;">
      <div class="emp-avatar">
        <img th:if="${user.avatarUrl != null}" th:src="${user.avatarUrl}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <span th:unless="${user.avatarUrl != null}" th:text="${user.fullName != null ? user.fullName.charAt(0) : 'N'}">N</span>
      </div>
      <div>
        <div class="emp-name" th:text="${user.fullName != null ? user.fullName : user.username}">Nhân viên</div>
        <div class="emp-role" th:text="'Nhân viên · ' + ${store.storeName}">Nhân viên · Cửa hàng</div>
      </div>
    </a>
    <div class="header-actions">
      <a class="hdr-btn" th:href="@{/staff/dashboard}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <a class="hdr-btn" th:href="@{/logout}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
    </div>
  </div>
  <!-- Slot filter: chỉ hiển thị ở dashboard -->
  <div class="slot-strip" th:if="${activePage == 'dashboard'}">
    <th:block th:each="slot, iterStat : ${pickupSlots}">
      <div class="slot-pill" th:classappend="${activeSlot != null ? (activeSlot == slot.trim() ? 'active' : '') : (iterStat.index == 0 ? 'active' : '')}"
           style="cursor:pointer;">
        <span class="slot-pill-dot"></span><span th:text="${slot.trim()}">17:00–18:00</span>
      </div>
    </th:block>
  </div>
</header>
</body>
</html>
