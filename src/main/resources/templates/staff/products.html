<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sản phẩm — Nhân viên DealXanh</title>
<div th:replace="~{common/staff/css :: css}"></div>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.content{padding:14px}
.alert{padding:10px 14px;border-radius:var(--radius-md);margin-bottom:12px;font-size:13px;font-weight:600}
.alert.success{background:rgba(16,185,129,.1);color:var(--success)}.alert.error{background:rgba(239,68,68,.1);color:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;border:none}
.btn-primary{background:var(--primary);color:#fff}
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi-card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:14px;text-align:center}
.kpi-val{font-size:22px;font-weight:800}.kpi-lbl{font-size:11px;color:var(--text-tertiary);margin-top:2px}

.filter-row{display:flex;gap:8px;margin-bottom:14px}
.filter-input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-family:var(--font);background:var(--surface)}
.filter-input:focus{outline:none;border-color:var(--primary)}
.filter-select{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-family:var(--font);background:var(--surface)}

.product-list{display:flex;flex-direction:column;gap:10px}
.product-row{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:14px;display:flex;gap:12px;align-items:center}
.product-img{width:56px;height:56px;border-radius:var(--radius-md);object-fit:cover;flex-shrink:0;background:var(--bg)}
.product-info{flex:1;min-width:0}
.product-name{font-size:14px;font-weight:700;margin-bottom:3px}
.product-meta{font-size:12px;color:var(--text-secondary);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.product-price{font-size:16px;font-weight:800;color:var(--primary);text-align:right;flex-shrink:0}

.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--radius-full)}
.badge-success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.badge-warning{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.badge-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}

.stock-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.stock-dot.in{background:var(--success)}.stock-dot.out{background:var(--danger)}

.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px}
.page-link{padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-weight:600;text-decoration:none;color:var(--text-primary);background:var(--surface)}
.page-info{padding:8px 14px;font-size:13px;color:var(--text-secondary)}

.empty-state{text-align:center;padding:60px 20px}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:0.2}
.empty-state h3{font-size:18px;font-weight:700;margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--text-secondary)}
</style>
</head>
<body>

<div th:replace="~{common/staff/header :: header}"></div>

<div class="content">
  <div th:if="${success}" class="alert success" th:text="${success}"></div>
  <div th:if="${error}" class="alert error" th:text="${error}"></div>

  <!-- KPI -->
  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-val" style="color:var(--primary)" th:text="${totalProducts}">0</div><div class="kpi-lbl">Tổng sản phẩm</div></div>
    <div class="kpi-card"><div class="kpi-val" style="color:var(--success)" th:text="${products != null ? #lists.size(products) : 0}">0</div><div class="kpi-lbl">Đang hiển thị</div></div>
  </div>

  <!-- Actions -->
  <div style="display:flex;gap:8px;margin-bottom:14px;">
    <a href="/staff/products/create" class="btn btn-primary" style="flex:1;text-align:center;justify-content:center;">+ Thêm sản phẩm</a>
  </div>

  <!-- Filter -->
  <form method="get" th:action="@{/staff/products}" class="filter-row">
    <input type="text" name="search" class="filter-input" placeholder="Tìm sản phẩm..." th:value="${searchQuery}" oninput="debounceSearch()">
    <select name="categoryId" class="filter-select" onchange="this.form.submit()">
      <option value="">Tất cả DM</option>
      <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.name}" th:selected="${selectedCategory != null && selectedCategory.toString() == cat.categoryId.toString()}"></option>
    </select>
  </form>

  <!-- Product list -->
  <div class="product-list" th:if="${products != null and !products.isEmpty()}">
<div class="product-row" th:each="product : ${products}" style="cursor:pointer;" th:onclick="|viewProductDetail(${product.productId})|">
      <img th:src="${product.imageUrl != null ? product.imageUrl : '/img/default-product.svg'}" class="product-img" onerror="this.src='/img/default-product.svg'">
      <div class="product-info">
        <div class="product-name" th:text="${product.name}">Name</div>
        <div class="product-meta">
          <span th:if="${product.category != null}" th:text="${product.category.name}">Category</span>
          <span class="stock-dot" th:class="${product.stockQuantity > 0 ? 'in' : 'out'}"></span>
          <span th:text="${product.stockQuantity > 0 ? 'Còn ' + product.stockQuantity : 'Hết hàng'}" th:style="${product.stockQuantity > 0 ? 'color:var(--success)' : 'color:var(--danger)'}">Stock</span>
          <span class="badge" th:classappend="${product.approvalStatus == 'APPROVED'} ? 'badge-success' : (${product.approvalStatus == 'PENDING'} ? 'badge-warning' : 'badge-danger')" th:text="${product.approvalStatus == 'APPROVED' ? 'Đã duyệt' : product.approvalStatus == 'PENDING' ? 'Chờ duyệt' : 'Từ chối'}">Status</span>
          <span th:if="${dealProductMap != null and dealProductMap.containsKey(product.productId)}" style="font-size:10px;font-weight:600;color:var(--danger);background:rgba(220,38,38,.08);padding:1px 5px;border-radius:4px;" th:text="${dealProductMap[product.productId].dealName}">Deal</span>
        </div>
      </div>
      <div class="product-price">
        <span th:if="${dealProductMap != null and dealProductMap.containsKey(product.productId)}" style="font-weight:700;color:var(--danger);" th:text="${#numbers.formatDecimal(dealProductMap[product.productId].finalPrice, 0, 0) + 'đ'}">0đ</span>
        <span th:if="${dealProductMap == null or !dealProductMap.containsKey(product.productId)}" th:text="${#numbers.formatDecimal(product.originalPrice, 0, 0) + 'đ'}">0đ</span>
        <span th:if="${dealProductMap != null and dealProductMap.containsKey(product.productId)}" style="font-size:11px;color:var(--text-tertiary);text-decoration:line-through;display:block;" th:text="${#numbers.formatDecimal(product.originalPrice, 0, 0) + 'đ'}">0đ</span>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination" th:if="${totalPages > 1}">
    <a class="page-link" th:if="${hasPrevious}" th:href="@{/staff/products(page=${currentPage - 1}, search=${searchQuery}, categoryId=${selectedCategory})}">← Trước</a>
    <span class="page-info" th:text="|${currentPage + 1} / ${totalPages}|">1/1</span>
    <a class="page-link" th:if="${hasNext}" th:href="@{/staff/products(page=${currentPage + 1}, search=${searchQuery}, categoryId=${selectedCategory})}">Sau →</a>
  </div>

  <div class="empty-state" th:unless="${products != null and !products.isEmpty()}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    <h3>Chưa có sản phẩm nào</h3>
    <p>Cửa hàng chưa có sản phẩm để hiển thị</p>
  </div>
</div>

<div th:replace="~{common/staff/bottom-nav :: bottom-nav}"></div>

<!-- Detail Modal -->
<div class="modal-overlay" id="productDetailModal" style="display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5);overflow-y:auto;">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;">
    <div style="background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:450px;max-height:85vh;overflow-y:auto;padding:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span style="font-size:16px;font-weight:700;">Chi tiết sản phẩm</span>
        <button onclick="closeProductDetail()" style="width:32px;height:32px;border-radius:8px;background:var(--bg);border:none;cursor:pointer;font-size:16px;">✕</button>
      </div>
      <div id="detailBody">Đang tải...</div>
      <form id="toggleForm" method="post" th:action="@{/staff/products/__pid__/toggle}" style="display:none;margin-top:10px;">
        <input type="hidden" name="_csrf" th:value="${_csrf?.token}">
        <button type="submit" style="width:100%;padding:10px;background:var(--warning);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">⏸ Ngừng bán</button>
      </form>
    </div>
  </div>
</div>

<script>
let searchTimer;
function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { document.forms[0].submit(); }, 300);
}

async function viewProductDetail(id) {
  const m = document.getElementById('productDetailModal');
  const b = document.getElementById('detailBody');
  m.style.display = 'block';
  var tf = document.getElementById('toggleForm');
  if (tf) { tf.style.display = 'block'; tf.action = '/staff/products/' + id + '/toggle'; }
  b.innerHTML = '<div style="text-align:center;padding:30px;">Đang tải...</div>';
  try {
    const r = await fetch('/staff/api/products/' + id + '/detail');
    const d = await r.json();
    if (!d.success) {
      b.innerHTML = '<div style="text-align:center;color:var(--danger);">' + (d.message || 'Lỗi') + '</div>';
      return;
    }
    const statusColors = { 'APPROVED': 'var(--success)', 'PENDING': 'var(--warning)', 'REJECTED': 'var(--danger)' };
    const statusLabels = { 'APPROVED': 'Đã duyệt', 'PENDING': 'Chờ duyệt', 'REJECTED': 'Từ chối' };
    b.innerHTML =
      '<div style="text-align:center;margin-bottom:12px;">' +
        '<img src="' + (d.imageUrl || '/img/default-product.svg') + '" style="width:100%;max-height:300px;object-fit:contain;border-radius:var(--radius-md);background:#fafafa;" onerror="this.src=\'/img/default-product.svg\'">' +
        '<h3 style="margin-top:8px;">' + d.name + '</h3>' +
        (d.description ? '<p style="font-size:13px;color:var(--text-secondary);">' + d.description + '</p>' : '') +
      '</div>' +
      '<div style="text-align:center;margin-bottom:12px;">' +
        '<span style="font-size:24px;font-weight:800;color:' + (d.finalPrice < d.originalPrice ? 'var(--danger)' : 'var(--primary)') + ';">' + (d.finalPrice || d.originalPrice || 0).toLocaleString('vi-VN') + 'đ</span>' +
        (d.finalPrice < d.originalPrice ? '<span style="font-size:14px;color:var(--text-tertiary);text-decoration:line-through;margin-left:8px;">' + (d.originalPrice||0).toLocaleString('vi-VN') + 'đ</span>' : '') +
      '</div>' +
      '<div style="font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;">' +
        '<div>Tồn kho: <b>' + (d.stockQuantity || 0) + '</b></div>' +
        '<div>Danh mục: <b>' + (d.categoryName || 'Chưa có') + '</b></div>' +
        '<div>HSD: <b>' + (d.expiryDate ? new Date(d.expiryDate).toLocaleDateString('vi-VN') : 'Không có') + '</b></div>' +
        '<div>Loại: <b>' + (d.productType === 'COMBO' ? 'Combo' : 'Thường') + '</b></div>' +
        '<div>Duyệt: <b style="color:' + (statusColors[d.approvalStatus] || 'var(--text-secondary)') + '">' + (statusLabels[d.approvalStatus] || d.approvalStatus) + '</b></div>' +
        '<div>Người tạo: <b>' + (d.createdByName || 'N/A') + '</b></div>' +
      '</div>' +
      (d.rejectionReason ? '<div style="font-size:12px;padding:8px 12px;background:#fef2f2;border-radius:var(--radius-sm);color:var(--danger);margin-bottom:8px;"><b>Lý do từ chối:</b> ' + d.rejectionReason + '</div>' : '') +
      (d.storeDeals && d.storeDeals.length > 0 ?
        '<div style="margin-top:8px;padding:10px 12px;background:rgba(13,92,46,.04);border-radius:8px;border:1px solid rgba(13,92,46,.1);">' +
          '<div style="font-size:11px;font-weight:700;color:var(--primary);margin-bottom:6px;">🏪 Deal của shop (tự động áp)</div>' +
          d.storeDeals.map(function(sd) {
            return '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);padding:2px 0;">' +
              '<span>' + sd.dealName + '</span>' +
              '<span style="font-weight:600;color:var(--danger);">' + (sd.salePrice||0).toLocaleString('vi-VN') + 'đ</span>' +
            '</div>';
          }).join('') +
        '</div>' : '') +
      (d.platformDeals && d.platformDeals.length > 0 ?
        '<div style="margin-top:6px;padding:10px 12px;background:rgba(139,92,246,.04);border-radius:8px;border:1px solid rgba(139,92,246,.1);">' +
          '<div style="font-size:11px;font-weight:700;color:#8b5cf6;margin-bottom:6px;">🌐 Deal toàn sàn (tự động áp)</div>' +
          d.platformDeals.map(function(pd) {
            return '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);padding:2px 0;">' +
              '<span>' + pd.dealName + ' (' + pd.discountType + ' ' + pd.discountValue + ')</span>' +
              '<span style="font-weight:600;color:var(--danger);">-' + (pd.discountAmount||0).toLocaleString('vi-VN') + 'đ</span>' +
            '</div>';
          }).join('') +
        '</div>' : '') +
      '<div style="font-size:11px;color:var(--text-tertiary);text-align:center;">Tạo lúc: ' + (d.createdAt ? new Date(d.createdAt).toLocaleString('vi-VN') : 'N/A') + '</div>';
  } catch(e) {
    b.innerHTML = '<div style="text-align:center;color:var(--danger);">Không thể tải</div>';
  }
}

function closeProductDetail() {
  document.getElementById('productDetailModal').style.display = 'none';
  document.getElementById('toggleForm').style.display = 'none';
}
</script>
</body>
</html>
