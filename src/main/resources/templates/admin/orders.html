<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - Admin DealXanh</title>
    <!-- CSRF Token for form submissions -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
:root{
    --primary:#0d5c2e;--primary-dark:#08421f;--primary-light:#1a7c40;
    --accent:#d4af37;
    --surface:#fff;--bg:#f0f2f5;
    --text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;
    --border:#e0e0e0;--border-light:#f0f0f0;
    --shadow-sm:0 2px 8px rgba(0,0,0,.07);--shadow-md:0 4px 16px rgba(0,0,0,.1);
    --danger:#ef4444;--danger-bg:rgba(239,68,68,.1);
    --warning:#f59e0b;--warning-bg:rgba(245,158,11,.1);
    --success:#10b981;--success-bg:rgba(16,185,129,.1);
    --info:#3b82f6;--info-bg:rgba(59,130,246,.1);
    --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:20px;--radius-full:9999px;
    --font:'Inter',-apple-system,sans-serif;--tr:200ms ease-out;
    --sidebar:240px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text-primary);height:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}

/* Layout */
.layout{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{
    width:var(--sidebar);flex-shrink:0;
    background:var(--primary);
    display:flex;flex-direction:column;
    position:fixed;top:0;bottom:0;left:0;z-index:30;
    overflow-y:auto;scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{display:none}
.sidebar-header{
    padding:20px 16px;
    border-bottom:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;gap:10px;
    transition:background var(--tr);
}
.sidebar-header:hover{background:rgba(255,255,255,.05);}
.sidebar-header__logo{
    width:36px;height:36px;border-radius:var(--radius-md);
    background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sidebar-header__logo svg{width:18px;height:18px;color:#fff}
.sidebar-header__text{overflow:hidden}
.sidebar-header__brand{font-size:16px;font-weight:800;color:#fff}
.sidebar-header__sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}

.nav-section{padding:16px 10px 0}
.nav-section__label{
    font-size:10px;font-weight:700;color:rgba(255,255,255,.4);
    text-transform:uppercase;letter-spacing:.8px;
    padding:0 8px;margin-bottom:6px;
}
.nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;border-radius:var(--radius-md);
    color:rgba(255,255,255,.65);font-size:13px;font-weight:500;
    margin-bottom:2px;cursor:pointer;transition:all var(--tr);
    position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.nav-item.active::before{
    content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:0 2px 2px 0;background:#fff;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-badge{
    margin-left:auto;min-width:18px;height:18px;border-radius:9px;
    background:var(--danger);color:#fff;font-size:10px;font-weight:700;
    padding:0 4px;display:flex;align-items:center;justify-content:center;
}
.sidebar-footer{
    margin-top:auto;padding:14px 10px;
    border-top:1px solid rgba(255,255,255,.1);
}
.sidebar-user{
    display:flex;align-items:center;gap:10px;padding:8px;
    border-radius:var(--radius-md);cursor:pointer;
    transition:background var(--tr);
}
.sidebar-user:hover{background:rgba(255,255,255,.1)}
.sidebar-user__avatar{
    width:34px;height:34px;border-radius:50%;overflow:hidden;
    border:2px solid rgba(255,255,255,.2);flex-shrink:0;
}
.sidebar-user__avatar img{width:100%;height:100%;object-fit:cover}
.sidebar-user__name{font-size:13px;font-weight:600;color:#fff}
.sidebar-user__role{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}

/* Main content */
.main{
    margin-left:var(--sidebar);flex:1;
    display:flex;flex-direction:column;min-height:100vh;
}

/* Top bar */
.topbar{
    background:var(--surface);
    padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--border-light);
    position:sticky;top:0;z-index:20;
}
.topbar__title{font-size:18px;font-weight:800}
.topbar__right{display:flex;align-items:center;gap:12px}
.topbar-btn{
    width:36px;height:36px;border-radius:var(--radius-md);
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    transition:background var(--tr);position:relative;
}
.topbar-btn:hover{background:var(--border-light)}
.topbar-btn svg{width:18px;height:18px;color:var(--text-secondary)}

/* Content area */
.content{padding:24px}

/* Filter/search bar */
.filter-bar{display:flex;gap:10px;margin-bottom:24px;align-items:center;}
.search-wrap{position:relative;flex:1}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);pointer-events:none}
.search-icon svg{width:16px;height:16px}
.search-input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:14px;background:var(--surface);transition:border-color var(--tr);}
.search-input:focus{outline:none;border-color:var(--primary)}
.filter-select{padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-weight:600;background:var(--surface);cursor:pointer;}
.filter-select:focus{outline:none;border-color:var(--primary)}

/* Store cards grid */
.stores-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:24px;}
.store-card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:20px;cursor:pointer;transition:all var(--tr);position:relative;}
.store-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--primary);}
.store-card__header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.store-card__logo{width:48px;height:48px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-light);background:var(--bg);flex-shrink:0;}
.store-card__logo img{width:100%;height:100%;object-fit:cover}
.store-card__info{flex:1;min-width:0;}
.store-card__name{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:2px;}
.store-card__location{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;}
.store-card__location svg{width:12px;height:12px;flex-shrink:0;}

/* Stats in card */
.store-card__stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.store-card__stat{background:var(--bg);padding:12px;border-radius:var(--radius-md);}
.store-card__stat-label{font-size:11px;color:var(--text-secondary);margin-bottom:4px;}
.store-card__stat-value{font-size:18px;font-weight:700;color:var(--text-primary);}
.store-card__stat-value.revenue{color:var(--primary);}
.store-card__stat-value.orders{color:var(--info);}
.store-card__stat-value.pending{color:var(--warning);}

/* Pending badge */
.store-card__pending{position:absolute;top:16px;right:16px;background:var(--warning-bg);color:var(--warning);padding:4px 8px;border-radius:var(--radius-full);font-size:11px;font-weight:700;display:none;align-items:center;gap:4px;}
.store-card__pending.show{display:flex;}
.store-card__pending svg{width:12px;height:12px;}

/* Pagination */
.pagination{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-top:1px solid var(--border-light);margin-top:16px;}
.pagination-info{font-size:13px;color:var(--text-secondary)}
.pagination-controls{display:flex;align-items:center;gap:8px}
.pagination-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-primary);cursor:pointer;transition:all var(--tr);}
.pagination-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.pagination-btn:disabled{opacity:0.5;cursor:not-allowed}
.pagination-pages{display:flex;gap:4px}
.pagination-page{min-width:36px;height:36px;padding:0 8px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-primary);cursor:pointer;transition:all var(--tr);}
.pagination-page:hover{border-color:var(--primary);color:var(--primary)}
.pagination-page.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Empty state */
.empty-state{text-align:center;padding:80px 20px;color:var(--text-secondary);}
.empty-state svg{width:80px;height:80px;margin-bottom:16px;opacity:0.3}
.empty-state h3{font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text-primary)}

/* Modal */
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,.5);padding:20px;box-sizing:border-box;overflow-y:auto;}
.modal.active{display:flex;align-items:center;justify-content:center;}
.modal-content{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:900px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-md);}
.modal-header{padding:20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;background:var(--bg);}
.modal-header__title{font-size:18px;font-weight:800;}
.modal-header__close{width:32px;height:32px;border-radius:var(--radius-md);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--tr);}
.modal-header__close:hover{background:var(--border-light);}
.modal-header__close svg{width:18px;height:18px;color:var(--text-secondary);}

/* Modal body */
.modal-body{padding:20px;overflow-y:auto;flex:1;}
.modal__store-info{display:flex;align-items:center;gap:12px;padding:16px;background:var(--bg);border-radius:var(--radius-md);margin-bottom:20px;}
.modal__store-logo{width:48px;height:48px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-light);}
.modal__store-logo img{width:100%;height:100%;object-fit:cover}
.modal__store-details h3{font-size:16px;font-weight:700;margin-bottom:4px;}
.modal__store-details p{font-size:13px;color:var(--text-secondary);}

/* Orders filter in modal */
.orders-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-btn{padding:8px 16px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text-secondary);transition:all var(--tr);}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Orders list */
.orders-list{display:flex;flex-direction:column;gap:12px;}
.order-item{border:1px solid var(--border-light);border-radius:var(--radius-md);padding:16px;background:var(--bg);cursor:pointer;transition:all var(--tr);}
.order-item:hover{border-color:var(--primary);background:rgba(13,92,46,.02);}
.order-item__header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;}
.order-item__id{font-size:14px;font-weight:700;color:var(--text-primary);}
.order-item__status{padding:4px 10px;border-radius:var(--radius-full);font-size:11px;font-weight:700;text-transform:uppercase;}
.order-item__status.PENDING{background:var(--warning-bg);color:var(--warning);}
.order-item__status.CONFIRMED{background:var(--info-bg);color:var(--info);}
.order-item__status.READY_FOR_PICKUP{background:var(--primary-light);color:var(--primary);}
.order-item__status.COMPLETED{background:var(--success-bg);color:var(--success);}
.order-item__status.CANCELLED{background:var(--danger-bg);color:var(--danger);}

.order-item__customer{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.order-item__customer svg{width:14px;height:14px;color:var(--text-secondary);flex-shrink:0;}
.order-item__customer-name{font-size:13px;font-weight:600;}
.order-item__customer-contact{font-size:12px;color:var(--text-secondary);}

.order-item__details{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light);}
.order-item__detail{font-size:12px;}
.order-item__detail-label{color:var(--text-secondary);}
.order-item__detail-value{font-weight:600;color:var(--text-primary);}

.order-item__total{text-align:right;margin-top:12px;}
.order-item__total-label{font-size:12px;color:var(--text-secondary);}
.order-item__total-amount{font-size:18px;font-weight:700;color:var(--primary);}

/* Order detail expansion */
.order-item__products{display:none;margin-top:12px;padding:12px;background:var(--surface);border-radius:var(--radius-md);}
.order-item__products.show{display:block;}
.product-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);}
.product-item:last-child{border-bottom:none;}
.product-item__info{flex:1;}
.product-item__name{font-size:13px;font-weight:600;margin-bottom:2px;}
.product-item__qty{font-size:12px;color:var(--text-secondary);}
.product-item__price{font-size:14px;font-weight:700;color:var(--text-primary);}

/* Loading state */
.loading-state{text-align:center;padding:40px;color:var(--text-secondary);}
.loading-spinner{width:40px;height:40px;border:3px solid var(--border-light);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div class="layout">
    <!-- Include sidebar from common fragment -->
    <div th:replace="~{common/admin/sidebar :: sidebar('orders')}"></div>

    <div class="main">
        <!-- Include header from common fragment -->
        <div th:replace="~{common/admin/header :: header('Quản lý Đơn hàng', false)}"></div>

        <div class="content">
            <!-- Filter bar -->
            <form id="filterForm" method="get" action="/admin/orders">
                <div class="filter-bar">
                    <div class="search-wrap">
                        <span class="search-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                        </span>
                        <input type="text" name="search" class="search-input" placeholder="Tìm theo tên cửa hàng..." th:value="${searchQuery}">
                    </div>
                    <select name="city" class="filter-select" onchange="document.getElementById('filterForm').submit();">
                        <option value="">Tất cả thành phố</option>
                        <option th:each="city : ${cities}" th:value="${city}" th:text="${city}" th:selected="${city == selectedCity}">City</option>
                    </select>
                </div>
            </form>

            <!-- Stores grid -->
            <div class="stores-grid" th:if="${stores != null and !stores.isEmpty()}">
                <div class="store-card" th:each="store : ${stores}" th:onclick="'viewStoreOrders(' + ${store.storeId} + ')'">
                    <!-- Pending badge -->
                    <div class="store-card__pending" th:classappend="${store.pendingOrders > 0 ? 'show' : ''}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <span th:text="${store.pendingOrders}">0</span> chờ xử lý
                    </div>

                    <div class="store-card__header">
                        <div class="store-card__logo">
                            <img th:src="${store.logoUrl != null ? store.logoUrl : '/img/default-store.svg'}" alt="">
                        </div>
                        <div class="store-card__info">
                            <div class="store-card__name" th:text="${store.storeName}">Store Name</div>
                            <div class="store-card__location">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                                    <circle cx="12" cy="10" r="3"/>
                                </svg>
                                <span th:text="${store.district != null ? store.district : 'N/A'}">District</span>
                                <span th:if="${store.city != null}" th:text="'- ' + ${store.city}">City</span>
                            </div>
                        </div>
                    </div>

                    <div class="store-card__stats">
                        <div class="store-card__stat">
                            <div class="store-card__stat-label">Tổng doanh thu</div>
                            <div class="store-card__stat-value revenue" th:text="${#numbers.formatDecimal(store.revenue / 1000000, 1, 1) + 'tr'}">0tr</div>
                        </div>
                        <div class="store-card__stat">
                            <div class="store-card__stat-label">Tổng đơn hàng</div>
                            <div class="store-card__stat-value orders" th:text="${store.totalOrders}">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty state -->
            <div class="empty-state" th:if="${stores == null or stores.isEmpty()}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <path d="M16 10a4 4 0 0 1-8 0"/>
                </svg>
                <h3>Không tìm thấy đơn hàng nào</h3>
                <p>Thử thay đổi bộ lọc để xem kết quả khác</p>
            </div>

            <!-- Pagination -->
            <div class="pagination" th:if="${totalPages > 1}">
                <div class="pagination-info">
                    <span th:text="'Hiển thị ' + (${currentPage} * ${pageSize} + 1) + ' - ' + ${Math.min((currentPage + 1) * pageSize, totalStores)} + ' / ' + ${totalStores} + ' cửa hàng'">Pagination info</span>
                </div>
                <div class="pagination-controls">
                    <button class="pagination-btn" th:disabled="${!hasPrevious}" th:onclick="'goToPage(' + (${currentPage} - 1) + ')'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                            <polyline points="15 18 9 12 15 6"/>
                            <line x1="9" y1="12" x2="21" y2="12"/>
                        </svg>
                        Trước
                    </button>

                    <div class="pagination-pages">
                        <button th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}" th:if="${pageNum < 5 || pageNum > totalPages - 6 || (pageNum >= currentPage - 2 && pageNum <= currentPage + 2)}" class="pagination-page" th:classappend="${pageNum == currentPage} ? 'active' : ''" th:onclick="'goToPage(' + ${pageNum} + ')'" th:text="${pageNum + 1}">1</button>
                    </div>

                    <button class="pagination-btn" th:disabled="${!hasNext}" th:onclick="'goToPage(' + (${currentPage} + 1) + ')'">
                        Tiếp
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                            <polyline points="9 18 15 12 9 6"/>
                            <line x1="9" y1="12" x2="21" y2="12"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Orders Modal -->
<div class="modal" id="ordersModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-header__title" id="modalTitle">Đơn hàng của cửa hàng</div>
            <div class="modal-header__close" onclick="closeModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </div>
        </div>

        <div class="modal-body">
            <div class="modal__store-info" id="modalStoreInfo">
                <!-- Store info will be populated dynamically -->
            </div>

            <div class="orders-filter">
                <button class="filter-btn active" data-status="" onclick="filterOrders('')">Tất cả</button>
                <button class="filter-btn" data-status="PENDING" onclick="filterOrders('PENDING')">Chờ xác nhận</button>
                <button class="filter-btn" data-status="CONFIRMED" onclick="filterOrders('CONFIRMED')">Đã xác nhận</button>
                <button class="filter-btn" data-status="READY_FOR_PICKUP" onclick="filterOrders('READY_FOR_PICKUP')">Sẵn sàng</button>
                <button class="filter-btn" data-status="COMPLETED" onclick="filterOrders('COMPLETED')">Hoàn thành</button>
                <button class="filter-btn" data-status="CANCELLED" onclick="filterOrders('CANCELLED')">Đã hủy</button>
            </div>

            <div id="ordersList" class="orders-list">
                <!-- Orders will be loaded here -->
            </div>
        </div>
    </div>
</div>

<script>
let currentStoreId = null;
let currentStatus = '';
let currentPage = 0;

function buildUrl(page) {
    const urlParams = new URLSearchParams(window.location.search);
    let params = [];

    const search = document.querySelector('.search-input').value;
    const city = urlParams.get('city') || '';

    if (search) params.push('search=' + encodeURIComponent(search));
    if (city) params.push('city=' + encodeURIComponent(city));
    params.push('page=' + page);

    return '/admin/orders?' + params.join('&');
}

function goToPage(page) {
    window.location.href = buildUrl(page);
}

async function viewStoreOrders(storeId) {
    currentStoreId = storeId;
    currentPage = 0;

    // Show modal
    document.getElementById('ordersModal').classList.add('active');
    document.body.style.overflow = 'hidden';

    // Show loading
    document.getElementById('ordersList').innerHTML = `
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <div>Đang tải đơn hàng...</div>
        </div>
    `;

    try {
        // Get store info from the card
        const storeCard = document.querySelector(`.store-card[onclick*="${storeId}"]`);
        const storeName = storeCard.querySelector('.store-card__name').textContent;
        const storeLogo = storeCard.querySelector('.store-card__logo img').src;
        const storeDistrict = storeCard.querySelector('.store-card__location span').textContent;

        // Populate store info
        document.getElementById('modalStoreInfo').innerHTML = `
            <div class="modal__store-logo">
                <img src="${storeLogo}" alt="${storeName}">
            </div>
            <div class="modal__store-details">
                <h3>${storeName}</h3>
                <p>${storeDistrict}</p>
                <input type="hidden" id="storeName" value="${storeName}">
            </div>
        `;

        document.getElementById('modalTitle').textContent = `Đơn hàng của ${storeName}`;

        // Load orders
        const response = await fetch(`/admin/orders/shop/${storeId}?status=${currentStatus}&page=0`);
        const html = await response.text();
        document.getElementById('ordersList').innerHTML = html;
    } catch (error) {
        document.getElementById('ordersList').innerHTML = `
            <div class="empty-state">
                <div>Có lỗi xảy ra khi tải đơn hàng. Vui lòng thử lại.</div>
            </div>
        `;
    }
}

async function filterOrders(status) {
    currentStatus = status;
    currentPage = 0;

    // Update active button
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.status === status) {
            btn.classList.add('active');
        }
    });

    // Reload orders
    if (currentStoreId) {
        try {
            const response = await fetch(`/admin/orders/shop/${currentStoreId}?status=${currentStatus}&page=0`);
            const html = await response.text();
            document.getElementById('ordersList').innerHTML = html;
        } catch (error) {
            console.error('Error loading orders:', error);
        }
    }
}

function closeModal() {
    document.getElementById('ordersModal').classList.remove('active');
    document.body.style.overflow = 'auto';
    currentStoreId = null;
    currentStatus = '';
    currentPage = 0;
}

function toggleOrderProducts(orderId) {
    const productsDiv = document.getElementById(`products-${orderId}`);
    if (productsDiv) {
        productsDiv.classList.toggle('show');
    }
}

// Close modal on escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeModal();
    }
});

// Close modal on backdrop click
document.getElementById('ordersModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeModal();
    }
});
</script>
