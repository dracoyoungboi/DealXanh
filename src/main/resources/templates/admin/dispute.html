<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khiếu nại & Tranh chấp — Admin DealXanh</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <div th:replace="~{common/admin/css :: css}"></div>
    <style>
.content{padding:24px;display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi-card{
    background:var(--surface);border-radius:var(--radius-lg);
    border:1.5px solid var(--border-light);padding:14px;cursor:pointer;transition:all var(--tr);
}
.kpi-card:hover{border-color:var(--border)}
.kpi-card.active{border-color:var(--primary);background:rgba(13,92,46,.02)}
.kpi-card__label{font-size:11px;color:var(--text-secondary);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi-card__label svg{width:14px;height:14px}
.kpi-card__value{font-size:22px;font-weight:800;margin:6px 0 2px}
.kpi-card__sub{font-size:11px;color:var(--text-tertiary)}
.filter-row{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-tertiary);pointer-events:none}
.search-input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;background:var(--surface);transition:border-color var(--tr)}
.search-input:focus{outline:none;border-color:var(--primary)}
.filter-select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:12px;font-weight:600;background:var(--surface);cursor:pointer}
.filter-select:focus{outline:none;border-color:var(--primary)}
.panel{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light)}
.panel__header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-light)}
.panel__title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel__title svg{width:15px;height:15px;color:var(--primary)}
.panel__body{padding:18px}
.dispute-list{display:flex;flex-direction:column;gap:0}
.dispute-item{display:flex;gap:12px;padding:14px;cursor:pointer;border-bottom:1px solid var(--border-light);transition:background var(--tr)}
.dispute-item:last-child{border-bottom:none}
.dispute-item:hover{background:rgba(13,92,46,.02)}
.dispute-item.selected{background:rgba(13,92,46,.06);border-left:3px solid var(--primary)}
.dispute-avatar{width:42px;height:42px;border-radius:var(--radius-md);overflow:hidden;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
.dispute-avatar svg{width:22px;height:22px;color:var(--text-secondary)}
.dispute-info{flex:1;min-width:0}
.dispute-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dispute-user{font-size:13px;font-weight:700}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 12px;border-radius:var(--radius-full);letter-spacing:.2px}
.status-badge--danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.status-badge--warning{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.status-badge--info{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
.status-badge--success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.dispute-time{font-size:11px;color:var(--text-tertiary);margin-left:auto}
.dispute-reason{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.4}
.dispute-preview{font-size:12px;color:var(--text-secondary);line-height:1.4}
.btn-sm{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-md);font-size:13px;font-weight:600;transition:all var(--tr);cursor:pointer;border:none}
.btn-sm--primary{background:var(--primary);color:#fff}
.btn-sm--primary:hover{background:var(--primary-dark)}
.btn-sm--outline{background:var(--surface);color:var(--text-primary);border:1px solid var(--border)}
.btn-sm--outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm--danger{background:var(--danger);color:#fff}
.btn-sm--danger:hover{background:#dc2626}
.detail-card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-light);position:sticky;top:80px}
.detail-empty{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.detail-empty svg{width:48px;height:48px;opacity:0.3;margin-bottom:12px}
.detail-row{margin-bottom:12px}
.detail-row label{display:block;font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;margin-bottom:4px}
.detail-row .value{font-size:14px;font-weight:500;color:var(--text-primary)}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{common/admin/sidebar :: sidebar('dispute')}"></div>
    <div class="main">
        <div th:replace="~{common/admin/header :: header('Khiếu nại & Tranh chấp', false)}"></div>

        <div class="content">
            <!-- Left column -->
            <div>
                <!-- KPI cards -->
                <div class="kpi-row" style="margin-bottom:16px;">
                    <a th:href="@{/admin/dispute}" class="kpi-card" th:classappend="${currentStatus == '' ? 'active' : ''}" style="text-decoration:none;color:inherit;">
                        <div class="kpi-card__label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> Tất cả</div>
                        <div class="kpi-card__value" th:text="${totalDisputes}">0</div>
                        <div class="kpi-card__sub">Tổng khiếu nại</div>
                    </a>
                    <a th:href="@{/admin/dispute(status='PENDING')}" class="kpi-card" th:classappend="${currentStatus == 'PENDING' ? 'active' : ''}" style="text-decoration:none;color:inherit;">
                        <div class="kpi-card__label"><svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Chờ xử lý</div>
                        <div class="kpi-card__value" style="color:var(--danger);" th:text="${totalPending}">0</div>
                        <div class="kpi-card__sub">Cần xử lý ngay</div>
                    </a>
                    <a th:href="@{/admin/dispute(status='REVIEWING')}" class="kpi-card" th:classappend="${currentStatus == 'REVIEWING' ? 'active' : ''}" style="text-decoration:none;color:inherit;">
                        <div class="kpi-card__label"><svg viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Đang xem xét</div>
                        <div class="kpi-card__value" style="color:var(--warning);" th:text="${totalReviewing}">0</div>
                        <div class="kpi-card__sub">Đang điều tra</div>
                    </a>
                    <a th:href="@{/admin/dispute(status='RESOLVED_REFUND')}" class="kpi-card" th:classappend="${currentStatus == 'RESOLVED_REFUND' ? 'active' : ''}" style="text-decoration:none;color:inherit;">
                        <div class="kpi-card__label"><svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Đã hoàn tiền</div>
                        <div class="kpi-card__value" style="color:var(--success);" th:text="${totalResolvedRefund}">0</div>
                        <div class="kpi-card__sub">Đã giải quyết</div>
                    </a>
                </div>

                <!-- Filter bar -->
                <div class="filter-row">
                    <div class="search-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" class="search-input" id="searchInput" th:value="${searchQuery}" placeholder="Tìm kiếm theo tên, lý do...">
                    </div>
                    <select class="filter-select" onchange="window.location.href='/admin/dispute?status=' + this.value">
                        <option value="">Tất cả trạng thái</option>
                        <option value="PENDING" th:selected="${currentStatus == 'PENDING'}">Chờ xử lý</option>
                        <option value="REVIEWING" th:selected="${currentStatus == 'REVIEWING'}">Đang xem xét</option>
                        <option value="RESOLVED_REFUND" th:selected="${currentStatus == 'RESOLVED_REFUND'}">Đã hoàn tiền</option>
                        <option value="RESOLVED_REJECTED" th:selected="${currentStatus == 'RESOLVED_REJECTED'}">Đã từ chối</option>
                    </select>
                </div>

                <!-- Dispute list -->
                <div class="panel">
                    <div class="panel__header">
                        <div class="panel__title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                            Danh sách khiếu nại
                        </div>
                        <span style="font-size:12px;color:var(--text-secondary);" th:text="${disputes != null ? disputes.size() : 0} + ' khiếu nại'">0</span>
                    </div>
                    <div class="panel__body" style="padding:0;">
                        <div class="dispute-list" th:if="${disputes != null and !disputes.isEmpty()}">
                            <div th:each="d, iterStat : ${disputes}" class="dispute-item" th:data-dispute-id="${d.disputeId}"
                                 th:classappend="${iterStat.index == 0} ? 'selected' : ''"
                                 th:onclick="'selectDispute(' + ${d.disputeId} + ', this)'">
                                <div class="dispute-avatar">
                                    <img th:if="${d.complainant != null && d.complainant.avatarUrl != null}" th:src="${d.complainant.avatarUrl}" alt="">
                                    <svg th:unless="${d.complainant != null && d.complainant.avatarUrl != null}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                </div>
                                <div class="dispute-info">
                                    <div class="dispute-top">
                                        <span class="dispute-user" th:text="${d.complainant != null ? (d.complainant.fullName != null ? d.complainant.fullName : d.complainant.username) : 'N/A'}">User</span>
                                        <span class="status-badge"
                                              th:class="${d.status == 'PENDING' ? 'status-badge--danger' : (d.status == 'REVIEWING' ? 'status-badge--warning' : (d.status == 'RESOLVED_REFUND' ? 'status-badge--success' : 'status-badge--info'))}"
                                              th:text="${d.status == 'PENDING' ? 'Chờ XL' : (d.status == 'REVIEWING' ? 'Đang xem xét' : (d.status == 'RESOLVED_REFUND' ? 'Đã hoàn tiền' : 'Đã từ chối'))}">Status</span>
                                        <span class="dispute-time" th:text="${d.createdAt != null ? #temporals.format(d.createdAt, 'dd/MM HH:mm') : ''}">Time</span>
                                    </div>
                                    <div class="dispute-reason" th:text="${d.reason}">Reason</div>
                                    <div class="dispute-preview" th:text="${d.description != null ? (#strings.length(d.description) > 100 ? #strings.substring(d.description, 0, 100) + '...' : d.description) : ''}">Preview</div>
                                </div>
                            </div>
                        </div>
                        <div th:unless="${disputes != null and !disputes.isEmpty()}" style="text-align:center;padding:60px 20px;color:var(--text-secondary);">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;margin-bottom:12px;opacity:0.3;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>
                            <div style="font-size:14px;font-weight:600;">Không có khiếu nại nào</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Detail panel -->
            <div class="detail-card" id="detailPanel">
                <div id="detailEmpty" class="detail-empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <div style="font-weight:600;margin-bottom:4px;">Chọn một khiếu nại</div>
                    <div style="font-size:13px;">Chọn từ danh sách để xem chi tiết</div>
                </div>
                <div id="detailContent" style="display:none;">
                    <div class="panel__header">
                        <div class="panel__title">Chi tiết khiếu nại</div>
                        <span id="detailBadge" class="status-badge">Status</span>
                    </div>
                    <div class="panel__body">
                        <div class="detail-row"><label>Người khiếu nại</label><div class="value" id="detailUser">-</div></div>
                        <div class="detail-row"><label>Email</label><div class="value" id="detailEmail">-</div></div>
                        <div class="detail-row"><label>SĐT</label><div class="value" id="detailPhone">-</div></div>
                        <div class="detail-row"><label>Lý do</label><div class="value" id="detailReason">-</div></div>
                        <div class="detail-row"><label>Mô tả chi tiết</label><div class="value" id="detailDesc" style="line-height:1.6;">-</div></div>
                        <div class="detail-row"><label>Đơn hàng #</label><div class="value" id="detailOrder">-</div></div>
                        <div class="detail-row"><label>Ngày tạo</label><div class="value" id="detailDate">-</div></div>
                        <div class="detail-row" id="adminNoteRow" style="display:none;"><label>Ghi chú Admin</label><div class="value" id="detailNote" style="color:var(--primary);">-</div></div>
                        <div style="display:flex;gap:8px;margin-top:16px;" id="detailActions">
                            <button class="btn-sm btn-sm--primary" id="btnApprove" onclick="resolveDispute('approve')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg> Phê duyệt hoàn tiền
                            </button>
                            <button class="btn-sm btn-sm--danger" id="btnReject" onclick="resolveDispute('reject')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Từ chối
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{common/admin/js :: js}"></div>

<script>
let currentDisputeId = null;

// Real-time search
document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        const status = new URLSearchParams(window.location.search).get('status') || '';
        window.location.href = '/admin/dispute?search=' + encodeURIComponent(this.value) + (status ? '&status=' + status : '');
    }
});

function selectDispute(disputeId, el) {
    currentDisputeId = disputeId;
    document.querySelectorAll('.dispute-item').forEach(i => i.classList.remove('selected'));
    if (el) el.classList.add('selected');

    document.getElementById('detailEmpty').style.display = 'none';
    const content = document.getElementById('detailContent');
    content.style.display = 'block';
    // Show loading state without destroying panel structure
    document.getElementById('detailUser').textContent = '...';
    document.getElementById('detailEmail').textContent = '...';
    document.getElementById('detailPhone').textContent = '...';
    document.getElementById('detailReason').textContent = '...';
    document.getElementById('detailDesc').textContent = 'Đang tải...';
    document.getElementById('detailOrder').textContent = '...';
    document.getElementById('detailDate').textContent = '...';
    document.getElementById('detailBadge').textContent = 'Đang tải...';
    document.getElementById('detailActions').style.display = 'none';
    document.getElementById('adminNoteRow').style.display = 'none';

    fetch('/admin/api/dispute/' + disputeId)
        .then(r => r.json())
        .then(d => {
            if (!d.success) { alert(d.message); return; }
            const data = d.data;

            document.getElementById('detailUser').textContent = data.userName || 'N/A';
            document.getElementById('detailEmail').textContent = data.userEmail || 'N/A';
            document.getElementById('detailPhone').textContent = data.userPhone || 'N/A';
            document.getElementById('detailReason').textContent = data.reason || 'N/A';
            document.getElementById('detailDesc').textContent = data.description || 'N/A';
            document.getElementById('detailOrder').textContent = data.orderId ? '#' + data.orderId + ' (' + (data.orderAmount || 0).toLocaleString() + 'đ)' : 'N/A';
            document.getElementById('detailDate').textContent = data.createdAt ? new Date(data.createdAt).toLocaleString('vi-VN') : 'N/A';

            const statusLabels = {'PENDING':'Chờ xử lý','REVIEWING':'Đang xem xét','RESOLVED_REFUND':'Đã hoàn tiền','RESOLVED_REJECTED':'Đã từ chối'};
            const badge = document.getElementById('detailBadge');
            badge.textContent = statusLabels[data.status] || data.status;
            badge.className = 'status-badge ' + (data.status === 'PENDING' ? 'status-badge--danger' : data.status === 'REVIEWING' ? 'status-badge--warning' : data.status === 'RESOLVED_REFUND' ? 'status-badge--success' : 'status-badge--info');

            // Admin note
            if (data.adminNote) {
                document.getElementById('adminNoteRow').style.display = 'block';
                document.getElementById('detailNote').textContent = data.adminNote;
            } else {
                document.getElementById('adminNoteRow').style.display = 'none';
            }

            // Action buttons
            const actions = document.getElementById('detailActions');
            if (data.status === 'PENDING' || data.status === 'REVIEWING') {
                actions.style.display = 'flex';
                if (data.status === 'PENDING') {
                    // Add review button
                    actions.innerHTML = `
                        <button class="btn-sm btn-sm--outline" onclick="startReview()" style="color:var(--warning);border-color:var(--warning);">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Bắt đầu xem xét
                        </button>
                        <button class="btn-sm btn-sm--primary" onclick="resolveDispute('approve')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg> Phê duyệt hoàn tiền
                        </button>
                        <button class="btn-sm btn-sm--danger" onclick="resolveDispute('reject')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Từ chối
                        </button>`;
                } else {
                    actions.innerHTML = `
                        <button class="btn-sm btn-sm--primary" onclick="resolveDispute('approve')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg> Phê duyệt hoàn tiền
                        </button>
                        <button class="btn-sm btn-sm--danger" onclick="resolveDispute('reject')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Từ chối
                        </button>`;
                }
            } else {
                actions.style.display = 'none';
            }
        })
        .catch(err => { console.error(err); });
}

function startReview() {
    if (!currentDisputeId) return;
    const csrfToken = document.querySelector('meta[name="_csrf"]');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]');
    const formData = new URLSearchParams();
    if (csrfToken && csrfHeader) formData.append(csrfHeader.getAttribute('content'), csrfToken.getAttribute('content'));

    fetch('/admin/api/dispute/' + currentDisputeId + '/review', {
        method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, body: formData.toString()
    })
    .then(r => r.json())
    .then(d => { alert(d.message); if (d.success) location.reload(); })
    .catch(err => alert('Lỗi: ' + err.message));
}

function resolveDispute(action) {
    if (!currentDisputeId) return;
    const note = prompt(action === 'approve' ? 'Ghi chú phê duyệt (tuỳ chọn):' : 'Lý do từ chối:', '');
    if (note === null) return; // cancelled

    const csrfToken = document.querySelector('meta[name="_csrf"]');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]');
    const formData = new URLSearchParams();
    formData.append('action', action);
    if (note) formData.append('adminNote', note);
    if (csrfToken && csrfHeader) formData.append(csrfHeader.getAttribute('content'), csrfToken.getAttribute('content'));

    fetch('/admin/api/dispute/' + currentDisputeId + '/resolve', {
        method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, body: formData.toString()
    })
    .then(r => r.json())
    .then(d => { alert(d.message); if (d.success) location.reload(); })
    .catch(err => alert('Lỗi: ' + err.message));
}

// Auto-select first dispute
document.addEventListener('DOMContentLoaded', function() {
    const firstItem = document.querySelector('.dispute-item');
    if (firstItem) {
        const id = firstItem.getAttribute('data-dispute-id');
        if (id) selectDispute(parseInt(id), firstItem);
    }
});
</script>
</body>
</html>
