<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sidebar Fragment</title>
</head>
<body>

<!-- Admin Sidebar Fragment -->
<div th:fragment="admin-sidebar">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-header__logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div class="sidebar-header__text">
                <div class="sidebar-header__brand">DealXanh</div>
                <div class="sidebar-header__sub">Admin Portal</div>
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-section__label">Tổng quan</div>
            <a class="nav-item" href="/admin/dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                    <path d="M14 14h7v7h-7z"/>
                </svg>
                Dashboard
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section__label">Quản lý</div>
            <a class="nav-item" href="/admin/users">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Người dùng
            </a>
            <a class="nav-item" href="/admin/seller-verify">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Duyệt Seller
            </a>
            <a class="nav-item" href="/admin/disputes">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                Tranh chấp
            </a>
            <a class="nav-item" href="/admin/finance">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="5" width="20" height="14" rx="2"/>
                    <line x1="2" y1="10" x2="22" y2="10"/>
                </svg>
                Tài chính
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section__label">Cá nhân</div>
            <a class="nav-item" href="/admin/profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Hồ sơ
            </a>
            <a class="nav-item" href="/logout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Đăng xuất
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="/admin/profile" class="sidebar-user" style="text-decoration:none;">
                <div class="sidebar-user__avatar">
                    <img th:src="${adminUser != null && adminUser.avatarUrl != null ? adminUser.avatarUrl : '/img/default-avatar.svg'}" alt="Admin">
                </div>
                <div>
                    <div class="sidebar-user__name" th:text="${adminUser != null ? (adminUser.fullName != null ? adminUser.fullName : adminUser.username) : 'Admin'}">Admin Name</div>
                    <div class="sidebar-user__role" th:text="${adminUser != null && adminUser.role != null ? (adminUser.role.name == 'ROLE_ADMIN' ? 'Quản trị viên' : 'Kiểm duyệt viên') : 'Quản trị viên'}">Quản trị viên</div>
                </div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:rgba(255,255,255,.55);margin-left:auto;">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </a>
        </div>
    </aside>
</div>

<!-- Topbar Fragment -->
<div th:fragment="admin-topbar(title)">
    <header class="topbar">
        <div class="topbar__title" th:text="${title}">Dashboard</div>
        <div class="topbar__right">
            <a href="/admin/profile" class="topbar-btn" style="text-decoration:none;" title="Hồ sơ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </a>
            <button class="topbar-btn" title="Thông báo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
            </button>
        </div>
    </header>
</div>

</body>
</html>
