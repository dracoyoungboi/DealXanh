<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders Table</title>
</head>
<body th:fragment="orders-table">
<!-- Store info populated by parent modal -->

<div th:if="${orders != null and !orders.isEmpty()}">
    <div class="orders-list">
        <div class="order-item" th:each="order : ${orders}">
            <div class="order-item__header">
                <div class="order-item__id">
                    Đơn hàng #<span th:text="${order.orderId}">ID</span>
                </div>
                <div class="order-item__status" th:classappend="${order.status}" th:text="${order.status == 'PENDING' ? 'Chờ xác nhận' : order.status == 'CONFIRMED' ? 'Đã xác nhận' : order.status == 'READY_FOR_PICKUP' ? 'Sẵn sàng' : order.status == 'COMPLETED' ? 'Hoàn thành' : 'Đã hủy'}">Status</div>
            </div>

            <div class="order-item__customer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <div class="order-item__customer-name" th:text="${order.user != null ? (order.user.fullName != null ? order.user.fullName : order.user.username) : 'N/A'}">Customer Name</div>
                <div class="order-item__customer-contact" th:if="${order.user != null and order.user.phone != null}" th:text="'- ' + ${order.user.phone}">Phone</div>
            </div>

            <div class="order-item__details">
                <div class="order-item__detail">
                    <div class="order-item__detail-label">Người nhận</div>
                    <div class="order-item__detail-value" th:text="${order.user != null ? (order.user.fullName != null ? order.user.fullName : order.user.username) : 'N/A'}">N/A</div>
                </div>
                <div class="order-item__detail">
                    <div class="order-item__detail-label">Email</div>
                    <div class="order-item__detail-value" th:text="${order.user != null ? order.user.email : 'N/A'}">N/A</div>
                </div>
                <div class="order-item__detail">
                    <div class="order-item__detail-label">Đặt lúc</div>
                    <div class="order-item__detail-value" th:if="${order.createdAt != null}" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">N/A</div>
                </div>
                <div class="order-item__detail">
                    <div class="order-item__detail-label">Thanh toán</div>
                    <div class="order-item__detail-value" th:classappend="${order.paymentStatus == 'PAID' ? 'success' : 'warning'}" th:text="${order.paymentStatus == 'PAID' ? 'Đã thanh toán' : 'Chưa thanh toán'}">Status</div>
                </div>
            </div>

            <div class="order-item__total">
                <div class="order-item__total-label">Tổng tiền</div>
                <div class="order-item__total-amount" th:text="${#numbers.formatDecimal(order.finalAmount, 0, 0)} + 'đ'">0đ</div>
            </div>

            <!-- Products expansion (toggle) -->
            <div class="order-item__products" th:id="'products-' + ${order.orderId}">
                <div th:if="${order.orderItems != null and !order.orderItems.isEmpty()}">
                    <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text-secondary);">Danh sách sản phẩm:</div>
                    <div class="product-item" th:each="item : ${order.orderItems}">
                        <div class="product-item__info">
                            <div class="product-item__name" th:text="${item.product != null ? item.product.name : 'Sản phẩm'}">Product Name</div>
                            <div class="product-item__qty" th:text="'Số lượng: ' + ${item.quantity}">Quantity</div>
                        </div>
                        <div class="product-item__price" th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 0, 0)} + 'đ'">Price</div>
                    </div>
                </div>

                <div th:if="${order.note != null and !order.note.isEmpty()}" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light);">
                    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">Ghi chú:</div>
                    <div style="font-size:13px;color:var(--text-primary);" th:text="${order.note}">Note</div>
                </div>
            </div>

            <!-- Toggle button -->
            <div style="text-align:center;margin-top:12px;">
                <button class="filter-btn" th:onclick="'toggleOrderProducts(' + ${order.orderId} + ')'">
                    <span th:id="'toggle-text-' + ${order.orderId}">Xem chi tiết sản phẩm</span>
                    <svg style="width:14px;height:14px;margin-left:4px;vertical-align:middle;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${totalPages > 1}">
        <div class="pagination-info">
            <span th:text="'Hiển thị ' + (${currentPage} * ${pageSize} + 1) + ' - ' + ${Math.min((currentPage + 1) * pageSize, totalOrders)} + ' / ' + ${totalOrders} + ' đơn hàng'">Pagination info</span>
        </div>
        <div class="pagination-controls">
            <button class="pagination-btn" th:disabled="${!hasPrevious}" th:onclick="'loadOrdersPage(' + (${currentPage} - 1) + ')'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                    <polyline points="15 18 9 12 15 6"/>
                    <line x1="9" y1="12" x2="21" y2="12"/>
                </svg>
                Trước
            </button>

            <div class="pagination-pages">
                <button th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}" th:if="${pageNum < 5 || pageNum > totalPages - 6 || (pageNum >= currentPage - 2 && pageNum <= currentPage + 2)}" class="pagination-page" th:classappend="${pageNum == currentPage} ? 'active' : ''" th:onclick="'loadOrdersPage(' + ${pageNum} + ')'" th:text="${pageNum + 1}">1</button>
            </div>

            <button class="pagination-btn" th:disabled="${!hasNext}" th:onclick="'loadOrdersPage(' + (${currentPage} + 1) + ')'">
                Tiếp
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                    <polyline points="9 18 15 12 9 6"/>
                    <line x1="9" y1="12" x2="21" y2="12"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<div class="empty-state" th:if="${orders == null or orders.isEmpty()}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
    <h3>Không tìm thấy đơn hàng nào</h3>
    <p>Cửa hàng này chưa có đơn hàng nào.</p>
</div>

<script>
function toggleOrderProducts(orderId) {
    const productsDiv = document.getElementById('products-' + orderId);
    const toggleText = document.getElementById('toggle-text-' + orderId);

    if (productsDiv && toggleText) {
        const isShown = productsDiv.classList.contains('show');
        productsDiv.classList.toggle('show');
        toggleText.textContent = isShown ? 'Xem chi tiết sản phẩm' : 'Ẩn chi tiết sản phẩm';
    }
}

async function loadOrdersPage(page) {
    if (!currentStoreId) return;

    try {
        const response = await fetch(`/admin/orders/shop/${currentStoreId}?status=${currentStatus}&page=${page}`);
        const html = await response.text();
        document.getElementById('ordersList').innerHTML = html;
    } catch (error) {
        console.error('Error loading orders page:', error);
    }
}

// Update modal title with store name
document.addEventListener('DOMContentLoaded', function() {
    const modalTitle = document.getElementById('modalTitle');
    const storeName = document.getElementById('storeName');
    if (modalTitle && storeName) {
        modalTitle.textContent = 'Đơn hàng của ' + storeName.value;
    }
});
</script>
</body>
</html>
