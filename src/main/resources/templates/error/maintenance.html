<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang bảo trì — DealXanh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:#ffffff;
  color:#111827;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  padding:24px 40px;
  border-bottom:1px solid #f3f4f6;
  display:flex;
  align-items:center;
  gap:8px;
}
.logo-mark{
  width:30px;height:30px;
  background:#16a34a;
  border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.logo-mark-fallback{
  display:none;align-items:center;gap:8px;
}
.logo-mark-fallback .logo-mark{display:flex;}
.logo-name{font-size:15px;font-weight:600;color:#111827;letter-spacing:-.2px;}
main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 24px;
}
.content{
  max-width:420px;
  width:100%;
  text-align:center;
}
.status-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  border-radius:100px;
  padding:5px 14px 5px 10px;
  font-size:12px;
  font-weight:500;
  color:#15803d;
  margin-bottom:32px;
}
.dot{
  width:7px;height:7px;
  border-radius:50%;
  background:#22c55e;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
h1{
  font-size:28px;
  font-weight:600;
  color:#111827;
  letter-spacing:-.5px;
  line-height:1.3;
  margin-bottom:14px;
}
.desc{
  font-size:15px;
  color:#6b7280;
  line-height:1.7;
  margin-bottom:36px;
}
.eta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px 20px;
  font-size:13px;
  color:#374151;
  margin-bottom:48px;
}
.eta svg{width:15px;height:15px;stroke:#9ca3af;flex-shrink:0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.eta strong{font-weight:600;color:#111827;}
footer{
  padding:24px 40px;
  border-top:1px solid #f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:12px;
  color:#9ca3af;
}
</style>
<meta http-equiv="refresh" content="60">
</head>
<body>

<header>
  <img src="/img/logo-header.svg" alt="DealXanh" style="height:36px;" onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='flex';">
  <div class="logo-mark-fallback">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="logo-name">DealXanh</span>
  </div>
</header>

<main>
  <div class="content">
    <div class="status-badge">
      <div class="dot"></div>
      Đang bảo trì hệ thống
    </div>

    <h1 th:text="${maintenanceTitle != null ? maintenanceTitle : 'Chúng tôi sẽ quay lại sớm'}">
      Chúng tôi sẽ quay lại sớm
    </h1>

    <p class="desc" th:text="${maintenanceMessage != null ? maintenanceMessage : 'Hệ thống đang được nâng cấp để phục vụ bạn tốt hơn. Vui lòng thử lại sau ít phút.'}">
      Hệ thống đang được nâng cấp để phục vụ bạn tốt hơn. Vui lòng thử lại sau ít phút.
    </p>

    <div class="eta" th:if="${maintenanceEndTime != null and !maintenanceEndTime.isEmpty()}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Dự kiến hoàn tất lúc&nbsp;<strong th:text="${maintenanceEndTime}">--:--</strong>
    </div>
  </div>
</main>

<footer>
  <span>© 2024 DealXanh · All rights reserved</span>
</footer>

</body>
</html>
